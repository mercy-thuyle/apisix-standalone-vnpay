# ═══ global_rules (5 files) ════════════════════════════════════════════════
global_rules:
  # ── src: global_rules/global-abuse-guard.yaml
# =====================================================================
#  Vòng 1 — Prioriy 1 | global_rules — GUARD CHỐNG ABUSE (áp cho mọi route & service)
#  Mục đích: chặn MỘT IP đơn lẻ làm sập hệ thống. Ngưỡng đặt RỘNG;
#  việc QoS chi tiết từng tier là của 'services' bên dưới.
#  → Ngưỡng global PHẢI cao hơn mọi trần per-IP của tier, nếu không
#    nó sẽ trở thành trần thật và làm sai thiết kế tier.
# =====================================================================
  - id: global-abuse-guard
    plugins:
      # Mức trần cho concurrent connection — KẾT NỐI ĐỒNG THỜI / IP.
      # Với object storage, đây là chỉ số saturation THẬT: 1 PUT 5GB giữ
      # connection hàng phút → 50 req/s nghe nhỏ nhưng có thể là 50 upload
      # 5GB song song. Concurrency quan trọng hơn req/s.
      limit-conn:
        conn: 1000                  # /IP — tune theo benchmark
        burst: 250                  # cho vọt thêm 50 trước khi từ chối
        default_conn_delay: 0.1     # giây — delay mỗi conn vượt ngưỡng
        key_type: var
        key: remote_addr
        rejected_code: 429        # KHÔNG để mặc định 503 → 429 cho user/dev rõ
        rejected_msg: "Too many concurrent connections from your IP"
      # GHI CHÚ: limit-conn dùng shared dict NODE-LOCAL (không có policy redis).
      # Chạy N node → ngưỡng hiệu lực mỗi node. Tính: conn_node = conn_tổng / N.

      # ── Inject route_id / service_id vào request header — PHỤC VỤ ACCESS LOG ──
      #
      # LÝ DO CẦN PLUGIN NÀY (đọc trước khi sửa/xóa):
      #   APISIX KHÔNG có sẵn nginx variable $route_id / $service_id để dùng
      #   trực tiếp trong nginx_config.http.access_log_format. route_id/service_id
      #   chỉ tồn tại dạng Lua table field (ctx.matched_route.value.id) — truy cập
      #   được trong Lua code, nhưng nginx core KHÔNG tự nhận diện $route_id như
      #   1 compiled-in variable. Khai báo "$route_id" thẳng trong access_log_format
      #   sẽ làm nginx crash lúc compile config:
      #     nginx: [emerg] unknown "route_id" variable
      #   → container rơi vào crash loop (init → init_etcd → emerg → restart → lặp lại).
      #
      # CÁCH NÀY HOẠT ĐỘNG:
      #   Chạy ở rewrite phase, TRƯỚC khi log ghi (log ghi ở log phase, cuối request).
      #   Tự set 2 header request X-Route-Id / X-Service-Id từ ctx.matched_route
      #   (đã được APISIX core populate sẵn ở routing phase, trước rewrite).
      #   access_log_format sau đó đọc qua $http_x_route_id / $http_x_service_id
      #   (tiền tố $http_* = đọc REQUEST header, không phải $sent_http_* vốn dùng
      #   cho RESPONSE header như rate-limit fields).
      #
      # ⚠ ĐẶT Ở GLOBAL_RULES (không phải từng route/service):
      #   Áp dụng 1 lần cho TẤT CẢ route — không cần sửa 20 route file riêng lẻ.
      #   Route/service có serverless-pre-function RIÊNG sẽ KHÔNG bị mất phần này
      #   vì global_rules luôn chạy kèm, không bị route/service "đè" như cách
      #   merge plugin cùng tên ở route/service (xem RULE MERGE PLUGIN trong
      #   các file route khác — global_rules không nằm trong rule đó).
      #
      # ⚠ HEADER NÀY GỬI LÊN UPSTREAM (Cloudian/Ceph) — không chỉ dùng để log:
      #   ngx.req.set_header() sửa request TRƯỚC khi proxy đi tiếp lên backend.
      #   Nếu backend không cần thấy header lạ này, cân nhắc dùng
      #   serverless-post-function (header_filter phase, set vào RESPONSE thay vì
      #   REQUEST) thay vì cách này — đánh đổi: response header thì client cũng
      #   thấy được (có thể không muốn lộ route_id ra ngoài public).
      #   Hiện tại CHƯA xử lý việc này — cần đánh giá thêm nếu thấy không phù hợp.
      #
      # KHI CẦN CHỈNH:
      #   - Đổi tên header → sửa cả 2 chỗ: ở đây VÀ trong access_log_format
      #     ($http_x_route_id phải khớp tên header X-Route-Id viết thường có gạch dưới)
      #   - Muốn thêm field khác từ ctx.matched_route (vd upstream_id nếu route dùng
      #     upstream_id thay vì upstream inline) → đọc thêm ctx.matched_route.value.*
      serverless-pre-function:
        phase: rewrite
        functions:
          - |
            return function(conf, ctx)
              ngx.req.set_header("X-Route-Id", ctx.matched_route and ctx.matched_route.value.id or "-")
              ngx.req.set_header("X-Service-Id", ctx.matched_route and ctx.matched_route.value.service_id or "-")
              -- consumer_name: giống route_id, KHÔNG phải nginx variable có sẵn ($consumer_name
              -- sẽ làm nginx crash compile y hệt $route_id). Lấy qua ctx.consumer (Lua), set
              -- header để access_log_format đọc qua $http_x_consumer thay vì gọi thẳng biến.
              -- Chỉ có giá trị khi route dùng key-auth/jwt-auth (consumer_groups); S3 SDK ký
              -- SigV4 thì ctx.consumer là nil → fallback "-".
              ngx.req.set_header("X-Consumer", ctx.consumer and ctx.consumer.username or "-")
            end

  # ── src: global_rules/global-loki-logger.yaml
# =====================================================================
#  global_rules — LOKI LOGGER (áp cho mọi route & service)
#
#  Mục đích: đẩy access log của TẤT CẢ route lên Loki tập trung.
#  Khác với prometheus (bật per-route vì không cần metric mọi route),
#  log cần thu TẤT CẢ request để phục vụ audit trail và troubleshoot
#  → đặt ở global_rules, không đặt per-route/service.
#
#  Endpoint: https://maas-service-logs.infiniband.vn (Loki của team Observability)
#  Verify:   curl -s -H "X-Scope-OrgID: vnpaycloud" \
#              https://maas-service-logs.infiniband.vn/loki/api/v1/labels
#
#  Label convention theo chuẩn team Observability:
#    vnpaycloud_product: gateway
#    vnpaycloud_service: apisix
#    vnpaycloud_team:    Cloud
#    region:             HCM | HNI  ← đổi theo DC_PROFILE
#    node:               hostname của VM
#    job:                apisix-access-log
#
#  Nội dung log gửi lên: access log JSON (đã format ở config-hcm.yaml)
#  gồm: time, remote_addr, route_id, service_id, consumer, status,
#       request_method, request_uri, host, akid, upstream_addr,
#       upstream_status, rt_limit, rt_remaining, rt_warning,
#       request_time, bytes_sent, ua
#
#  Batch: gom tối đa 1000 log hoặc mỗi 5 giây → đẩy 1 lần
#  → giảm số lần gọi HTTP, tránh overwhelm Loki khi traffic cao.
#  Nếu Loki không phản hồi → retry 3 lần, mỗi lần cách 1 giây.
#  allow_degradation (nếu có): true — Loki lỗi không ảnh hưởng request.
#
#  KHI CẦN CHỈNH:
#    - Đổi endpoint → sửa endpoint_addrs
#    - Thêm/bớt label → sửa log_labels
#    - Tăng batch → sửa batch_max_size / batch_max_age
#    - Bật auth → thêm header_attrs (Bearer token hoặc Basic)
#    - Đổi DC (HNI) → sửa region + node trong file tương ứng
# =====================================================================
  - id: global-loki-logger
    plugins:
      loki-logger:
        endpoint_addrs:
          - "https://maas-service-logs.infiniband.vn"
        tenant_id: "vnpaycloud"               # X-Scope-OrgID header
        log_labels:
          vnpaycloud_product: "gateway"
          vnpaycloud_service: "apisix"
          vnpaycloud_team: "Cloud"
          region: "${DC_PROFILE}"                       # ← đổi thành HNI cho node HNI
          # node: "sb-s3-lb-api6-hcm-1"        # ← đổi theo hostname VM
          job: "apisix-log"
        # ── Batch config ───────────────────────────────────────────────
        # Gom log trước khi đẩy — tránh gọi HTTP mỗi request
        batch_max_size: 1000                  # gom tối đa 1000 entries
        batch_max_age: 5                      # hoặc tối đa 5 giây
        # ── Retry ─────────────────────────────────────────────────────
        max_retry_count: 3
        retry_delay: 1                        # giây giữa mỗi retry
        # ── Connection ────────────────────────────────────────────────
        timeout: 3000                         # ms — timeout kết nối Loki
        ssl_verify: false                     # bỏ verify cert nội bộ
        # ── Auth (uncomment nếu Loki yêu cầu) ────────────────────────
        # header_attrs:
        #   Authorization: "Bearer <token>"
        # ── Log format ────────────────────────────────────────────────
        # include_req_body: false             # không log request body (default)
        # include_resp_body: false            # không log response body (default)

  # ── src: global_rules/global-prometheus.yaml
# global_rules/global-prometheus.yaml
# =====================================================================
#  global_rules — PROMETHEUS (áp cho mọi route & service)
#
#  Mục đích: thu metric TẤT CẢ route thay vì phải đặt prometheus: {}
#  từng route riêng lẻ.
#
#  Khác với cách hiện tại (per-route):
#    Per-route: chỉ route nào có prometheus: {} mới thu metric
#    → Phù hợp khi muốn kiểm soát cardinality (lab/debug route bỏ qua)
#
#    Global: TẤT CẢ route đều thu metric kể cả lab/debug
#    → Phù hợp khi muốn visibility đầy đủ, chấp nhận cardinality cao hơn
#
#  ⚠ NẾU BẬT FILE NÀY:
#    - Các route đang có prometheus: {} vẫn giữ nguyên, không xung đột
#      (global_rules chạy song song, không đè route plugin)
#    - Nên xóa prometheus: {} ở từng route để tránh trùng lặp metric
#    - Cardinality tăng — label `route` sẽ có thêm các lab/debug route
#
#  KHI CẦN CHỈNH:
#    - Muốn tắt global → xóa file này hoặc thêm status: 0
#    - Muốn quay về per-route → xóa file này, giữ prometheus: {} từng route
# =====================================================================
  - id: global-prometheus
    plugins:
      prometheus: {}


# ═══ consumer_groups (3 files) ════════════════════════════════════════════════
consumer_groups:
  # ── src: consumer_groups/cg-internal-batch.yaml
  # -------------------------------------------------------------------
  # Vòng 2.5 — Prioriy 3 |Gói  INTERNAL / BATCH — NỘI BỘ, log, task xóa dữ liệu ("bóp từ đáy")
  #  ⚠ CHỈ cho API control-plane CÓ key-auth. KHÔNG dùng cho S3 data-plane.
  #  Gán consumer vào gói: đặt 'group_id: cg-internal-batch' trong consumers/.
  # -------------------------------------------------------------------
  - id: cg-internal-batch
    plugins:
      # ── limit-req (leaky bucket) — KHÔNG có 4 block REDIS ──────────────────
      #  GHI CHÚ QUAN TRỌNG: limit-req là NODE-LOCAL (shared dict), KHÔNG hỗ trợ
      #  policy redis/redis-cluster như limit-count. Vì vậy gói này KHÔNG có 4
      #  block redis. Chạy N node → rate tính MỖI NODE → đặt rate = (tổng / N).
      #  Muốn quota batch chia sẻ cross-node thì phải đổi sang limit-count (redis).
      limit-req:
        rate: 50
        burst: 20
        key_type: var
        key: consumer_name
        rejected_code: 429
        rejected_msg: "Internal/batch quota exceeded"
        allow_degradation: true     # Redis lỗi → cho qua, KHÔNG 500 cả farm

  # ── src: consumer_groups/cg-premium.yaml
  # ═══════════════════════════════════════════════════════════════════════════
  #  Vòng 2.5 — Prioriy 1 | GÓI PREMIUM — khách hàng / dịch vụ real-time
  #  ⚠ CHỈ cho API control-plane CÓ key-auth. KHÔNG dùng cho S3 data-plane
  #    (S3 SDK ký SigV4, APISIX consumer không hiểu — định danh S3 ở BACKLOG).
  #  Gán consumer vào gói: đặt 'group_id: cg-premium' trong file consumers/.
  #
  # ── NẾU DÙNG REDIS CLUSTER (thay block policy: redis ở dưới bằng dạng này) ──
  # Redis client params — xem legend ở config.yaml; CHƯA CÓ REDIS → policy: local + xóa redis_*
  #   policy: redis-cluster
  #   redis_cluster_nodes:            # tối thiểu 2 node
  #     - "10.0.0.11:6379"
  #     - "10.0.0.12:6379"
  #   redis_cluster_name: "apisix-ratelimit"
  #   redis_password: "<<password-nếu có>>"
  #   redis_cluster_ssl: false
  #   redis_cluster_ssl_verify: false
  #   redis_timeout: 1000
  # -------------------------------------------------------------------
  - id: cg-premium
    plugins:
      # Đếm RIÊNG từng consumer trong group (key = consumer_name), qua REDIS.
      limit-count:
        count: 4000                               # warning mode — sát capacity; hạ để enforce (đặt cao, theo dõi qua metric)
        time_window: 1                            # giây
        key_type: var
        key: consumer_name                        # đếm RIÊNG từng consumer trong group
        rejected_code: 429
        rejected_msg: "Premium quota exceeded"
        allow_degradation: true                   # Redis lỗi → cho qua, KHÔNG 500 cả farm
        show_limit_quota_header: true             # trả X-RateLimit-* cho client/dev thấy

        # ┌── REDIS/LOCAL POLICY — CHỌN 1 TRONG 5 BLOCK (mặc định = BLOCK 2) ──┐
        # │ ⚠ CHỈ để DUY NHẤT 1 block không-comment. 2 block active = trùng    │
        # │   key 'policy:' → yamllint (key-duplicates) báo lỗi, chặn merge.   │
        # │ ⚠ Đổi block nào PHẢI đồng bộ docker-compose + redis.conf (bảng map │
        # │   trong câu trả lời / config.yaml legend).                         │
        # │   'local' = Redis tự dựng tại chỗ;  'ngoài' = Redis team có sẵn.   │
        # │   (Khác policy:local của APISIX = tắt Redis hẳn, đếm per-node.)    │
        # │   'redis' / 'redis-cluster' = Redis tự dựng hoặc ngoài.            │
        # │                                                                    │
        # │  ⚠ LƯU Ý QUAN TRỌNG KHI DÙNG policy: local (BLOCK 1):              │
        # │    - Bộ đếm lưu trong Lua shared dict của MỖI APISIX node riêng.   │
        # │    - Multi-node (scale-out) → mỗi node đếm ĐỘC LẬP, không sync.    │
        # │    - Thực tế: N node → consumer có thể gọi N × count req/window.   │
        # │    - Chỉ dùng local khi: single-node, lab/dev, hoặc chấp nhận      │
        # │      per-node counting. Prod multi-node → dùng BLOCK 2-5 (Redis).  │
        # └────────────────────────────────────────────────────────────────────┘
        # ▼▼▼ BLOCK 1 — KHÔNG CÓ REDIS, DÙNG BỘ ĐẾM LOCAL (LUA SHARED DICT) ▼▼▼
        # ⚠ CHỈ phù hợp khi chạy SINGLE APISIX NODE (dev/lab/standalone).
        # ⚠ Multi-node: mỗi node đếm riêng → effective quota = count × số_node.
        #   Nếu cần accurate rate-limit trên multi-node → PHẢI dùng Redis (BLOCK 1-4).
        # ✔ Không cần cấu hình thêm gì — xóa toàn bộ redis_* params.
        # ✔ allow_degradation: true không có ý nghĩa với local (không có external dep).
        # ✔ Shared dict backend = plugin-limit-count (khai báo trong lua_shared_dicts).
        # policy: local

        # ▼▼▼ BLOCK 2 — REDIS TỰ DỰNG (LOCAL) + SINGLE ── ĐANG DÙNG ▼▼▼
        policy: redis                             # CHƯA CÓ REDIS → 'local' + xóa redis_*
        redis_host: 127.0.0.1                     # cùng VM. Multi-VM → IP của VM Redis
        redis_port: 6379
        redis_password: "$ENV://REDIS_PASSWORD"   # đọc từ .env, KHÔNG hardcode/commit
        redis_database: 1                         # tách namespace
        redis_timeout: 1000                       # ms — gọi Redis quá 1s coi như lỗi

        # ▼▼▼ BLOCK 3 — REDIS TỰ DỰNG (LOCAL) + CLUSTER ▼▼▼
        # policy: redis-cluster
        # redis_cluster_nodes:
        #   - "127.0.0.1:7000"
        #   - "127.0.0.1:7001"
        #   - "127.0.0.1:7002"
        # redis_cluster_name: "apisix-ratelimit"
        # redis_password: "$ENV://REDIS_PASSWORD"
        # redis_timeout: 1000
        # # ⚠ cluster KHÔNG hỗ trợ redis_database (chỉ db 0).
        # # ⚠ Self-host cluster cần 6 node → xem cảnh báo trong redis.conf.

        # ▼▼▼ BLOCK 4 — REDIS NGOÀI (có sẵn) + SINGLE ▼▼▼
        # policy: redis
        # redis_host: 10.0.0.50            # IP/host Redis của team
        # redis_port: 6379
        # redis_password: "$ENV://REDIS_PASSWORD"
        # redis_database: 1
        # redis_timeout: 1000
        # redis_ssl: true                  # managed (ElastiCache/Azure) thường bắt TLS; false nếu không cần
        # redis_ssl_verify: true           # verify cert; false nếu cert private/self-signed

        # ▼▼▼ BLOCK 5 — REDIS NGOÀI (có sẵn) + CLUSTER ▼▼▼
        # policy: redis-cluster
        # redis_cluster_nodes:
        #   - "10.0.0.50:6379"
        #   - "10.0.0.51:6379"
        #   - "10.0.0.52:6379"
        # redis_cluster_name: "apisix-ratelimit"
        # redis_password: "$ENV://REDIS_PASSWORD"
        # redis_timeout: 1000
        # redis_cluster_ssl: true          # managed cluster thường bắt TLS; false nếu không cần
        # redis_cluster_ssl_verify: true   # verify cert; false nếu cert private/self-signed

  # ── src: consumer_groups/cg-standard.yaml
  # ═══════════════════════════════════════════════════════════════════════════
  # Vòng 2.5 — Prioriy 2 | Gói STANDARD — TIÊU CHUẨN (mặc định)
