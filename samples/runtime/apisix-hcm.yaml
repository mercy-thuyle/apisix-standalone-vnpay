        # redis_ssl: true                  # ← managed (ElastiCache/Azure) thường bắt TLS; false nếu không cần
        # redis_ssl_verify: true           # ← verify cert; false nếu cert private/self-signed

        # ▼▼▼ BLOCK 5 — REDIS NGOÀI (có sẵn) + CLUSTER ▼▼▼
        # policy: redis-cluster
        # redis_cluster_nodes:
        #   - "10.0.0.50:6379"
        #   - "10.0.0.51:6379"
        #   - "10.0.0.52:6379"
        # redis_cluster_name: "apisix-ratelimit"
        # redis_password: "$ENV://REDIS_PASSWORD"
        # redis_timeout: 1000
        # redis_cluster_ssl: true          # ← managed cluster thường bắt TLS; false nếu không cần
        # redis_cluster_ssl_verify: true   # ← verify cert; false nếu cert private/self-signed

      # ── Circuit breaker — KHÔNG dùng Redis (state per-node) ───────────────
      # Circuit breaker: khi backend (Ceph/Cloudian) trả 5xx liên tục thì
      # MỞ circuit, trả lỗi có kiểm soát thay vì dồn thêm tải. Đây chính là
      # cơ chế để log/metric phân biệt lỗi-hạ-tầng vs proxy-chủ-động-drop.
      api-breaker:
        break_response_code: 503
        break_response_body: "Upstream unhealthy (circuit open)"
        max_breaker_sec: 120      # thời gian mở circuit (min cho phép = 60)
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 5             # 5 lần lỗi liên tiếp → mở
        healthy:
          http_statuses: [200, 201, 204]
          successes: 3            # 3 lần OK liên tiếp → đóng lại

  # ── src: services/tier-2-ui-management.yaml
  # -------------------------------------------------------------------
  #  TIER 2 — UI / MANAGEMENT (con người thao tác)
  #  Áp cho: cmc, hyperiq, s3-admin, các *-admin UI, grafana (/d)
  #  Gắn vào route: thêm dòng 'service_id: tier-2-ui-management'.
  #  Traffic do người bấm → req/s thấp. Dùng limit-req (leaky bucket) cho mượt + limit-conn nhỏ. 
  # Body đã siết riêng ở route CMC (client-control 10MB)
  #
  #  ⚠ remote_addr / IP-based plugin: nếu có L4 LB (NGINX/HAProxy) đứng trước,
  #    PHẢI cấu hình real-ip (đã bật plugin real-ip) để lấy đúng IP client;
  #    nếu không mọi check theo IP sẽ thấy IP của LB.
  #  ⚠ Plugin đặt ở service áp cho TẤT CẢ route gắn service_id này. Route nào
  #    cần khác (vd CORS origin riêng) thì khai cùng plugin ở route → route ĐÈ
  #    HOÀN TOÀN bản ở service (không merge sâu).
  # -------------------------------------------------------------------
  - id: tier-2-ui-management
    plugins:
      # ── Rate-limit (NODE-LOCAL, không Redis) ──────────────────────────────
      limit-req:
        rate: 20                  # req/s ổn định / IP — UI con người bấm
        burst: 40                 # mở 1 trang nhiều asset → cho vọt
        key_type: var
        key: remote_addr
        rejected_code: 429
        rejected_msg: "Slow down — UI rate limit"
        allow_degradation: true

      limit-conn:
        conn: 20
        burst: 10
        default_conn_delay: 0.1
        key_type: var
        key: remote_addr
        rejected_code: 429
        rejected_msg: "Too many UI connections"
        
      # ── IP allowlist — chỉ cho dải văn phòng / VPN truy cập UI quản trị ────
      #  Thay CIDR bên dưới bằng dải thật của team. Whitelist = chặn tất cả IP
      #  KHÁC → cẩn thận tự khóa mình; thêm cả IP ops/jump host.
      ip-restriction:
        whitelist:
          - "10.0.0.0/8"          # ← LAN nội bộ (ví dụ)
          - "192.168.0.0/16"      # ← VPN (ví dụ)
          - "203.0.113.10/32"     # ← IP public văn phòng (ví dụ)
        message: "Your IP is not allowed to access this console"

      # ── Chặn bot theo User-Agent ──────────────────────────────────────────
      #  denylist là regex. bypass_missing:true → request KHÔNG có UA vẫn cho
      #  qua (health-check nội bộ thường thiếu UA). Chỉnh regex theo nhu cầu.
      ua-restriction:
        bypass_missing: true
        denylist:
          - "(?i)(bot|crawler|spider|scraper|headless)"
          - "(?i)(nikto|sqlmap|nmap|masscan|zgrab)"
        message: "Automated access is not allowed"

      # ── Referer allowlist (chống hotlink / nhúng lạ) ──────────────────────
      #  ⚠ bypass_missing:true BẮT BUỘC cho UI: gõ URL trực tiếp / bookmark sẽ
      #    KHÔNG có Referer → nếu false sẽ chặn nhầm truy cập hợp lệ.
      #  whitelist hỗ trợ wildcard '*.' ở đầu domain.
      referer-restriction:
        bypass_missing: true
        whitelist:
          - "cmc.sds.infiniband.vn"
          - "*.sds.infiniband.vn"
        message: "Invalid referer"

      # ── CORS — cho UI gọi API cross-origin ────────────────────────────────
      #  ⚠ allow_credential:true (UI cần cookie/session) KHÔNG đi cùng
      #    allow_origins:"*" → phải liệt kê origin tường minh.
      cors:
        allow_origins: "https://cmc.sds.infiniband.vn,https://hyperiq.sds.infiniband.vn"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,X-Requested-With"
        expose_headers: "X-RateLimit-Remaining,X-Request-Id"
        max_age: 3600
        allow_credential: true

      # ── (TÙY CHỌN) request-validation ─────────────────────────────────────
      #  ⚠ Đặt ở TIER áp cho MỌI route UI → dễ chặn nhầm vì mỗi route body khác
      #    nhau. Khuyến nghị đặt PER-ROUTE thay vì per-tier. Mẫu dưới chỉ validate
      #    HEADER (nhẹ, an toàn tier-wide): bắt buộc có Content-Type khi ghi.
      # request-validation:
      #   header_schema:
      #     type: object
      #     required: ["content-type"]
      #     properties:
      #       content-type:
      #         type: string
      #         pattern: "application/(json|x-www-form-urlencoded|.*)"
      #   rejected_code: 400

  # ── src: services/tier-3-internal-batch.yaml
  # -------------------------------------------------------------------
  #  TIER 3 — INTERNAL / BATCH / LEGACY (ưu tiên thấp nhất)
  #  Áp cho: route /admin* (ops API), domain legacy s3-hcm.infiniband.vn, các route lab/test/fragment, task log/xóa dữ liệu.
  #  Nguyên tắc: "BÓP TỪ ĐÁY". Off-peak mới nới (xem ghi chú off-peak dưới)
  # -------------------------------------------------------------------
  - id: tier-3-internal-batch
    plugins:
      limit-req:
        rate: 10                  # req/s / IP — chặt
        burst: 5
        key_type: var
        key: remote_addr
        rejected_code: 429
        rejected_msg: "Internal/batch quota exceeded"
        allow_degradation: true

  # -- (TÙY CHỌN) TIER 3 OFF-PEAK — profile "thả nổi" khung giờ thấp điểm --
  #  Cách dùng: agent ban đêm đổi `service_id: tier-3-internal-batch`
  #  thành `service_id: tier-3-offpeak` cho các route cần chạy task nặng,
  #  commit YAML → git-sync hot-reload. Sáng đổi ngược lại.
  - id: tier-3-offpeak
    plugins:
      limit-req:
        rate: 200                 # nới rộng cho task xóa log lớn off-peak
        burst: 100
        key_type: var
        key: remote_addr
        rejected_code: 429
        allow_degradation: true


# ═══ routes (20 files) ════════════════════════════════════════════════
routes:
  # ── src: routes/debug-dump/route-debug-dump-normalized.yaml
  # ── DEBUG normalized ─────────────────────────────────────
  # → dump request SAU KHI normalize
  # Dùng để: verify plugin s3-normalizer-bucket-name rewrite đúng chưa
  # Trigger: header "X-Debug: 1" — không ảnh hưởng production
  - id: "route-debug-dump-normalized"
    name: "debug-dump"
    status: 0                          # tắt mặc định, bật khi cần
    priority: 100
    upstream:
      type: roundrobin
      scheme: http
      pass_host: pass
      nodes:
        "127.0.0.1:9999": 1
    uri: "/*"
    hosts:
      - "s3-hcm.sds.infiniband.vn"
      - "*.s3-hcm.sds.infiniband.vn"
      - "s3-hni.sds.infiniband.vn"
      - "*.s3-hni.sds.infiniband.vn"
    vars:
      - ["http_x_debug", "==", "2"]     # X-Debug: 2 để phân biệt với raw
    plugins:
      proxy-control:
        request_buffering: false
      custom.s3-normalizer-bucket-name:  # ✅ gắn normalizer để verify rewrite
        path_hosts:
          - "s3-hcm.sds.infiniband.vn"
          - "s3-hni.sds.infiniband.vn"
        vhost_domains:
          - "s3%-hcm%.sds%.infiniband%.vn"
          - "s3%-hni%.sds%.infiniband%.vn"
      custom.s3-accesskey-extractor:
        set_header: "X-S3-Access-Key"   # header gửi lên upstream + visible trong log
        anonymous_use_ip: true           # request không có auth → fallback ip:<IP>
    timeout:
      connect: 10
      send: 30
      read: 30

  # ── src: routes/debug-dump/route-debug-dump.yaml
  # ── DEBUG raw ─────────────────────────────────────
  # → dump upstream request gốc ra từ client python http server, không normalize
  # Dùng để: verify SDK gửi đúng vhost/path-style chưa
  # Trigger: header "X-Debug: 1" — không ảnh hưởng production
  # Tắt: status: 0
  - id: "route-debug-dump"
    name: "debug-dump"
    status: 0       # tắt mặc định, bật khi cần
    priority: 100
    upstream:
      type: roundrobin
