        # redis_ssl_verify: true           # ← verify cert; false nếu cert private/self-signed

        # ▼▼▼ BLOCK 4 — REDIS NGOÀI (có sẵn) + CLUSTER ▼▼▼
        # policy: redis-cluster
        # redis_cluster_nodes:
