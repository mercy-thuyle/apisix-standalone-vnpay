# ── IAM — iam.sds.infiniband.vn — PORT 443 ────────────────────────────────────
# → CÙNG upstream-iam.sds.infiniband.vn với route -16443 (KHÔNG có backend
#   riêng cho 443 — Cloudian IAM Service vật lý chỉ lắng nghe port 16443,
#   không có gì chạy ở 443 phía backend).
#
# LÝ DO ROUTE NÀY TỒN TẠI (đọc kỹ trước khi xoá — xem thêm route -16443.yaml):
#   NGINX gốc listen CẢ 2 port (443 và 16443) trong CÙNG 1 server block,
#   cùng proxy_pass tới CÙNG 1 upstream. Client gọi domain này KHÔNG CẦN
#   chỉ định port (mặc định 443) vẫn được proxy đúng vào IAM Service thật
#   (port 16443 phía sau). Route port 443 bị xoá nhầm trong đợt tái cấu
#   trúc plugin_configs (2026-07) — phát hiện & fix cùng đợt với RC-9
#   (s3-admin) và STS, 2026-07-14.
#
# ⚠ QUAN TRỌNG: route này CHỈ để giữ tương thích ngược với client cũ có thói
#   quen không ghi port. KHÔNG tự thêm route port khác nếu không có bằng
#   chứng NGINX gốc từng hỗ trợ port đó — luôn đối chiếu nginx-full-config.txt.
#
# NGUYÊN TẮC PHÂN TÁCH: giống hệt route -16443 — plugin_config_id chứa QoS
# tập trung, plugins (route) chỉ có phần đặc thù proxy-rewrite forward IP.
  - id: "route-iam.sds.infiniband.vn-https-443"
    name: "hyperstore-cloudian-iam"
    status: 1
    service_id: "service-upstream-iam"
    # plugin_config_id trỏ đến QoS profile — chứa limit-count/api-breaker/blacklist.
    # Đổi QoS profile → chỉ sửa dòng này, không đụng plugin bên dưới.
    # Các profile có sẵn (xem apisix_routes/services/):
    #   sdk               → S3 SDK/machine traffic, phơi internet, volume cao (4000 req/s)
    #   auth              → IAM/STS/SQS, phơi internet (pre-GA), critical, có circuit breaker + blacklist
    #   internal-console  → CMC/HyperIQ/S3-Admin, INTERNAL ONLY, không whitelist/UA/referer,
    #                              chỉ limit-conn (chống nội bộ tự flood) + blacklist (phản ứng nhanh khi
    #                              1 client nội bộ lỗi/spam — nhanh hơn sửa network ACL)
    #   ops               → Script/batch nội bộ + legacy domain, siết chặt (10 req/s)
    #   ops-offpeak       → Ops off-peak ban đêm 2am-6am, nới rộng (200 req/s)
    plugin_config_id: "plugin-config-qos-auth"
    uri: "/*"
    host: "iam.sds.infiniband.vn"
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
    vars:
      - ["server_port", "==", "443"]
    plugins:
      # ── Forward IP thật lên backend S3 IAM (giống hệt route -16443) ────
      proxy-rewrite:
        headers:
          set:
            X-Real-IP: "$remote_addr"
            X-Forwarded-For: "$remote_addr"
            X-Cluster-Client-Ip: "$remote_addr"
            X-Forwarded-Proto: "$scheme"

      # ── DEBUG TẠM — log request/response body ra file riêng, giống route CMC.
      #    Dùng file-logger (không phải serverless-post-function) để tránh mọi
      #    rủi ro duplicate-key như đã gặp ở route CMC. ─────────────────────
      file-logger:
        path: "/usr/local/apisix/logs/services/iam-https-16443-debug-body.log"
        include_req_body: true
        include_resp_body: true
        log_format:
          time: "$time_iso8601"
          method: "$request_method"
          uri: "$request_uri"
          status: "$status"
          upstream_status: "$upstream_status"
          upstream_addr: "$upstream_addr"
          request_id: "$request_id"
          resp_body: "$resp_body"      # ← THIẾU dòng này — thêm vào
          req_body: "$req_body"        # ← tương tự nếu cần xem cả request body

    timeout:
      connect: 30
      send: 600
      read: 300

  # ── src: routes/hyperstore-cloudian-legacy-hcm/route-s3-hcm.infiniband.vn-https-443.yaml
  # ── s3-hcm.infiniband.vn — legacy domain (cert infiniband.vn) ────────
  # NGINX: proxy_options_s3, hyperstore-s3-subdomains.lua
  # → upstream-s3-hcm.sds.infiniband.vn (Cloudian HyperStore Legacy HCM)
  #
  # NGUYÊN TẮC PHÂN TÁCH (quan trọng — đọc trước khi sửa):
  #   service_id  → QoS/rate-limit TẬP TRUNG (limit-count, limit-conn, api-breaker...)
  #                 Sửa quota/ngưỡng → chỉnh ở services/tier-0-s3-dataplane.yaml
  #                 KHÔNG đặt limit-* ở route này.
  #   plugins     → Chỉ plugin ĐẶC THÙ của route này:
  #                   proxy-control    : tắt buffering cho large object S3
  #                   s3-normalizer    : normalize vhost→path, validate bucket
  #                   s3-accesskey-extractor : trích AKID để làm key rate-limit
  #                 Plugin nào dùng chung nhiều route → đưa vào service.
  #
  # ⚠ RULE MERGE PLUGIN: plugin CÙNG TÊN ở route ĐÈ HOÀN TOÀN bản ở service.
  #   → Không dùng route để override 1 field của limit-count trong service, phải override toàn bộ block hoặc không override gì cả.
  - id: "route-s3-hcm.infiniband.vn-https-443"
    name: "hyperstore-cloudian-legacy-hcm"
    status: 1
    service_id: "service-upstream-s3hcm"   # share backend với s3-hcm.sds — cùng service, cùng upstream
    # plugin_config_id trỏ đến QoS profile — chứa limit-req (leaky bucket, siết chặt).
    # Đổi QoS profile → chỉ sửa dòng này, không đụng plugin bên dưới.
    # Các profile có sẵn (xem apisix_routes/services/):
    #   sdk               → S3 SDK/machine traffic, phơi internet, volume cao (4000 req/s)
    #   auth              → IAM/STS/SQS, phơi internet (pre-GA), critical, có circuit breaker + blacklist
    #   internal-console  → CMC/HyperIQ/S3-Admin, INTERNAL ONLY, không whitelist/UA/referer,
    #                              chỉ limit-conn (chống nội bộ tự flood) + blacklist (phản ứng nhanh khi
    #                              1 client nội bộ lỗi/spam — nhanh hơn sửa network ACL)
    #   ops               → Script/batch nội bộ + legacy domain, siết chặt (10 req/s)
    #   ops-offpeak       → Ops off-peak ban đêm 2am-6am, nới rộng (200 req/s)
    plugin_config_id: "plugin-config-qos-sdk"
    uri: "/*"
    host: "s3-hcm.infiniband.vn"
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
    # vars:
    #   - ["scheme", "==", "https"]
    plugins:
      # ── Streaming proxy — tắt buffering, stream thẳng lên Cloudian ──────
      # BẮT BUỘC cho large object (5GB). Không có → APISIX buffer vào RAM → OOM.
      proxy-control:
        request_buffering: false

      # ── S3 normalizer — vhost→path rewrite, validate bucket name ─────────
      # Chạy ở priority 10005 (trước limit-count ở access phase).
      # path_hosts : hostname exact match cho path-style request
      # vhost_domains : Lua pattern suffix cho vhost-style (phải escape . và -)
      custom.s3-normalizer-bucket-name:
        path_hosts:
          - "s3-hcm.infiniband.vn"
        vhost_domains:
          - "s3%-hcm%.infiniband%.vn"

      # ── Bucket → Consumer resolver — CHỈ có tác dụng nếu bucket đã đăng ký
      # thủ công trong consumers.yaml (prefix "bucket-"). Bucket lạ → no-op,
      # fallback policy mặc định ở plugin_config-qos-sdk. Chạy priority 9500,
      # SAU normalizer (10005) — cần ctx.s3_bucket_name đã được set.
      custom.s3-bucket-name-consumer: {}   # marker rỗng, không cần config route-level

      # ── AKID extractor — trích Access Key ID để làm key rate-limit ───────
      # Chạy ở rewrite phase (priority 2510) → trước limit-count (access phase).
      # Hỗ trợ: SigV4 header, SigV2 header, presigned URL (X-Amz-Credential).
      # Anonymous (không có auth) → fallback "ip:<remote_addr>".
      # set_header: gửi X-S3-Access-Key lên upstream (visible trong access log
      #   qua $http_x_s3_access_key — dùng để debug, không ảnh hưởng SigV4).
      custom.s3-accesskey-extractor:
        set_header: "X-S3-Access-Key"   # header gửi lên upstream + visible trong log
        anonymous_use_ip: true           # request không có auth → fallback ip:<IP>

    timeout:
      connect: 60
      send: 600
      read: 600

  # ── src: routes/hyperstore-cloudian-sqs/route-sqs.sds.infiniband.vn-https-18090.yaml
  # ── SQS — sqs.sds.infiniband.vn ─────────────────────────────────────
  # → upstream-sqs.sds.infiniband.vn
  # NGINX: HTTP only, port 80 (SQS backend không có TLS termination riêng)
  #
  # → plugin_config: pc-qos-auth (limit-count/api-breaker/soft-limit, SHARED với IAM + STS)
