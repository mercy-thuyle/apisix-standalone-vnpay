# ═══ global_rules (1 files) ════════════════════════════════════════════════
global_rules:
  # ── src: global_rules/global-abuse-guard.yaml
# =====================================================================
#  global_rules — GUARD CHỐNG ABUSE (áp cho mọi route & service)
#  Mục đích: chặn MỘT IP đơn lẻ làm sập hệ thống. Ngưỡng đặt RỘNG;
#  việc QoS chi tiết từng tier là của 'services' bên dưới.
#  → Ngưỡng global PHẢI cao hơn mọi trần per-IP của tier, nếu không
#    nó sẽ trở thành trần thật và làm sai thiết kế tier.
# =====================================================================
  - id: global-abuse-guard
    plugins:
      # Mức trần cho concurrent connection — KẾT NỐI ĐỒNG THỜI / IP.
      # Với object storage, đây là chỉ số saturation THẬT: 1 PUT 5GB giữ
      # connection hàng phút → 50 req/s nghe nhỏ nhưng có thể là 50 upload
      # 5GB song song. Concurrency quan trọng hơn req/s.
      limit-conn:
        conn: 200                 # /IP — tune theo benchmark
        burst: 50                 # cho vọt thêm 50 trước khi từ chối
        default_conn_delay: 0.1   # giây — delay mỗi conn vượt ngưỡng
        key_type: var
        key: remote_addr
        rejected_code: 429        # KHÔNG để mặc định 503 → 429 cho user/dev rõ
        rejected_msg: "Too many concurrent connections from your IP"
      # GHI CHÚ: limit-conn dùng shared dict NODE-LOCAL (không có policy redis).


# ═══ consumer_groups (3 files) ════════════════════════════════════════════════
consumer_groups:
  # ── src: consumer_groups/cg-internal-batch.yaml
  # -------------------------------------------------------------------
  # Gói  INTERNAL / BATCH — NỘI BỘ, log, task xóa dữ liệu ("bóp từ đáy")
  #  ⚠ CHỈ cho API control-plane CÓ key-auth. KHÔNG dùng cho S3 data-plane.
  #  Gán consumer vào gói: đặt 'group_id: cg-internal-batch' trong consumers/.
  # -------------------------------------------------------------------
  - id: cg-internal-batch
    plugins:
      # ── limit-req (leaky bucket) — KHÔNG có 4 block REDIS ──────────────────
      #  GHI CHÚ QUAN TRỌNG: limit-req là NODE-LOCAL (shared dict), KHÔNG hỗ trợ
      #  policy redis/redis-cluster như limit-count. Vì vậy gói này KHÔNG có 4
      #  block redis. Chạy N node → rate tính MỖI NODE → đặt rate = (tổng / N).
      #  Muốn quota batch chia sẻ cross-node thì phải đổi sang limit-count (redis).
      limit-req:
        rate: 50
        burst: 20
        key_type: var
        key: consumer_name
        rejected_code: 429
        rejected_msg: "Internal/batch quota exceeded"
        allow_degradation: true     # Redis lỗi → cho qua, KHÔNG 500 cả farm

  # ── src: consumer_groups/cg-premium.yaml
  # ═══════════════════════════════════════════════════════════════════════════
  #  GÓI PREMIUM — khách hàng / dịch vụ real-time
  #  ⚠ CHỈ cho API control-plane CÓ key-auth. KHÔNG dùng cho S3 data-plane
  #    (S3 SDK ký SigV4, APISIX consumer không hiểu — định danh S3 ở BACKLOG).
  #  Gán consumer vào gói: đặt 'group_id: cg-premium' trong file consumers/.
  #
  # ── NẾU DÙNG REDIS CLUSTER (thay block policy: redis ở dưới bằng dạng này) ──
  # Redis client params — xem legend ở config.yaml; CHƯA CÓ REDIS → policy: local + xóa redis_*
  #   policy: redis-cluster
  #   redis_cluster_nodes:            # tối thiểu 2 node
  #     - "10.0.0.11:6379"
  #     - "10.0.0.12:6379"
  #   redis_cluster_name: "apisix-ratelimit"
  #   redis_password: "<<password-nếu có>>"
  #   redis_cluster_ssl: false
  #   redis_cluster_ssl_verify: false
  #   redis_timeout: 1000
  # -------------------------------------------------------------------
  - id: cg-premium
    plugins:
      # Đếm RIÊNG từng consumer trong group (key = consumer_name), qua REDIS.
      limit-count:
        count: 4000                               # warning mode — sát capacity; hạ để enforce (đặt cao, theo dõi qua metric)
        time_window: 1                            # giây
        key_type: var
        key: consumer_name                        # đếm RIÊNG từng consumer trong group
        rejected_code: 429
        rejected_msg: "Premium quota exceeded"
        allow_degradation: true                   # Redis lỗi → cho qua, KHÔNG 500 cả farm
        show_limit_quota_header: true             # trả X-RateLimit-* cho client/dev thấy

        # ┌── REDIS/LOCAL POLICY — CHỌN 1 TRONG 5 BLOCK (mặc định = BLOCK 2) ──┐
        # │ ⚠ CHỈ để DUY NHẤT 1 block không-comment. 2 block active = trùng    │
        # │   key 'policy:' → yamllint (key-duplicates) báo lỗi, chặn merge.   │
        # │ ⚠ Đổi block nào PHẢI đồng bộ docker-compose + redis.conf (bảng map │
        # │   trong câu trả lời / config.yaml legend).                         │
        # │   'local' = Redis tự dựng tại chỗ;  'ngoài' = Redis team có sẵn.   │
        # │   (Khác policy:local của APISIX = tắt Redis hẳn, đếm per-node.)    │
        # │   'redis' / 'redis-cluster' = Redis tự dựng hoặc ngoài.            │
        # │                                                                    │
        # │  ⚠ LƯU Ý QUAN TRỌNG KHI DÙNG policy: local (BLOCK 1):              │
        # │    - Bộ đếm lưu trong Lua shared dict của MỖI APISIX node riêng.   │
        # │    - Multi-node (scale-out) → mỗi node đếm ĐỘC LẬP, không sync.    │
        # │    - Thực tế: N node → consumer có thể gọi N × count req/window.   │
        # │    - Chỉ dùng local khi: single-node, lab/dev, hoặc chấp nhận      │
        # │      per-node counting. Prod multi-node → dùng BLOCK 2-5 (Redis).  │
        # └────────────────────────────────────────────────────────────────────┘
        # ▼▼▼ BLOCK 1 — KHÔNG CÓ REDIS, DÙNG BỘ ĐẾM LOCAL (LUA SHARED DICT) ▼▼▼
        # ⚠ CHỈ phù hợp khi chạy SINGLE APISIX NODE (dev/lab/standalone).
        # ⚠ Multi-node: mỗi node đếm riêng → effective quota = count × số_node.
        #   Nếu cần accurate rate-limit trên multi-node → PHẢI dùng Redis (BLOCK 1-4).
        # ✔ Không cần cấu hình thêm gì — xóa toàn bộ redis_* params.
        # ✔ allow_degradation: true không có ý nghĩa với local (không có external dep).
        # ✔ Shared dict backend = plugin-limit-count (khai báo trong lua_shared_dicts).
        # policy: local

        # ▼▼▼ BLOCK 2 — REDIS TỰ DỰNG (LOCAL) + SINGLE ── ĐANG DÙNG ▼▼▼
        policy: redis                             # CHƯA CÓ REDIS → 'local' + xóa redis_*
        redis_host: 127.0.0.1                     # cùng VM. Multi-VM → IP của VM Redis
        redis_port: 6379
        redis_password: "$ENV://REDIS_PASSWORD"   # đọc từ .env, KHÔNG hardcode/commit
        redis_database: 1                         # tách namespace
        redis_timeout: 1000                       # ms — gọi Redis quá 1s coi như lỗi

        # ▼▼▼ BLOCK 3 — REDIS TỰ DỰNG (LOCAL) + CLUSTER ▼▼▼
        # policy: redis-cluster
        # redis_cluster_nodes:
        #   - "127.0.0.1:7000"
        #   - "127.0.0.1:7001"
        #   - "127.0.0.1:7002"
        # redis_cluster_name: "apisix-ratelimit"
        # redis_password: "$ENV://REDIS_PASSWORD"
        # redis_timeout: 1000
        # # ⚠ cluster KHÔNG hỗ trợ redis_database (chỉ db 0).
        # # ⚠ Self-host cluster cần 6 node → xem cảnh báo trong redis.conf.

        # ▼▼▼ BLOCK 4 — REDIS NGOÀI (có sẵn) + SINGLE ▼▼▼
        # policy: redis
        # redis_host: 10.0.0.50            # IP/host Redis của team
        # redis_port: 6379
        # redis_password: "$ENV://REDIS_PASSWORD"
        # redis_database: 1
        # redis_timeout: 1000
        # redis_ssl: true                  # managed (ElastiCache/Azure) thường bắt TLS; false nếu không cần
        # redis_ssl_verify: true           # verify cert; false nếu cert private/self-signed

        # ▼▼▼ BLOCK 5 — REDIS NGOÀI (có sẵn) + CLUSTER ▼▼▼
        # policy: redis-cluster
        # redis_cluster_nodes:
        #   - "10.0.0.50:6379"
        #   - "10.0.0.51:6379"
        #   - "10.0.0.52:6379"
        # redis_cluster_name: "apisix-ratelimit"
        # redis_password: "$ENV://REDIS_PASSWORD"
        # redis_timeout: 1000
        # redis_cluster_ssl: true          # managed cluster thường bắt TLS; false nếu không cần
        # redis_cluster_ssl_verify: true   # verify cert; false nếu cert private/self-signed


  # ── src: consumer_groups/cg-standard.yaml
  # ═══════════════════════════════════════════════════════════════════════════
  # Gói STANDARD — TIÊU CHUẨN (mặc định)
  #  ⚠ CHỈ cho API control-plane CÓ key-auth. KHÔNG dùng cho S3 data-plane.
  #  Gán consumer vào gói: đặt 'group_id: cg-standard' trong file consumers/.
  #
  # ── NẾU DÙNG REDIS CLUSTER (thay block policy: redis ở dưới bằng dạng này) ──
  # Redis client params — xem legend ở config.yaml; CHƯA CÓ REDIS → policy: local + xóa redis_*
  #   policy: redis-cluster
  #   redis_cluster_nodes:            # tối thiểu 2 node
  #     - "10.0.0.11:6379"
  #     - "10.0.0.12:6379"
  #   redis_cluster_name: "apisix-ratelimit"
  #   redis_password: "<<password-nếu có>>"
  #   redis_cluster_ssl: false
  #   redis_cluster_ssl_verify: false
  #   redis_timeout: 1000
  # -------------------------------------------------------------------
  - id: cg-standard
    plugins:
      limit-count:
        count: 500                       # warning mode — sát capacity; hạ để enforce (đặt cao, theo dõi qua metric)
        time_window: 1                   # giây
        key_type: var
        key: consumer_name               # đếm RIÊNG từng consumer trong group
        rejected_code: 429
        rejected_msg: "Standard quota exceeded"
        allow_degradation: true          # Redis lỗi → cho qua, KHÔNG 500 cả farm
        show_limit_quota_header: true    # trả X-RateLimit-* cho client/dev thấy

        # ┌── REDIS/LOCAL POLICY — CHỌN 1 TRONG 5 BLOCK (mặc định = BLOCK 2) ──┐
        # │ ⚠ CHỈ để DUY NHẤT 1 block không-comment. 2 block active = trùng    │
        # │   key 'policy:' → yamllint (key-duplicates) báo lỗi, chặn merge.   │
        # │ ⚠ Đổi block nào PHẢI đồng bộ docker-compose + redis.conf (bảng map │
        # │   trong câu trả lời / config.yaml legend).                         │
        # │   'local' = Redis tự dựng tại chỗ;  'ngoài' = Redis team có sẵn.   │
        # │   (Khác policy:local của APISIX = tắt Redis hẳn, đếm per-node.)    │
        # │   'redis' / 'redis-cluster' = Redis tự dựng hoặc ngoài.            │
        # │                                                                    │
        # │  ⚠ LƯU Ý QUAN TRỌNG KHI DÙNG policy: local (BLOCK 1):              │
        # │    - Bộ đếm lưu trong Lua shared dict của MỖI APISIX node riêng.   │
        # │    - Multi-node (scale-out) → mỗi node đếm ĐỘC LẬP, không sync.    │
        # │    - Thực tế: N node → consumer có thể gọi N × count req/window.   │
        # │    - Chỉ dùng local khi: single-node, lab/dev, hoặc chấp nhận      │
        # │      per-node counting. Prod multi-node → dùng BLOCK 2-5 (Redis).  │
        # └────────────────────────────────────────────────────────────────────┘
        # ▼▼▼ BLOCK 1 — KHÔNG CÓ REDIS, DÙNG BỘ ĐẾM LOCAL (LUA SHARED DICT) ▼▼▼
        # ⚠ CHỈ phù hợp khi chạy SINGLE APISIX NODE (dev/lab/standalone).
        # ⚠ Multi-node: mỗi node đếm riêng → effective quota = count × số_node.
        #   Nếu cần accurate rate-limit trên multi-node → PHẢI dùng Redis (BLOCK 1-4).
        # ✔ Không cần cấu hình thêm gì — xóa toàn bộ redis_* params.
        # ✔ allow_degradation: true không có ý nghĩa với local (không có external dep).
        # ✔ Shared dict backend = plugin-limit-count (khai báo trong lua_shared_dicts).
        # policy: local

        # ▼▼▼ BLOCK 1 — REDIS TỰ DỰNG (LOCAL) + SINGLE ── ĐANG DÙNG ▼▼▼
        policy: redis                             # CHƯA CÓ REDIS → 'local' + xóa redis_*
        redis_host: 127.0.0.1                     # cùng VM. Multi-VM → IP của VM Redis
        redis_port: 6379
        redis_password: "$ENV://REDIS_PASSWORD"   # đọc từ .env, KHÔNG hardcode/commit
        redis_database: 1                         # tách namespace
        redis_timeout: 1000                       # ms — gọi Redis quá 1s coi như lỗi

        # ▼▼▼ BLOCK 2 — REDIS TỰ DỰNG (LOCAL) + CLUSTER ▼▼▼
        # policy: redis-cluster
        # redis_cluster_nodes:
        #   - "127.0.0.1:7000"
        #   - "127.0.0.1:7001"
        #   - "127.0.0.1:7002"
        # redis_cluster_name: "apisix-ratelimit"
        # redis_password: "$ENV://REDIS_PASSWORD"
        # redis_timeout: 1000
        # # ⚠ cluster KHÔNG hỗ trợ redis_database (chỉ db 0).
        # # ⚠ Self-host cluster cần 6 node → xem cảnh báo trong redis.conf.

        # ▼▼▼ BLOCK 3 — REDIS NGOÀI (có sẵn) + SINGLE ▼▼▼
        # policy: redis
        # redis_host: 10.0.0.50            # ← IP/host Redis của team
        # redis_port: 6379
        # redis_password: "$ENV://REDIS_PASSWORD"
        # redis_database: 1
        # redis_timeout: 1000
        # redis_ssl: true                  # ← managed (ElastiCache/Azure) thường bắt TLS; false nếu không cần
        # redis_ssl_verify: true           # ← verify cert; false nếu cert private/self-signed

        # ▼▼▼ BLOCK 4 — REDIS NGOÀI (có sẵn) + CLUSTER ▼▼▼
        # policy: redis-cluster
        # redis_cluster_nodes:
        #   - "10.0.0.50:6379"
        #   - "10.0.0.51:6379"
        #   - "10.0.0.52:6379"
        # redis_cluster_name: "apisix-ratelimit"
        # redis_password: "$ENV://REDIS_PASSWORD"
        # redis_timeout: 1000
        # redis_cluster_ssl: true          # ← managed cluster thường bắt TLS; false nếu không cần
        # redis_cluster_ssl_verify: true   # ← verify cert; false nếu cert private/self-signed


# ═══ consumers (3 files) ════════════════════════════════════════════════
consumers:
