    plugins:
      key-auth:
        key: "automation_reporting-apikey-change-me-before-use"

  # ── src: consumers/customer_acme.yaml
  # Mỗi consumer = 1 account/service. group_id chính là "bảng mapping" quota.
  - username: customer_acme
    group_id: cg-premium
    plugins:
      key-auth:
        key: "customer_acme-apikey-change-me-before-use"

  # ── src: consumers/internal_logcleaner.yaml
  # Mỗi consumer = 1 account/service. group_id chính là "bảng mapping" quota.
  - username: internal_logcleaner
    group_id: cg-internal-batch
    plugins:
      key-auth:
        key: "internal_logcleaner-apikey-change-me-before-use"


