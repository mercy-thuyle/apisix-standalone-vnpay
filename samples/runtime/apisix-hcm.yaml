  # ── src: routes/hyperstore-cloudian-cmc/route-cmc.sds.infiniband.vn-https.yaml
  # ── CMC — cmc.sds.infiniband.vn ─────────────────────────────────────
  # → upstream-cmc.sds.infiniband.vn
  # NGINX: proxy_options_default, cmc-conf.lua (JSESSIONID nohttponly)
  - id: "route-cmc.sds.infiniband.vn-https"
    name: "hyperstore-cloudian-cmc"
    status: 1
    upstream_id: "upstream-cmc.sds.infiniband.vn"
    uri: "/*"
    host: "cmc.sds.infiniband.vn"
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
    plugins:
      client-control:
        max_body_size: 10485760   # 10MB = 10 * 1024 * 1024
      proxy-rewrite:
        headers:
          set:
            X-Real-IP: "$remote_addr"
            X-Forwarded-For: "$remote_addr"
            X-Cluster-Client-Ip: "$remote_addr"
            X-Forwarded-Proto: "$scheme"
      # cmc-conf.lua: proxy_cookie_flags JSESSIONID nohttponly
      # Strip HttpOnly từ JSESSIONID Set-Cookie header
      serverless-post-function:
        phase: header_filter
        functions:
          - |
            return function(conf, ctx)
              local header = ngx.header["Set-Cookie"]
              if not header then return end
              local function strip_httponly(cookie)
                return cookie:gsub(";%s*[Hh]ttp[Oo]nly", "")
              end
              if type(header) == "table" then
                for i, v in ipairs(header) do
                  if v:find("JSESSIONID") then
                    header[i] = strip_httponly(v)
                  end
                end
              elseif type(header) == "string" and header:find("JSESSIONID") then
                ngx.header["Set-Cookie"] = strip_httponly(header)
              end
            end
      prometheus: {}
      custom.cmc-validator-bucket-name: {}
    timeout:
      connect: 30
      send: 600
      read: 300

  # ── src: routes/hyperstore-cloudian-hcm/route-s3-hcm.sds.infiniband.vn-http-proxy.yaml
  # ── HCM — s3-hcm.sds.infiniband.vn  ─────────────────────────────────────
  # → upstream-s3-hcm.sds.infiniband.vn (Cloudian HyperStore HCM)
  # HTTP proxy (:80) — redirect hoặc S3 SDK không bật TLS (active khi redirect tắt)
  #
  # NGUYÊN TẮC PHÂN TÁCH (quan trọng — đọc trước khi sửa):
  #   service_id  → QoS/rate-limit TẬP TRUNG (limit-count, limit-conn, api-breaker...)
  #                 Sửa quota/ngưỡng → chỉnh ở services/tier-0-s3-dataplane.yaml
  #                 KHÔNG đặt limit-* ở route này.
  #   plugins     → Chỉ plugin ĐẶC THÙ của route này:
  #                   proxy-control    : tắt buffering cho large object S3
  #                   s3-normalizer    : normalize vhost→path, validate bucket
  #                   s3-accesskey-extractor : trích AKID để làm key rate-limit
  #                 Plugin nào dùng chung nhiều route → đưa vào service.
  #
  # ⚠ RULE MERGE PLUGIN: plugin CÙNG TÊN ở route ĐÈ HOÀN TOÀN bản ở service.
  #   → Không dùng route để override 1 field của limit-count trong service, phải override toàn bộ block hoặc không override gì cả.
  - id: "route-s3-hcm.sds.infiniband.vn-http-proxy"
    name: "hyperstore-cloudian-hcm"
    status: 1
    priority: 0
    upstream_id: "upstream-s3-hcm.sds.infiniband.vn"
    # service_id trỏ đến QoS profile — chứa limit-count/limit-conn/api-breaker
    # Đổi QoS profile → chỉ sửa dòng này, không đụng plugin bên dưới.
    # Các profile có sẵn (xem apisix_routes/services/):
    #   svc-s3-sdk      → S3 SDK/machine traffic, volume cao (4000 req/s)
    #   svc-s3-auth     → IAM/STS/SQS, critical, có circuit breaker
    #   svc-s3-console  → Browser/UI, có IP whitelist + bot protection
    #   svc-s3-ops      → Script/batch nội bộ, siết chặt (10 req/s)
    #   svc-s3-ops-offpeak → Ops off-peak ban đêm, nới rộng (200 req/s)
    service_id: "svc-s3-sdk"
    uri: "/*"
    hosts:
      - "s3-hcm.sds.infiniband.vn"
      - "*.s3-hcm.sds.infiniband.vn"
    vars:
      - ["scheme", "==", "http"]
    plugins:
      # ── Streaming proxy — tắt buffering, stream thẳng lên Cloudian ──────
      # BẮT BUỘC cho large object (5GB). Không có → APISIX buffer vào RAM → OOM.
      proxy-control:
        request_buffering: false

      # ── S3 normalizer — vhost→path rewrite, validate bucket name ─────────
      # Chạy ở priority 10005 (trước limit-count ở access phase).
      # path_hosts : hostname exact match cho path-style request
      # vhost_domains : Lua pattern suffix cho vhost-style (phải escape . và -)
      custom.s3-normalizer-bucket-name:
        path_hosts:
          - "s3-hcm.sds.infiniband.vn"
        vhost_domains:
          - "s3%-hcm%.sds%.infiniband%.vn"

      # ── AKID extractor — trích Access Key ID để làm key rate-limit ───────
      # Chạy ở rewrite phase (priority 2510) → trước limit-count (access phase).
      # Hỗ trợ: SigV4 header, SigV2 header, presigned URL (X-Amz-Credential).
      # Anonymous (không có auth) → fallback "ip:<remote_addr>".
      # set_header: gửi X-S3-Access-Key lên upstream (visible trong access log
      #   qua $http_x_s3_access_key — dùng để debug, không ảnh hưởng SigV4).
      custom.s3-accesskey-extractor:
        set_header: "X-S3-Access-Key"   # header gửi lên upstream + visible trong log
        anonymous_use_ip: true           # request không có auth → fallback ip:<IP>

    timeout:
      connect: 60
      send: 600
      read: 600

  # ── src: routes/hyperstore-cloudian-hcm/route-s3-hcm.sds.infiniband.vn-https-proxy.yaml
  # ── HCM — s3-hcm.sds.infiniband.vn  ─────────────────────────────────────
