# ═══ services (4 files) ════════════════════════════════════════════════
services:
  # ── src: services/svc-s3-auth.yaml
  # ═══════════════════════════════════════════════════════════════════════════
  # svc-s3-auth — QoS profile cho IAM / STS / SQS traffic
  # ═══════════════════════════════════════════════════════════════════════════
  #
  #  AI GỌI:   Machine — S3 SDK / app lấy credential, assume role, gửi message.
  #             Gọi ÍT HƠN svc-s3-sdk nhưng CỰC KỲ CRITICAL:
  #             IAM/STS chết = mọi S3 SDK không lấy được token = toàn hệ thống chết.
  #
  #  ÁP CHO ROUTE:  iam.sds.infiniband.vn      (443 + 16443)
  #                 sts.sds.infiniband.vn      (443 + 16443)
  #                 sqs.sds.infiniband.vn      (80)
  #
  #  ⚠ EXPOSURE: PHƠI INTERNET, hiện đang pre-GA (traffic thấp, chưa official).
  #  Traffic thấp KHÔNG đồng nghĩa rủi ro thấp — đây là giai đoạn RẺ NHẤT để
  #  siết cấu hình an toàn trước khi traffic tăng lên và noise từ log khó phân
  #  biệt spike thật với baseline. Ngưỡng soft-limit trong file này được hạ
  #  xuống (xem phần serverless-post-function) để bắt sớm mọi bất thường.
  #
  #  CÁCH GẮN VÀO ROUTE:
  #    service_id: "svc-s3-auth"
  #
  #  NGUYÊN TẮC QoS:
  #    AUTH CHẾT = CẢ HỆ THỐNG CHẾT → limit VỪA PHẢI, không bóp nghẹt. 
  #    KHÔNG bóp nghẹt. Ngưỡng 500/s là đủ cho auth traffic thực tế.
  #    Nếu auth traffic vượt 500/s → có vấn đề (retry storm, bug SDK) → nên alert.
  #    api-breaker: phân biệt "Cloudian IAM backend nghẽn" vs "APISIX proxy chủ động drop"
  #    → khi backend trả 5xx liên tục → mở circuit → trả lỗi có kiểm soát
  #    → metric/log thấy rõ nguồn lỗi.
  #
  #  ── CHIẾN LƯỢC 2 LỚP: SOFT-LIMIT → HARD-LIMIT ────────────────────────────
  #
  #  NGƯỠNG SOFT-LIMIT — PRE-GA PHASE (đã hạ so với baseline GA gốc 50%/70%):
  #    INFO: ≥ 20% = 100 req/s → bất kỳ traffic nào cũng đáng quan sát ở pre-GA
  #    WARN: ≥ 50% = 250 req/s → traffic bất thường, kiểm tra retry loop/bug SDK
  #
  #  ⚠ KHI GA CHÍNH THỨC + có baseline p95 thật: nâng ngưỡng lại theo hướng dẫn
  #  trong block serverless-post-function bên dưới, tránh log spam khi traffic
  #  hợp lệ tăng lên đúng kỳ vọng thiết kế ban đầu (500 req/s hard-limit).
  #
  #  ── KHI THẤY WARN trong error.log ──────────────────────────────────────
  #  grep '[rate-limit-warning] service=auth' logs/apisix-hcm/error.log
  #  → Kiểm tra IP nào đang gọi auth nhiều
  #  → Có thể là: SDK retry vô hạn, token cache bị disable, credential rotate,
  #    hoặc brute-force dò AKID (đáng chú ý hơn ở pre-GA vì traffic thật ~0)
  #  → Liên hệ team để điều tra trước khi chạm hard-limit 500/s → 429
  #
  #  ── api-breaker — QUAN TRỌNG ────────────────────────────────────────────
  #  Phân biệt "IAM backend nghẽn" vs "APISIX chủ động drop":
  #  503 từ circuit breaker ≠ 429 từ rate-limit ≠ 5xx từ backend
  #  → Metric/log phân biệt được nguồn lỗi
  #  → Sau 120s hoặc 3 request OK → circuit tự đóng
  #
  #  ⚠ LƯU Ý — SHARED CIRCUIT STATE: route IAM/STS dùng chung upstream-iam,
  #  route SQS dùng upstream-sqs riêng — nhưng CẢ 5 route (iam×2, sts×2, sqs×1)
  #  cùng gắn service_id: svc-s3-auth nên api-breaker + limit-count CHIA SẺ
  #  chung trạng thái Redis theo key remote_addr/consumer bất kể route nào.
  #  Nếu SQS backend lỗi mạnh gây breaker mở, KHÔNG ảnh hưởng IAM/STS vì
  #  api-breaker tính theo upstream response thực tế của từng route request,
  #  không tính chung theo service — nhưng limit-count (đếm req/s theo IP)
  #  THẬT SỰ dùng chung quota giữa cả 5 route (1 IP gọi cả IAM lẫn SQS sẽ cộng
  #  dồn vào cùng 1 bucket 500 req/s). Nếu sau này thấy cần tách quota riêng
  #  IAM/STS vs SQS, cân nhắc tách thành svc-s3-auth-iam-sts + svc-s3-auth-sqs.
  #
  #  ── INCIDENT HISTORY (đọc trước khi sửa ip-restriction) ──────────────────
  #  2026-07-03 16:00 UTC: production outage cả HCM+HNI do khai
  #  `ip-restriction.blacklist: []` (mảng rỗng). APISIX ip-restriction plugin
  #  schema yêu cầu blacklist minItems:1 — lyaml serialize [] thành {} (sai
  #  type), khiến service FAIL schema validation tại init_worker. TOÀN BỘ route
  #  gắn service_id: svc-s3-auth trả "failed to fetch service configuration"
  #  (404-like). Root cause KHÔNG bị chặn bởi merge-fragments.sh Pass 1 (chỉ
  #  check YAML syntax, không check APISIX plugin schema).
  #  → QUY TẮC: KHÔNG BAO GIỜ khai ip-restriction.blacklist rỗng làm placeholder.
  #  → Nếu chưa có IP cần chặn, COMMENT TOÀN BỘ block (xem mẫu bên dưới) thay vì
  #    khai với giá trị rỗng.
  #
  #  KHI CẦN CHỈNH:
  #    - Tăng ngưỡng → sửa `count`
  #    - Đổi Redis → xem block REDIS POLICY
  #    - Circuit breaker → sửa block api-breaker
  #    - Chặn 1 IP cụ thể → bỏ comment block ip-restriction, điền IP thật
  #
  # ── NẾU DÙNG REDIS CLUSTER (thay block policy: redis ở dưới bằng dạng này) ──
  # Redis client params — xem legend ở config.yaml; CHƯA CÓ REDIS → policy: local + xóa redis_*
  #   policy: redis-cluster
  #   redis_cluster_nodes:            # tối thiểu 2 node
  #     - "10.0.0.11:6379"
  #     - "10.0.0.12:6379"
  #   redis_cluster_name: "apisix-ratelimit"
  #   redis_password: "<<password-nếu-có>>"
  #   redis_cluster_ssl: false
  #   redis_cluster_ssl_verify: false
  #   redis_timeout: 1000
  # ═══════════════════════════════════════════════════════════════════════════
  - id: svc-s3-auth
    plugins:

      # ── (0) IP BLACKLIST — TẠM KHÔNG KHAI BÁO (xem INCIDENT HISTORY ở trên) ──
      # ⚠ ROOT CAUSE của outage 2026-07-03: blacklist: [] (mảng rỗng) làm FAIL
      #   schema validation minItems:1, khiến TOÀN BỘ 5 route auth 404.
      # KHÔNG bỏ comment block dưới đây trừ khi đã có ÍT NHẤT 1 IP thật cần chặn.
      # Sau khi điền IP, PHẢI test bằng merge-fragments.sh cục bộ + validate
      # schema (xem quy trình CI/pre-commit) trước khi push lên remote.
      #
      # ip-restriction:
      #   blacklist:
      #     - "10.x.x.x/32"       # điền IP thật — KHÔNG để mảng rỗng
      #   message: "Access denied"

      # ── (1) Request rate / IP — giới hạn req/s ───────────────────────────
      # Key: remote_addr (auth thường từ ít IP — app server, không phải AKID)
      # Lý do dùng IP thay vì AKID: auth call đến trước khi có token/AKID
      limit-count:
        count: 500                      # hard-limit: req/s / IP — đủ cho auth thực tế
        time_window: 1                  # giây
        key_type: var
        key: remote_addr
        rejected_code: 429
        rejected_msg: "Auth/control rate limit exceeded (500 req/s). If experiencing high retry rates, check for SDK retry loops or credential refresh storms."
        allow_degradation: true          # Redis lỗi → cho qua, KHÔNG 500 cả farm
        show_limit_quota_header: true    # trả X-RateLimit-* cho client/dev thấy, # BẮT BUỘC: serverless đọc header này

      # ── (2) SOFT-LIMIT — Warning sớm cho auth traffic ─────────────────────
      # Auth không có anonymous (không có presigned URL, không có public bucket).
      # Chỉ cần 1 nhánh: authenticated theo IP.
      #
      # NGƯỠNG HIỆN TẠI — PRE-GA PHASE (đã hạ so với thiết kế gốc 50%/70%):
      #   INFO: ≥ 20% = 100 req/s → SDK/script gọi bất kỳ mức nào cũng đáng ghi
      #   WARN: ≥ 50% = 250 req/s → gần chắc chắn retry storm / bug SDK / dò AKID
      #
      # LÝ DO HẠ NGƯỠNG: traffic thật hiện tại gần 0 (pre-GA, chưa official).
      # Đây là giai đoạn RẺ NHẤT để quan sát và siết sớm — mọi traffic bất
      # thường đều dễ phát hiện khi baseline gần như phẳng.
      #
      # ⚠ KHI GA CHÍNH THỨC (đã có SDK khách hàng dùng thật, baseline 5-50 req/s
      # rõ ràng): nâng ngưỡng về:
      #   warn_pct = 70   -- % của 500 = 350 req/s
      #   info_pct = 50   -- % của 500 = 250 req/s
      # Tránh log spam khi traffic hợp lệ tăng đúng như kỳ vọng thiết kế.
      serverless-post-function:
        phase: header_filter
        functions:
          - |
            return function(conf, ctx)
              local remaining = tonumber(ngx.header["X-RateLimit-Remaining"])
              local limit     = tonumber(ngx.header["X-RateLimit-Limit"])
              if not remaining or not limit or limit == 0 then return end

              local used     = limit - remaining
              local used_pct = used / limit * 100
              local client_ip = ngx.var.remote_addr or "unknown"

              -- PRE-GA THRESHOLDS (2026-07: traffic thật gần 0, bắt sớm mọi
              -- bất thường). Nâng lại 50/70 khi GA chính thức + có baseline p95.
              local warn_pct = 50   -- % của 500 = 250 req/s (pre-GA)
              local info_pct = 20   -- % của 500 = 100 req/s (pre-GA)

              if used_pct >= warn_pct then
                local msg = string.format(
                  "WARN [auth/pre-GA]: IP=%s used=%d req/s (%.0f%% of %d quota). "
                  .. "High auth rate — check for SDK retry loops, "
                  .. "credential refresh storms, token cache issues, or "
                  .. "brute-force AKID probing (pre-GA baseline should be near-zero).",
                  client_ip, used, used_pct, limit)
                ngx.header["X-RateLimit-Warning"] = msg

                -- grep '[rate-limit-warning] service=auth' error.log
                ngx.log(ngx.WARN,
                  string.format("[rate-limit-warning] service=auth phase=pre-GA IP=%s "
                    .. "used=%d/s used_pct=%.0f%% "
                    .. "warn_pct=%d%% hard_limit=%d/s",
                    client_ip, used, used_pct, warn_pct, limit))

              elseif used_pct >= info_pct then
                ngx.header["X-RateLimit-Warning"] = string.format(
                  "INFO [auth/pre-GA]: IP=%s used=%d req/s (%.0f%% of %d quota). "
                  .. "Monitor credential refresh frequency.",
                  client_ip, used, used_pct, limit)

                -- Pre-GA: INFO cũng ghi log (khác GA — GA không log INFO để
                -- tránh spam). Ở pre-GA baseline gần 0 nên mỗi record đều có
                -- giá trị quan sát, noise thấp vì traffic thật quá ít.
                ngx.log(ngx.INFO,
                  string.format("[rate-limit-info] service=auth phase=pre-GA IP=%s "
                    .. "used=%d/s used_pct=%.0f%%",
                    client_ip, used, used_pct))
              end
            end

      # ── (3) Circuit breaker — phân biệt backend lỗi vs proxy drop ────────────
      # Khống chế tổng số keepalive_requests  truyền xuống Backend. 
      #    Nếu các Node Backend có dấu hiệu quá tải (RAM tăng cao do quá nhiều luồng xử lý Object lớn), 
      #    APISIX sẽ kích hoạt Circuit Breaker (Cầu dao tự động) để tạm dừng nhận thêm request cho riêng phân vùng backend đó, trả về 503 Service Unavailable.
      # Khi Cloudian IAM trả 5xx liên tục 5 lần → circuit MỞ.
      # Khi đó APISIX tự trả 503 "Upstream unhealthy" thay vì forward tiếp → tránh dồn tải lên backend đang gặp sự cố.
      # Metric/log: lỗi từ circuit breaker ≠ lỗi từ backend → dễ phân biệt.
      # Sau 120s (hoặc 3 request OK liên tiếp) → circuit ĐÓNG tự động.
      #   429 = APISIX rate-limit (quota)
      #   503 = circuit breaker (backend unhealthy)
      #   5xx = backend thật sự lỗi
      api-breaker:
        break_response_code: 503
        break_response_body: "Auth upstream temporarily unavailable (circuit open). Retry in 120 seconds."
        max_breaker_sec: 120      # giây — thời gian mở circuit (min cho phép = 60)
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 5             # 5 lần lỗi liên tiếp → mở circuit
        healthy:
          http_statuses: [200, 201, 204]
          successes: 3            # 3 lần OK liên tiếp → đóng circuit

        # ┌─────────────────────────────────────────────────────────────────┐
        # │  REDIS POLICY — CHỌN 1 TRONG 5 BLOCK, comment 4 block còn lại   │
        # │                                                                 │
        # │  ⚠ 2 block active cùng lúc = trùng key 'policy:'                │
        # │    → yamllint báo lỗi, merge-fragments.sh chặn deploy.          │
        # │                                                                 │
        # │  Đổi block → đồng bộ 3 chỗ:                                     │
        # │    (1) file này (policy + redis_* params)                       │
        # │    (2) docker-compose.yaml (bật/tắt service redis)              │
        # │    (3) redis/redis.conf (nếu tự dựng)                           │
        # │                                                                 │
        # │  BLOCK 1: Không có Redis   → đếm per-node (local Lua dict)      │
        # │  BLOCK 2: Redis tự dựng    + single instance  ← ĐANG DÙNG       │
        # │  BLOCK 3: Redis tự dựng    + cluster                            │
        # │  BLOCK 4: Redis có sẵn     + single instance                    │
        # │  BLOCK 5: Redis có sẵn     + cluster                            │
        # │                                                                 │
        # │  ⚠ LƯU Ý QUAN TRỌNG KHI DÙNG policy: local (BLOCK 1):           │
        # │  - Bộ đếm lưu trong Lua shared dict của MỖI APISIX node riêng.  │
        # │  - Multi-node (scale-out) → mỗi node đếm ĐỘC LẬP, không sync.   │
        # │  - Thực tế: N node → consumer có thể gọi N × count req/window.  │
        # │  - Chỉ dùng local khi: single-node, lab/dev, hoặc chấp nhận     │
        # │    per-node counting. Prod multi-node → dùng BLOCK 2-5 (Redis). │
        # └─────────────────────────────────────────────────────────────────┘

        # ▼▼▼ BLOCK 1 — KHÔNG CÓ REDIS (đếm local per-node) DÙNG BỘ ĐẾM LOCAL (LUA SHARED DICT)▼▼▼
        # ⚠ CHỈ phù hợp khi chạy SINGLE APISIX NODE (dev/lab/standalone).
        # ⚠ Multi-node: mỗi node đếm riêng → effective quota = count × số_node.
        #   Nếu cần accurate rate-limit trên multi-node → PHẢI dùng Redis (BLOCK 1-4).
        # ✔ Không cần cấu hình thêm gì — xóa toàn bộ redis_* params.
        # ✔ allow_degradation: true không có ý nghĩa với local (không có external dep).
        # ✔ Shared dict backend = plugin-limit-count (khai báo trong lua_shared_dicts).
        # policy: local

        # ▼▼▼ BLOCK 2 — REDIS TỰ DỰNG + SINGLE ── ĐANG DÙNG ▼▼▼
        policy: redis                                # CHƯA CÓ REDIS → 'local' + xóa 5 dòng redis_*
        redis_host: 127.0.0.1                        # IP Redis — cùng VM. Multi-VM → IP của VM Redis (đổi nếu Redis ở VM khác)
        redis_port: 6379
        redis_password: "$ENV://REDIS_PASSWORD"      # từ .env (gitignored), KHÔNG hardcode/commit
        redis_database: 1                            # từ .env (gitignored), KHÔNG hardcode/commit
        redis_timeout: 1000                          # ms — quá 1s coi như lỗi (gọi Redis quá 1s coi như lỗi) → degradation

        # ▼▼▼ BLOCK 3 — REDIS TỰ DỰNG + CLUSTER ▼▼▼
        # ⚠ Cluster cần ≥6 node (3 master+3 replica) — xem redis.conf.
        # # ⚠ cluster KHÔNG hỗ trợ redis_database (chỉ có db 0) → đã bỏ.
        # # ⚠ Self-host cluster cần 6 node (3 master+3 replica) → không dựng nổi
        # #    bằng 1 container. Hiếm khi đáng làm; xem cảnh báo trong redis.conf
        # policy: redis-cluster
        # redis_cluster_nodes:
        #   - "127.0.0.1:7000"
        #   - "127.0.0.1:7001"
        #   - "127.0.0.1:7002"
        # redis_cluster_name: "apisix-ratelimit"
        # redis_password: "$ENV://REDIS_PASSWORD"
        # redis_timeout: 1000


        # ▼▼▼ BLOCK 4 — REDIS CÓ SẴN + SINGLE ▼▼▼
        # policy: redis
        # redis_host: 10.0.0.50             # IP Redis của team
        # redis_port: 6379
        # redis_password: "$ENV://REDIS_PASSWORD"
        # redis_database: 1
        # redis_timeout: 1000
        # redis_ssl: true                   # bật nếu Redis dùng TLS (ElastiCache/Azure)
        # redis_ssl_verify: true            # verify cert; false nếu cert private/self-signed

        # ▼▼▼ BLOCK 5 — REDIS CÓ SẴN + CLUSTER ▼▼▼
        # policy: redis-cluster
        # redis_cluster_nodes:
        #   - "10.0.0.50:6379"
        #   - "10.0.0.51:6379"
        #   - "10.0.0.52:6379"
        # redis_cluster_name: "apisix-ratelimit"
        # redis_password: "$ENV://REDIS_PASSWORD"
        # redis_timeout: 1000
        # redis_cluster_ssl: true           # managed cluster thường bắt TLS; false nếu không cần
        # redis_cluster_ssl_verify: true    # verify cert; false nếu cert private/self-signed

  # ── src: services/svc-s3-internal-console.yaml
  # ═══════════════════════════════════════════════════════════════════════════
  # svc-s3-internal-console — QoS profile cho console nội bộ (CMC/HyperIQ/S3-Admin)
  # ═══════════════════════════════════════════════════════════════════════════
  #
  #  RỦI RO: THẤP — 3 domain này KHÔNG public ra internet (chặn ở network
  #  layer: SG/firewall/VPN-only). Đã xác nhận với team network trước khi
  #  đơn giản hoá plugin stack so với svc-s3-console cũ.
  #
  #  ÁP CHO ROUTE: cmc.sds.infiniband.vn, hyperiq.sds.infiniband.vn,
  #                s3-admin.sds.infiniband.vn (+ port 19443)
  #
  #  KHÔNG CÒN: ip-restriction whitelist, ua-restriction, referer-restriction,
  #  limit-req, cors — network ACL đã lo phần chặn truy cập trái phép.
  #  Giữ plugin ở APISIX cho việc này là defense-in-depth thừa: tốn CPU mỗi
  #  request, tốn công bảo trì whitelist, và whitelist sai IP tự khoá chính
  #  team vận hành khỏi console quản trị.
  #
  #  GIỮ LẠI:
  #    - limit-conn: KHÔNG chống attacker (không có), mà chống chính hệ thống
  #      NỘI BỘ tự bắn nhầm (script lỗi, job loop, dashboard cache-miss storm).
  #      Vẫn có giá trị thực dù traffic 100% internal.
  #    - blacklist: phản ứng nhanh khi có 1 client nội bộ (host/service lỗi)
  #      spam vào console — thêm 1 IP vào blacklist nhanh hơn nhiều so với
  #      phải sửa lại network ACL / xin duyệt security group.
  #    - prometheus: observability không tốn gì đáng kể, luôn nên có.
  #
  #  ⚠ QUYẾT ĐỊNH: KHÔNG giữ svc-s3-console làm dự phòng cho khả năng public
  #  hoá sau này. Nếu tương lai cần public, phải tạo lại service riêng và có
  #  phê duyệt từ lãnh đạo trước — không tự động bật lại từ file cũ.
  #
  #  KHI CẦN CHỈNH:
  #    - Phát hiện IP nội bộ lỗi spam → thêm vào ip-restriction.blacklist
  #    - Cần nới/siết concurrency → sửa limit-conn.conn
  # ═══════════════════════════════════════════════════════════════════════════
  - id: svc-s3-internal-console
    plugins:
      # ── HARD-LIMIT ONLY — KHÔNG có tầng soft-limit ──────────────────────────
      # Khác với svc-s3-sdk/svc-s3-auth (2 lớp soft→hard), service này CHỦ ĐÍCH
      # không có soft-limit warning. Lý do: soft-limit tồn tại để giao tiếp với
      # client BÊN NGOÀI không kiểm soát được ("bạn sắp chạm limit, tự giảm tốc").
      # Ở đây traffic 100% internal — khi limit-conn kích hoạt, nguyên nhân luôn
      # là job/script nội bộ lỗi cần người can thiệp trực tiếp, không phải actor
      # có thể "tự điều chỉnh" qua warning header. Nên phản ứng đúng là LOG + CHẶN
      # NGAY, không phải cảnh báo dần rồi mới chặn.
      #
      # Nếu sau này thấy limit-conn trigger thường xuyên với traffic hợp lệ
      # (false positive) → đó là tín hiệu cần NÂNG conn/burst, không phải thêm
      # soft-limit — vì bản chất vấn đề là ngưỡng sai, không phải thiếu cảnh báo.
      # ── Concurrency guard — chống chính nội bộ tự flood, KHÔNG phải chống attacker ──
      # NODE-LOCAL, không cần Redis vì mục đích chỉ là chặn runaway job/script nội bộ.
      limit-conn:
        conn: 100
        burst: 50
        default_conn_delay: 0.1
        key_type: var
        key: remote_addr
        rejected_code: 429
        rejected_msg: "Too many concurrent connections to internal console — check for stuck job/script."

      # ── Log tường minh khi limit-conn reject — thay thế vai trò soft-limit ──
      # Không cảnh báo TRƯỚC khi chạm limit (như soft-limit), mà log NGAY THỜI
      # ĐIỂM bị reject — đủ để vận hành trace nhanh IP/job nào đang gây flood
      # nội bộ, không cần chờ pattern lặp lại nhiều lần mới phát hiện.
      serverless-post-function:
        phase: header_filter
        functions:
          - |
            return function(conf, ctx)
              if ngx.status == 429 then
                ngx.log(ngx.WARN,
                  string.format("[internal-console-reject] IP=%s uri=%s status=429 "
                    .. "reason=limit-conn — kiểm tra job/script nội bộ đang chạy trên IP này",
                    ngx.var.remote_addr or "unknown",
                    ngx.var.request_uri or "-"))
              end
            end

      # ── Blacklist — phản ứng nhanh khi phát hiện client nội bộ lỗi/spam ──────
      # Không dùng whitelist (đã có network ACL lo việc đó). Đây là công cụ
      # "cắt nhanh" khi vận hành phát hiện qua log/alert 1 IP nội bộ đang gây
      # vấn đề, không cần chờ sửa network ACL/security group.
      # Thêm IP vào đây → commit → gitsync hot-reload (~60s), không cần restart.
      # QUY TẮC: CHỈ thêm block ip-restriction khi đã có >=1 IP thật cần chặn.
      # Khi cần blacklist 1 IP, uncomment và điền

      # ip-restriction:
      #   blacklist: []   # điền IP nội bộ khi phát hiện qua log [internal-console-reject]
      #   message: "Your IP has been temporarily blocked from internal console — contact platform team"

  # ── src: services/svc-s3-ops.yaml
  # ═══════════════════════════════════════════════════════════════════════════
  # svc-s3-ops — QoS profile cho Internal / Batch / Ops / Legacy traffic (ưu tiên thấp nhất)
  # ═══════════════════════════════════════════════════════════════════════════
  #
  #  AI GỌI:   Script nội bộ, job batch, tool ops chạy tay hoặc cron.
  #             Không phải SDK sản xuất, không phải browser người dùng.
  #             Ví dụ: script xóa log cũ, job backup, tool migration,
  #                    lệnh aws s3 sync chạy tay từ jump host.
  #
  #  ÁP CHO ROUTE:  s3-hcm.infiniband.vn (legacy domain, không có sds)
  #                 Route /admin* ops API (nếu forward, không phải deny)
  #                 Route lab/test/fragment
  #                 Job xóa dữ liệu, task nặng chạy ban đêm
  #
  #  CÁCH GẮN VÀO ROUTE:
  #    service_id: "svc-s3-ops"
  #    Hoặc đổi sang svc-s3-ops-offpeak khi cần chạy job nặng ban đêm.
  #
  #  NGUYÊN TẮC QoS:
  #    "BÓP TỪ ĐÁY" — ops/batch là ưu tiên thấp nhất.
  #    SDK sản xuất (svc-s3-sdk) LUÔN được ưu tiên hơn.
  #    Rate 10/s chặt để tránh job batch ngốn tài nguyên ban ngày.
  #
   #  ── NGƯỠNG SOFT-LIMIT (CALIBRATE PHASE) ────────────────────────────────
  #
  #  svc-s3-ops (ban ngày):
  #    Hard-limit: 10 req/s / IP
  #    INFO: ≥ 30% = 3 req/s  → script chạy tay bình thường
  #      → Trigger ngay để có data → xác nhận script đang chạy đúng
  #    WARN: ≥ 60% = 6 req/s  → script đang chạy nhanh hơn bình thường
  #      → Ghi log → vận hành theo dõi có cạnh tranh với SDK không
  #
  #  svc-s3-ops-offpeak (ban đêm):
  #    Hard-limit: 200 req/s / IP
  #    INFO: ≥ 50% = 100 req/s → job đang chạy tốt
  #    WARN: ≥ 70% = 140 req/s → job chạy gần hết quota off-peak
  #      → Ghi log → kiểm tra job có xong trước 6am không
  #
  #  Tại sao dùng 30% cho INFO thay vì 50%?
  #  → Script tay thường ~1-3 req/s = 10-30% của 10/s
  #  → INFO 50% = 5/s: không trigger với script bình thường
  #  → INFO 30% = 3/s: trigger ngay → có data từ ngày đầu
  #
  #  ── OFF-PEAK WORKFLOW ───────────────────────────────────────────────────
  #  Ban đêm (2am–6am):
  #    1. Agent đổi service_id → svc-s3-ops-offpeak
  #    2. Commit YAML → git-sync hot-reload (~60s)
  #    3. Sáng 6am: đổi ngược lại
  #  Không cần restart APISIX.
  #  ⚠ KHÔNG để offpeak active ban ngày.
  #
  #  KHI CẦN CHỈNH:
  #    - Tăng rate cho giờ thấp điểm → dùng svc-s3-ops-offpeak
  #    - Thêm route mới vào ops → gắn service_id: "svc-s3-ops"
  # ═══════════════════════════════════════════════════════════════════════════
  - id: svc-s3-ops
    plugins:

      # ── (1) SOFT-LIMIT pre-function ───────────────────────────────────────
      # NGƯỠNG:
      #   hard_limit = 10 req/s (PHẢI khớp limit-req.rate bên dưới)
      #   info_rate  = 30% = 3 req/s  → script chạy bình thường
      #   warn_rate  = 60% = 6 req/s  → nhanh hơn bình thường
      #
      # Log format:
      #   grep '[ops-rate-warning]' logs/apisix-hcm/error.log
      #   [ops-rate-warning] IP=10.0.0.5 rate=~7/s limit=10/s used_pct=70%
      #     uri=/thuyldx-hni/logs/2026-06-26.log
      serverless-pre-function:
        phase: rewrite
        functions:
          - |
            return function(conf, ctx)
              local hard_limit = 10  -- req/s (PHẢI khớp limit-req.rate)

              -- CALIBRATE PHASE: thấp để trigger ngay
              -- INFO 30% = 3/s: script tay bình thường → có data ngay
              -- WARN 60% = 6/s: script chạy nhanh → kiểm tra tải farm
              local warn_rate = hard_limit * 0.60  -- 6 req/s
              local info_rate = hard_limit * 0.30  -- 3 req/s

              local ip = ngx.var.remote_addr or "unknown"

              local dict = ngx.shared["plugin-limit-req"]
              local current_rate = 0
              if dict then
                local val = dict:get("plugin-limit-req" .. ip)
                if val then current_rate = tonumber(val) or 0 end
              end

              local used_pct = current_rate / hard_limit * 100

              if current_rate >= warn_rate then
                local msg = string.format(
                  "WARN [ops]: IP=%s rate=~%.0f req/s (%.0f%% of %d/s). "
                  .. "Script running faster than normal. "
                  .. "Consider throttling or use svc-s3-ops-offpeak (2am-6am).",
                  ip, current_rate, used_pct, hard_limit)
                ngx.req.set_header("X-RateLimit-Warning", msg)
                ctx.rl_warning = msg

                -- Log gồm cả URI để biết script đang làm gì
                -- grep '[ops-rate-warning]' error.log
                ngx.log(ngx.WARN,
                  string.format("[ops-rate-warning] IP=%s rate=~%.0f/s "
                    .. "limit=%d/s used_pct=%.0f%% uri=%s",
                    ip, current_rate, hard_limit, used_pct,
                    ngx.var.request_uri or "-"))

              elseif current_rate >= info_rate then
                -- INFO: script đang chạy bình thường → không ghi log
                local msg = string.format(
                  "INFO [ops]: IP=%s rate=~%.0f req/s (%.0f%% of %d/s). "
                  .. "For heavy tasks use svc-s3-ops-offpeak (2am-6am).",
                  ip, current_rate, used_pct, hard_limit)
                ngx.req.set_header("X-RateLimit-Warning", msg)
                ctx.rl_warning = msg
              end
            end

      # ── (2) SOFT-LIMIT post-function — copy warning sang response ─────────
      serverless-post-function:
        phase: header_filter
        functions:
          - |
            return function(conf, ctx)
              if ctx.rl_warning then
                ngx.header["X-RateLimit-Warning"] = ctx.rl_warning
              end
              ngx.header["X-RateLimit-Limit"] = "10 req/s per IP (use svc-s3-ops-offpeak for heavy tasks)"
            end

      # ── Vòng 2 — Prioriy 3 | (3 | HARD-LIMIT) Rate limit — leaky bucket, siết chặt ─────────────────────────────
      # PHẢI khớp với hard_limit trong serverless-pre-function (= 10).
      # limit-req (leaky bucket): làm mượt, không cho burst lớn.
      # Rate 10/s = đủ cho ops/script nhưng không cướp tài nguyên SDK.
      # NODE-LOCAL — không cần Redis vì ops traffic thấp.
      limit-req:
        rate: 10                  # hard-limit: req/s / IP — siết chặt — PHẢI = hard_limit trong function
        burst: 5                  # burst nhỏ, không cho dồn
        key_type: var
        key: remote_addr
        rejected_code: 429
        rejected_msg: "Ops/batch rate limit exceeded (10 req/s). Use svc-s3-ops-offpeak (2am-6am) for heavy tasks by changing service_id in route YAML."
        allow_degradation: true

  # ── Vòng 2 — Prioriy 3 | OFF-PEAK PROFILE — nới rộng cho job nặng ban đêm ("thả nổi") ────────────────────
  # Dùng service_id: "svc-s3-ops-offpeak" cho route trong khung giờ thấp điểm.
  # Agent ban đêm: đổi service_id → commit → hot-reload. Sáng đổi ngược lại.
  # ⚠ KHÔNG để offpeak active ban ngày → job batch sẽ cướp tài nguyên của SDK.
  - id: svc-s3-ops-offpeak
    plugins:

      limit-req:                  # PHẢI khớp với hard_limit trong serverless-pre-function (= 200).
        rate: 200                 # nới rộng cho job nặng off-peak (xóa log, sync lớn) — PHẢI = hard_limit trong function
        burst: 100
        key_type: var
        key: remote_addr
        rejected_code: 429
        rejected_msg: "Off-peak rate limit exceeded (200 req/s). Job is running too fast even for off-peak window."
        allow_degradation: true

      # Soft-limit offpeak:
      #   hard_limit = 200 req/s
      #   INFO 50% = 100/s: job đang chạy tốt
      #   WARN 70% = 140/s: gần hết quota → kiểm tra job xong trước 6am không
      serverless-pre-function:
        phase: rewrite
        functions:
          - |
            return function(conf, ctx)
              local hard_limit = 200  -- req/s (PHẢI khớp limit-req.rate)

              -- Offpeak: ngưỡng cao hơn ops ban ngày
              -- INFO 50% = 100/s: job đang chạy tốt
              -- WARN 70% = 140/s: gần hết quota → theo dõi tiến độ job
              local warn_rate = hard_limit * 0.70  -- 140 req/s
              local info_rate = hard_limit * 0.50  -- 100 req/s

              local ip = ngx.var.remote_addr or "unknown"
              local dict = ngx.shared["plugin-limit-req"]
              local current_rate = 0
              if dict then
                local val = dict:get("plugin-limit-req" .. ip)
                if val then current_rate = tonumber(val) or 0 end
              end

              local used_pct = current_rate / hard_limit * 100

              if current_rate >= warn_rate then
                local msg = string.format(
                  "WARN [ops-offpeak]: IP=%s rate=~%.0f req/s (%.0f%% of %d/s). "
                  .. "Heavy off-peak job running fast. "
                  .. "Monitor farm capacity and ensure job completes before 6am.",
                  ip, current_rate, used_pct, hard_limit)
                ngx.req.set_header("X-RateLimit-Warning", msg)
                ctx.rl_warning = msg

                ngx.log(ngx.WARN,
                  string.format("[ops-offpeak-warning] IP=%s rate=~%.0f/s "
                    .. "limit=%d/s used_pct=%.0f%%",
                    ip, current_rate, hard_limit, used_pct))

              elseif current_rate >= info_rate then
                local msg = string.format(
                  "INFO [ops-offpeak]: IP=%s rate=~%.0f req/s (%.0f%% of %d/s).",
                  ip, current_rate, used_pct, hard_limit)
                ngx.req.set_header("X-RateLimit-Warning", msg)
                ctx.rl_warning = msg
              end
            end

      serverless-post-function:
        phase: header_filter
        functions:
          - |
            return function(conf, ctx)
              if ctx.rl_warning then
                ngx.header["X-RateLimit-Warning"] = ctx.rl_warning
              end
              ngx.header["X-RateLimit-Limit"] = "200 req/s per IP (off-peak mode: 2am-6am only)"
            end

  # ── src: services/svc-s3-sdk.yaml
  # ═══════════════════════════════════════════════════════════════════════════
  #  Vòng 2 — Prioriy 1 | svc-s3-sdk — QoS profile cho S3 SDK / AWS CLI traffic — DATA-PLANE (real-time, ưu tiên cao nhất)
  # ═══════════════════════════════════════════════════════════════════════════
  #
  #  AI GỌI:   Machine — S3 SDK (boto3, aws-sdk-java, s3cmd, AWS CLI...)
  #             App/service tự động upload/download object liên tục.
  #             KHÔNG phải người bấm tay.
  #
  #  ÁP CHO ROUTE:  s3-hcm.sds.infiniband.vn  (+ *.s3-hcm.sds.infiniband.vn)
  #                 s3-hni.sds.infiniband.vn  (+ *.s3-hni.sds.infiniband.vn)
  #                 s3-rgwhcm.sds.infiniband.vn
  #                 s3-rgwhni.sds.infiniband.vn
  #
  #  CÁCH GẮN VÀO ROUTE:
  #    Thêm đúng 1 dòng vào route fragment:
  #      service_id: "svc-s3-sdk"
  #    KHÔNG khai báo limit-* trong route — tập trung tại đây.
  #
  #  PATTERN TRAFFIC:
  #    - PUT/GET object lớn (MB → 5GB), giữ connection hàng phút
  #    - Volume cao: 3k–4k req/s bình thường, đỉnh có thể hơn
  #    - Latency nhạy cảm — đây là luồng kiếm tiền chính
  #
  #  NGUYÊN TẮC QoS:
  #    WARNING MODE: ngưỡng đặt SÁT capacity (~4000/s) để PHÁT HIỆN account chạy loạn (runaway), chưa drop mạnh.
  #    → Muốn ENFORCE thật: hạ `count` của limit-count xuống.
  #    → Theo dõi qua Prometheus: alert khi chạm ~80% (3200/s).
  #
  #  PHÂN BIỆT 2 PLUGIN:
  #    limit-conn  → giới hạn KẾT NỐI ĐỒNG THỜI / IP (node-local)
  #                  Quan trọng với S3 vì upload 5GB giữ conn hàng phút.
  #                  Key: remote_addr (thuộc tính nguồn kết nối mạng)
  #    limit-count → giới hạn SỐ REQUEST / GIÂY / AKID (qua Redis)
  #                  Key: http_x_s3_access_key (AKID — set bởi s3-accesskey-extractor)
  #                  Presigned URL: AKID từ X-Amz-Credential query string
  #                  SigV4/SigV2 header: AKID từ Authorization header
  #                  Anonymous (không có auth): fallback "ip:<remote_addr>"
  #
  #  ── CHIẾN LƯỢC 2 LỚP: SOFT-LIMIT → HARD-LIMIT ────────────────────────────
  #
  #  HARD-LIMIT: chặn khi vượt ngưỡng tuyệt đối → HTTP 429
  #  SOFT-LIMIT: cảnh báo sớm → inject X-RateLimit-Warning header + log
  #              Request VẪN ĐI QUA — client tự throttle trước khi bị 429
  #
  #  ── PHÂN BIỆT 2 LOẠI CALLER ────────────────────────────────────────────
  #
  #  AUTHENTICATED (có AKID):
  #    → S3 SDK ký SigV4/SigV2, hoặc dùng presigned URL
  #    → AKID được extract bởi custom.s3-accesskey-extractor
  #    → Redis key: "plugin-limit-count/.../svc-s3-sdk:<hash>:<AKID>"
  #    → Traffic thực tế: có thể 100–4000 req/s (machine, liên tục)
  #    → Soft-limit: INFO ≥ 10% (400/s), WARN ≥ 20% (800/s)
  #
  #  ANONYMOUS (không có AKID):
  #    → Request không có Authorization header VÀ không có X-Amz-Credential
  #    → s3-accesskey-extractor fallback → key = "ip:<remote_addr>"
  #    → Redis key: "plugin-limit-count/.../svc-s3-sdk:<hash>:ip:x.x.x.x"
  #    → Traffic thực tế: ~1-10 req/s (public bucket, browser kéo file)
  #    → 50 req/s từ 1 IP = đáng ngờ (scraper/flood)
  #    → Soft-limit: INFO ≥ 0.25% (10/s), WARN ≥ 1.25% (50/s)
  #    → Ngưỡng % thấp vì hard-limit (4000) quá cao cho anonymous
  #      → dùng giá trị tuyệt đối thực tế để calibrate
  #
  #  ── QUY TRÌNH CALIBRATE NGƯỠNG ─────────────────────────────────────────
  #    1. Deploy với ngưỡng hiện tại
  #    2. Quan sát error.log: grep 'rate-limit-warning' error.log
  #    3. Phân loại: [auth] vs [anon] trong log message
  #    4. Sau 1-2 tuần → biết p50/p95 traffic thực → điều chỉnh
  #    5. Khi tự tin → giữ nguyên hard-limit, chỉ chỉnh soft %
  #
  #  ── KHI CẦN CHỈNH ───────────────────────────────────────────────────────
  #    Ngưỡng chung                   → sửa `count` (limit-count) và `conn` (limit-conn)
  #    % cảnh báo auth                → sửa warn_pct_auth / info_pct_auth trong function
  #    % cảnh báo anonymous           → sửa warn_abs_anon / info_abs_anon trong function
  #    Từng account (AKID) riêng      → xem consumer_groups/
  #    Đổi Redis                      → xem block REDIS POLICY
  #
  # ── NẾU DÙNG REDIS CLUSTER (thay block policy: redis ở dưới bằng dạng này) ──
  # Redis client params — xem legend ở config.yaml; CHƯA CÓ REDIS → policy: local + xóa redis_*
  #   policy: redis-cluster
  #   redis_cluster_nodes:            # tối thiểu 2 node
  #     - "10.0.0.11:6379"
  #     - "10.0.0.12:6379"
  #   redis_cluster_name: "apisix-ratelimit"
  #   redis_password: "<<password-nếu có>>"
  #   redis_cluster_ssl: false
  #   redis_cluster_ssl_verify: false
  #   redis_timeout: 1000
  # ═══════════════════════════════════════════════════════════════════════════
  - id: svc-s3-sdk
    plugins:

      # ── Vòng 2 — Prioriy 1 | (1) Concurrency / IP — giới hạn kết nối đồng thời từ 1 IP  ────────────────
      # Áp cho CẢ authenticated lẫn anonymous:
      # → Anonymous IP flood 250 conn = tấn công → chặn sớm
      # → Authenticated IP giữ 50 conn = upload 50 file song song = hợp lệ
      # Quan trọng với S3: upload 5GB giữ connection hàng phút.
      # NODE-LOCAL (không qua Redis). Multi-node → đặt conn = tổng / N node.
      # Ví dụ: muốn giới hạn 100 conn/IP toàn cụm 2 node → conn: 50
      limit-conn:
        conn: 50                  # hard-limit conn đồng thời /IP — tune theo benchmark object-size
        burst: 20                 # cho vọt thêm 20 trước khi từ chối
        default_conn_delay: 0.1   # giây — delay mỗi conn vượt ngưỡng (không drop ngay)
        key_type: var
        key: remote_addr          # theo IP — thuộc tính nguồn kết nối mạng
        rejected_code: 429
        rejected_msg: "S3 concurrency limit reached — too many parallel connections from your IP. Reduce concurrent uploads/downloads."

      # ── Vòng 2 — Prioriy 1 | (2) Request rate / AKID — giới hạn req/s theo account ────────────
      # Đếm qua REDIS để chính xác cross-node (nhiều APISIX node dùng chung).
      # Key = AKID (authenticated) hoặc "ip:<IP>" (anonymous).
      # Cùng 1 hard-limit nhưng soft-limit WARNING khác nhau → xem serverless-post-function bên dưới.
      # AKID được set bởi plugin custom.s3-accesskey-extractor ở route.
      limit-count:
        count: 4000               # hard-limit: req/s / AKID  dùng chung cho cả 2 loại — WARNING MODE, hạ để ENFORCE
        time_window: 1            # giây
        key_type: var
        key: http_x_s3_access_key # AKID hoặc "ip:<IP>" (set bởi s3-accesskey-extractor)
        rejected_code: 429
        rejected_msg: "S3 request rate limit exceeded (4000 req/s). Check X-RateLimit-* headers. If you are anonymous, use authenticated access for higher quota."
        allow_degradation: true   # Redis lỗi → cho qua, KHÔNG 500 cả farm
        show_limit_quota_header: true  # client thấy X-RateLimit-Limit/Remaining,  # BẮT BUỘC: serverless đọc header này

      # ── (3) SOFT-LIMIT — Warning tách biệt authenticated vs anonymous ─────
      # Chạy ở header_filter phase (sau khi upstream đã trả response).
      # Đọc X-RateLimit-Remaining (set bởi limit-count ở access phase).
      # Request VẪN ĐI QUA — chỉ inject thêm header + ghi log.
      #
      # ── TẠI SAO CẦN TÁCH NGƯỠNG? ──────────────────────────────────────
      #
      #  Hard-limit là 4000 req/s cho cả 2 loại caller.
      #  Nhưng traffic thực tế rất khác nhau:
      #
      #  AUTHENTICATED:
      #    S3 SDK chạy liên tục, có thể 100–2000 req/s bình thường
      #    → warn ở 20% (800/s) là hợp lý để phát hiện runaway
      #    → warn ở 80% (3200/s) = quá muộn, gần sát hard-limit
      #
      #  ANONYMOUS (key bắt đầu bằng "ip:"):
      #    Browser kéo public file, script tay ~1-10 req/s
      #    → 50 req/s từ 1 IP = đáng ngờ (scraper)
      #    → Nếu dùng warn ở 20% = 800/s → không bao giờ trigger
      #    → Phải dùng giá trị tuyệt đối: warn khi > 50/s
      #
      # ── CÁCH ĐỌC LOG ────────────────────────────────────────────────────
      #  grep '[rate-limit-warning]' logs/apisix-hcm/error.log
      #
      #  Log authenticated:
      #  [rate-limit-warning] type=auth AKID=7d03846... used=850/s (21%) WARN
      #
      #  Log anonymous:
      #  [rate-limit-warning] type=anon IP=1.2.3.4 used=55/s WARN
      #  → Ngay khi thấy log này: kiểm tra IP có phải scraper không
      #
      # ── CHỈNH NGƯỠNG ────────────────────────────────────────────────────
      #  Authenticated: sửa warn_pct_auth và info_pct_auth (% của hard-limit)
      #  Anonymous:     sửa warn_abs_anon và info_abs_anon (giá trị tuyệt đối req/s)
      #  Lý do dùng giá trị tuyệt đối cho anonymous:
      #  → % của 4000 quá nhỏ để có ý nghĩa (50/4000 = 1.25%)
      #  → Dễ hiểu hơn khi vận hành: "warn khi > 50 req/s từ 1 IP"
      serverless-post-function:
        phase: header_filter
        functions:
          - |
            return function(conf, ctx)
              -- Đọc header do limit-count set
              local remaining = tonumber(ngx.header["X-RateLimit-Remaining"])
              local limit     = tonumber(ngx.header["X-RateLimit-Limit"])

              -- Không có header → limit-count chưa chạy hoặc Redis degrade
              if not remaining or not limit or limit == 0 then return end

              local used     = limit - remaining
              local used_pct = used / limit * 100

              -- Xác định loại caller từ X-S3-Access-Key header
              -- "ip:" prefix = anonymous (set bởi s3-accesskey-extractor khi không có AKID)
              -- Còn lại = AKID của authenticated user
              local akid = ngx.req.get_headers()["X-S3-Access-Key"] or ""
              local is_anonymous = (akid:sub(1, 3) == "ip:")

              local msg = nil
              local should_log = false

              if is_anonymous then
                -- ── ANONYMOUS caller ──────────────────────────────────────
                -- Dùng giá trị tuyệt đối (req/s) thay vì % vì hard-limit
                -- 4000 quá cao so với traffic anonymous thực tế (~1-10/s)
                --
                -- Ngưỡng (chỉnh tại đây nếu cần):
                local warn_abs_anon = 50  -- req/s → đáng ngờ (scraper/flood)
                local info_abs_anon = 10  -- req/s → bắt đầu theo dõi

                local ip = akid:sub(4)  -- bỏ prefix "ip:"

                if used >= warn_abs_anon then
                  msg = string.format(
                    "WARN [anon]: IP=%s rate=%d req/s exceeds %d req/s threshold. "
                    .. "Possible scraper or flood. "
                    .. "Use authenticated access (SigV4) for higher quota.",
                    ip, used, warn_abs_anon)
                  should_log = true

                  -- Log chi tiết để vận hành điều tra
                  ngx.log(ngx.WARN,
                    string.format("[rate-limit-warning] type=anon IP=%s "
                      .. "used=%d/s warn_threshold=%d/s "
                      .. "hard_limit=%d/s uri=%s",
                      ip, used, warn_abs_anon, limit,
                      ngx.var.request_uri or "-"))

                elseif used >= info_abs_anon then
                  msg = string.format(
                    "INFO [anon]: IP=%s rate=%d req/s. "
                    .. "Monitor: threshold is %d req/s.",
                    ip, used, warn_abs_anon)
                  -- INFO không ghi log để tránh spam
                end

              else
                -- ── AUTHENTICATED caller (có AKID) ────────────────────────
                -- Dùng % của hard-limit vì traffic SDK có thể cao hơn nhiều
                --
                -- Ngưỡng (chỉnh tại đây nếu cần):
                -- Phase 1 (calibrate): thấp để có data sớm
                --   warn_pct_auth = 20  → WARN khi 800/s
                --   info_pct_auth = 10  → INFO khi 400/s
                -- Phase 2 (sau khi có p95): nâng lên gần hard-limit
                --   warn_pct_auth = 80  → WARN khi 3200/s
                --   info_pct_auth = 60  → INFO khi 2400/s
                local warn_pct_auth = 20  -- % của 4000 = 800/s (calibrate mode)
                local info_pct_auth = 10  -- % của 4000 = 400/s (calibrate mode)

                if used_pct >= warn_pct_auth then
                  msg = string.format(
                    "WARN [auth]: AKID=%s used=%d req/s (%.0f%% of %d quota). "
                    .. "Approaching rate limit — throttle requests.",
                    akid, used, used_pct, limit)

                  ngx.log(ngx.WARN,
                    string.format("[rate-limit-warning] type=auth AKID=%s "
                      .. "used=%d/s used_pct=%.0f%% "
                      .. "warn_pct=%d%% hard_limit=%d/s",
                      akid, used, used_pct, warn_pct_auth, limit))

                elseif used_pct >= info_pct_auth then
                  msg = string.format(
                    "INFO [auth]: AKID=%s used=%d req/s (%.0f%% of %d quota).",
                    akid, used, used_pct, limit)
                end
              end

              -- Inject warning header vào response
              if msg then
                ngx.header["X-RateLimit-Warning"] = msg
              end
            end

        # ┌─────────────────────────────────────────────────────────────────┐
        # │  REDIS POLICY — CHỌN 1 TRONG 5 BLOCK, comment 4 block còn lại   │
        # │                                                                 │
        # │  ⚠ 2 block active cùng lúc = trùng key 'policy:'                │
        # │    → yamllint báo lỗi, merge-fragments.sh chặn deploy.          │
        # │                                                                 │
        # │  Đổi block → đồng bộ 3 chỗ:                                     │
        # │    (1) file này (policy + redis_* params)                       │
        # │    (2) docker-compose.yaml (bật/tắt service redis)              │
        # │    (3) redis/redis.conf (nếu tự dựng)                           │
        # │                                                                 │
        # │  BLOCK 1: Không có Redis   → đếm per-node (local Lua dict)      │
        # │  BLOCK 2: Redis tự dựng    + single instance  ← ĐANG DÙNG       │
        # │  BLOCK 3: Redis tự dựng    + cluster                            │
        # │  BLOCK 4: Redis có sẵn     + single instance                    │
        # │  BLOCK 5: Redis có sẵn     + cluster                            │
        # │                                                                 │
        # │  ⚠ LƯU Ý QUAN TRỌNG KHI DÙNG policy: local (BLOCK 1):           │
        # │  - Bộ đếm lưu trong Lua shared dict của MỖI APISIX node riêng.  │
        # │  - Multi-node (scale-out) → mỗi node đếm ĐỘC LẬP, không sync.   │
        # │  - Thực tế: N node → consumer có thể gọi N × count req/window.  │
        # │  - Chỉ dùng local khi: single-node, lab/dev, hoặc chấp nhận     │
        # │    per-node counting. Prod multi-node → dùng BLOCK 2-5 (Redis). │
        # └─────────────────────────────────────────────────────────────────┘

        # ▼▼▼ BLOCK 1 — KHÔNG CÓ REDIS (đếm local per-node) DÙNG BỘ ĐẾM LOCAL (LUA SHARED DICT)▼▼▼
        # ⚠ CHỈ phù hợp khi chạy SINGLE APISIX NODE (dev/lab/standalone).
        # ⚠ Multi-node: mỗi node đếm riêng → effective quota = count × số_node.
        #   Nếu cần accurate rate-limit trên multi-node → PHẢI dùng Redis (BLOCK 1-4).
        # ✔ Không cần cấu hình thêm gì — xóa toàn bộ redis_* params.
        # ✔ allow_degradation: true không có ý nghĩa với local (không có external dep).
        # ✔ Shared dict backend = plugin-limit-count (khai báo trong lua_shared_dicts).
        # policy: local

        # ▼▼▼ BLOCK 2 — REDIS TỰ DỰNG + SINGLE ── ĐANG DÙNG ▼▼▼
        policy: redis                            # CHƯA CÓ REDIS → 'local' + xóa 5 dòng redis_*
        redis_host: 127.0.0.1                    # IP Redis — cùng VM. Multi-VM → IP của VM Redis (đổi nếu Redis ở VM khác)
        redis_port: 6379
        redis_password: "$ENV://REDIS_PASSWORD"  # từ .env (gitignored), KHÔNG hardcode/commit
        redis_database: 1                        # tách namespace, db riêng cho APISIX rate-limit
        redis_timeout: 1000                      # ms — quá 1s coi như lỗi (gọi Redis quá 1s coi như lỗi) → degradation

        # ▼▼▼ BLOCK 3 — REDIS TỰ DỰNG + CLUSTER ▼▼▼
        # ⚠ Cluster cần ≥6 node (3 master+3 replica) — xem redis.conf.
        # # ⚠ cluster KHÔNG hỗ trợ redis_database (chỉ có db 0) → đã bỏ.
        # # ⚠ Self-host cluster cần 6 node (3 master+3 replica) → không dựng nổi
        # #    bằng 1 container. Hiếm khi đáng làm; xem cảnh báo trong redis.conf
        # policy: redis-cluster
        # redis_cluster_nodes:
        #   - "127.0.0.1:7000"
        #   - "127.0.0.1:7001"
        #   - "127.0.0.1:7002"
        # redis_cluster_name: "apisix-ratelimit"
        # redis_password: "$ENV://REDIS_PASSWORD"
        # redis_timeout: 1000


        # ▼▼▼ BLOCK 4 — REDIS CÓ SẴN + SINGLE ▼▼▼
        # policy: redis
        # redis_host: 10.0.0.50             # IP Redis của team
        # redis_port: 6379
        # redis_password: "$ENV://REDIS_PASSWORD"
        # redis_database: 1
        # redis_timeout: 1000
        # redis_ssl: true                   # bật nếu Redis dùng TLS (ElastiCache/Azure)
        # redis_ssl_verify: true            # verify cert; false nếu cert private/self-signed

        # ▼▼▼ BLOCK 5 — REDIS CÓ SẴN + CLUSTER ▼▼▼
        # policy: redis-cluster
        # redis_cluster_nodes:
        #   - "10.0.0.50:6379"
        #   - "10.0.0.51:6379"
        #   - "10.0.0.52:6379"
        # redis_cluster_name: "apisix-ratelimit"
        # redis_password: "$ENV://REDIS_PASSWORD"
        # redis_timeout: 1000
        # redis_cluster_ssl: true           # managed cluster thường bắt TLS; false nếu không cần
        # redis_cluster_ssl_verify: true    # verify cert; false nếu cert private/self-signed


# ═══ routes (20 files) ════════════════════════════════════════════════
routes:
  # ── src: routes/debug-dump/route-debug-dump-normalized.yaml
  # ── DEBUG normalized ─────────────────────────────────────
  # → dump request SAU KHI normalize
  # Dùng để: verify plugin s3-normalizer-bucket-name rewrite đúng chưa
  # Trigger: header "X-Debug: 1" — không ảnh hưởng production
  - id: "route-debug-dump-normalized"
    name: "debug-dump"
    status: 0                          # tắt mặc định, bật khi cần
    priority: 100
    upstream:
      type: roundrobin
      scheme: http
      pass_host: pass
      nodes:
        "127.0.0.1:9999": 1
    uri: "/*"
    hosts:
      - "s3-hcm.sds.infiniband.vn"
      - "*.s3-hcm.sds.infiniband.vn"
      - "s3-hni.sds.infiniband.vn"
      - "*.s3-hni.sds.infiniband.vn"
    vars:
      - ["http_x_debug", "==", "2"]     # X-Debug: 2 để phân biệt với raw
    plugins:
      proxy-control:
        request_buffering: false
      custom.s3-normalizer-bucket-name:  # ✅ gắn normalizer để verify rewrite
        path_hosts:
          - "s3-hcm.sds.infiniband.vn"
          - "s3-hni.sds.infiniband.vn"
        vhost_domains:
          - "s3%-hcm%.sds%.infiniband%.vn"
          - "s3%-hni%.sds%.infiniband%.vn"
      custom.s3-accesskey-extractor:
        set_header: "X-S3-Access-Key"   # header gửi lên upstream + visible trong log
        anonymous_use_ip: true           # request không có auth → fallback ip:<IP>
    timeout:
      connect: 10
      send: 30
      read: 30

  # ── src: routes/debug-dump/route-debug-dump.yaml
  # ── DEBUG raw ─────────────────────────────────────
  # → dump upstream request gốc ra từ client python http server, không normalize
  # Dùng để: verify SDK gửi đúng vhost/path-style chưa
  # Trigger: header "X-Debug: 1" — không ảnh hưởng production
  # Tắt: status: 0
  - id: "route-debug-dump"
    name: "debug-dump"
    status: 0       # tắt mặc định, bật khi cần
    priority: 100
    upstream:
      type: roundrobin
      scheme: http
      pass_host: pass
      nodes:
        "127.0.0.1:9999": 1
    uri: "/*"
    hosts:
      - "s3-hcm.sds.infiniband.vn"
      - "*.s3-hcm.sds.infiniband.vn"
      - "s3-hni.sds.infiniband.vn"
      - "*.s3-hni.sds.infiniband.vn"
    vars:
      - ["http_x_debug", "==", "1"]
    plugins:
      proxy-control:
        request_buffering: false
    timeout:
      connect: 10
