# ═══ global_rules (5 files) ════════════════════════════════════════════════
global_rules:
  # ── src: global_rules/global-abuse-guard.yaml
# =====================================================================
#  Vòng 1 — Prioriy 1 | global_rules — GUARD CHỐNG ABUSE (áp cho mọi route & service)
#  Mục đích: chặn MỘT IP đơn lẻ làm sập hệ thống. Ngưỡng đặt RỘNG;
#  việc QoS chi tiết từng tier là của 'services' bên dưới.
#  → Ngưỡng global PHẢI cao hơn mọi trần per-IP của tier, nếu không
#    nó sẽ trở thành trần thật và làm sai thiết kế tier.
# =====================================================================
  - id: global-abuse-guard
    plugins:
      # Mức trần cho concurrent connection — KẾT NỐI ĐỒNG THỜI / IP.
      # Với object storage, đây là chỉ số saturation THẬT: 1 PUT 5GB giữ
      # connection hàng phút → 50 req/s nghe nhỏ nhưng có thể là 50 upload
      # 5GB song song. Concurrency quan trọng hơn req/s.
      limit-conn:
        conn: 10000                  # /IP — tune theo benchmark
        burst: 5000                  # cho vọt thêm 50 trước khi từ chối
        default_conn_delay: 0.1     # giây — delay mỗi conn vượt ngưỡng
        key_type: var
        key: remote_addr
        rejected_code: 429        # KHÔNG để mặc định 503 → 429 cho user/dev rõ
        rejected_msg: "Too many concurrent connections from your IP"
      # GHI CHÚ: limit-conn dùng shared dict NODE-LOCAL (không có policy redis).
      # Chạy N node → ngưỡng hiệu lực mỗi node. Tính: conn_node = conn_tổng / N.

      # ── Inject route_id / service_id vào request header — PHỤC VỤ ACCESS LOG ──
      #
      # LÝ DO CẦN PLUGIN NÀY (đọc trước khi sửa/xóa):
      #   APISIX KHÔNG có sẵn nginx variable $route_id / $service_id để dùng
      #   trực tiếp trong nginx_config.http.access_log_format. route_id/service_id
      #   chỉ tồn tại dạng Lua table field (ctx.matched_route.value.id) — truy cập
      #   được trong Lua code, nhưng nginx core KHÔNG tự nhận diện $route_id như
      #   1 compiled-in variable. Khai báo "$route_id" thẳng trong access_log_format
      #   sẽ làm nginx crash lúc compile config:
      #     nginx: [emerg] unknown "route_id" variable
      #   → container rơi vào crash loop (init → init_etcd → emerg → restart → lặp lại).
      #
      # CÁCH NÀY HOẠT ĐỘNG:
      #   Chạy ở rewrite phase, TRƯỚC khi log ghi (log ghi ở log phase, cuối request).
      #   Tự set 2 header request X-Route-Id / X-Service-Id từ ctx.matched_route
      #   (đã được APISIX core populate sẵn ở routing phase, trước rewrite).
      #   access_log_format sau đó đọc qua $http_x_route_id / $http_x_service_id
      #   (tiền tố $http_* = đọc REQUEST header, không phải $sent_http_* vốn dùng
      #   cho RESPONSE header như rate-limit fields).
      #
      # ⚠ ĐẶT Ở GLOBAL_RULES (không phải từng route/service):
      #   Áp dụng 1 lần cho TẤT CẢ route — không cần sửa 20 route file riêng lẻ.
      #   Route/service có serverless-pre-function RIÊNG sẽ KHÔNG bị mất phần này
      #   vì global_rules luôn chạy kèm, không bị route/service "đè" như cách
      #   merge plugin cùng tên ở route/service (xem RULE MERGE PLUGIN trong
      #   các file route khác — global_rules không nằm trong rule đó).
      #
      # ⚠ HEADER NÀY GỬI LÊN UPSTREAM (Cloudian/Ceph) — không chỉ dùng để log:
      #   ngx.req.set_header() sửa request TRƯỚC khi proxy đi tiếp lên backend.
      #   Nếu backend không cần thấy header lạ này, cân nhắc dùng
      #   serverless-post-function (header_filter phase, set vào RESPONSE thay vì
      #   REQUEST) thay vì cách này — đánh đổi: response header thì client cũng
      #   thấy được (có thể không muốn lộ route_id ra ngoài public).
      #   Hiện tại CHƯA xử lý việc này — cần đánh giá thêm nếu thấy không phù hợp.
      #
      # KHI CẦN CHỈNH:
      #   - Đổi tên header → sửa cả 2 chỗ: ở đây VÀ trong access_log_format
      #     ($http_x_route_id phải khớp tên header X-Route-Id viết thường có gạch dưới)
      #   - Muốn thêm field khác từ ctx.matched_route (vd upstream_id nếu route dùng
      #     upstream_id thay vì upstream inline) → đọc thêm ctx.matched_route.value.*
      serverless-pre-function:
        phase: rewrite
        functions:
          - |
            return function(conf, ctx)
              ngx.req.set_header("X-Route-Id", ctx.matched_route and ctx.matched_route.value.id or "-")
              ngx.req.set_header("X-Service-Id", ctx.matched_route and ctx.matched_route.value.service_id or "-")
              -- consumer_name: giống route_id, KHÔNG phải nginx variable có sẵn ($consumer_name
              -- sẽ làm nginx crash compile y hệt $route_id). Lấy qua ctx.consumer (Lua), set
              -- header để access_log_format đọc qua $http_x_consumer thay vì gọi thẳng biến.
              -- Chỉ có giá trị khi route dùng key-auth/jwt-auth (consumer_groups); S3 SDK ký
              -- SigV4 thì ctx.consumer là nil → fallback "-".
              ngx.req.set_header("X-Consumer", ctx.consumer and ctx.consumer.username or "-")
            end

  # ── src: global_rules/global-kafka-logger.yaml
# =====================================================================
#  global_rules — KAFKA LOGGER (áp cho mọi route & service)
#
#  1 FILE DÙNG CHUNG MỌI DC — phân biệt qua ${{DC_PROFILE}}, ĐÃ VERIFY
#  THỰC NGHIỆM hoạt động đúng cho global_rules (không chỉ conf/config.yaml
#  như tài liệu chính thức document — APISIX resolve "${{VAR}}" ở lớp đọc
#  file dùng chung TRƯỚC KHI config_yaml.lua parse YAML, áp dụng cho MỌI
#  file YAML APISIX đọc, không riêng conf/config.yaml).
#  Verify lại: xem region label trên Loki sau khi hot-reload, phải ra
#  đúng "hcm"/"han", KHÔNG phải literal "${{DC_PROFILE}}".
#
#  Mục đích: đẩy access log lên Kafka topic thay vì Loki trực tiếp.
#  Dùng khi team Observability có Kafka cluster sẵn và muốn tất cả
#  log đi qua Kafka → consumer (Logstash/Vector/Flink) → Loki/ES.
#
#  Thay thế loki-logger trực tiếp (đã disable — loki-logger.yaml.disabled)
#  vì loki-logger push HTTP trực tiếp KHÔNG có buffer/queue → mất log khi
#  Loki down/restart/network glitch (đã xác nhận qua thực tế: log bật từ
#  29/6 nhưng Grafana chỉ thấy ~600 dòng). Kafka làm buffer trung gian:
#  APISIX → Kafka (durable, retention 3 ngày) → Consumer → Loki.
#
#  Ưu điểm so với loki-logger trực tiếp:
#    - Back-pressure handling: Loki chậm/down → log nằm queue, không mất
#    - Fan-out: 1 topic → nhiều consumer (Loki + Elasticsearch + data warehouse)
#    - Replay: consumer lỗi → rewind offset, xử lý lại từ đầu
#    - Throughput cao hơn (>5k req/s): Kafka handle tốt hơn HTTP push
#
#  Nhược điểm:
#    - Phụ thuộc thêm Kafka cluster (phải hỏi team Observability)
#    - Cần consumer pipeline: Kafka → Logstash/Vector → Loki
#    - Phức tạp hơn loki-logger (thêm component, thêm điểm lỗi)
#
#  Khi nào nên dùng:
#    - Team Observability đã có Kafka và các service khác đang dùng
#    - Traffic > 5k req/s, lo ngại Loki overwhelm
#    - Cần log vào nhiều destination cùng lúc
#    - Cần replay capability khi consumer gặp sự cố
#
#  ⚠ FILE NÀY ĐANG TẮT (status: 0) — chỉ dùng làm template.
#  Bật khi có đủ thông tin từ team Observability:
#    1. Bootstrap servers (broker host:port)
#    2. Topic name
#    3. Auth (SASL username/password hoặc SSL cert)
#
#  THÔNG TIN CẦN HỎI TEAM OBSERVABILITY:
#    - Bootstrap servers: kafka-broker-1.xxx:9092,kafka-broker-2.xxx:9092
#    - Topic name:        (ví dụ: apisix-logs, gateway-logs, vnpaycloud-logs)
#    - SASL mechanism:    PLAIN | SCRAM-SHA-256 | SCRAM-SHA-512
#    - SASL credentials:  username / password
#    - SSL:               có bắt TLS không?
#
#  ⚠ QUAN TRỌNG — KHÔNG có field "ssl"/"ssl_verify" trong schema
#    kafka-logger (đã verify bằng source code, kể cả APISIX 3.17 mới nhất
#    theo docs chính thức). Kafka broker team đưa là SASL_SSL (port 9093)
#    — kafka-logger sẽ gửi PLAINTEXT (không TLS), broker listener SASL_SSL
#    NHIỀU KHẢ NĂNG sẽ reject connection ở tầng protocol (không phải lỗi
#    auth). ĐANG THỬ NGHIỆM cấu hình này để tự confirm — nếu Kafka
#    KHÔNG nhận được message, phương án thay thế là dùng log-shipping
#    agent (Vector/Filebeat) đọc trực tiếp access.log, KHÔNG dùng plugin
#    này, vì Vector support đầy đủ SASL_SSL mà kafka-logger không có.
#
#  ⚠ sasl_config PHẢI nằm TRONG TỪNG PHẦN TỬ brokers[], KHÔNG PHẢI
#    top-level plugin config (đã từng viết sai ở draft trước, gây fail
#    schema validation nếu commit).
#
#  ⚠ KHÔNG khai field "key" — schema yêu cầu type=string (không nullable),
#    "key: null" sẽ fail validation. Omit hẳn field này = round-robin
#    partition mặc định của lua-resty-kafka (đã thống nhất từ đầu, tránh
#    hot-partition do traffic lệch 1 IP/1 route như phân tích log trước).
#
#  KHI CẦN CHỈNH:
#    - Điền brokers + kafka_topic từ team Observability
#    - Bật SASL nếu Kafka yêu cầu auth
#    - Đổi producer_type: sync nếu cần đảm bảo delivery (chậm hơn)
#    - Đổi DC → CHỈ sửa .env (DC_PROFILE), KHÔNG sửa file này
#    - Nếu Kafka reject do thiếu SSL → xem ghi chú Vector ở trên
#    - Xóa comment status: 0 để bật
# =====================================================================
  - id: global-kafka-logger
    # status: 0                               # ← bỏ comment dòng này để TẮT
    plugins:
      kafka-logger:
        # ── Broker config — có SSL ────────────────────
        # brokers:
        #   - host: "172.16.189.224"
        #     port: 9093
        #     # ── Auth SASL (uncomment nếu Kafka yêu cầu) ──────────────────
        #     sasl_config:
        #       mechanism: "SCRAM-SHA-512"          # "PLAIN", "SCRAM-SHA-256", "SCRAM-SHA-512"
        #       user: "${{KAFKA_SASL_USER}}"
        #       password: "${{KAFKA_SASL_PASSWORD}}"
        #   - host: "172.16.135.112"
        #     port: 9093
        #     sasl_config:
        #       mechanism: "SCRAM-SHA-512"
        #       user: "${{KAFKA_SASL_USER}}"
        #       password: "${{KAFKA_SASL_PASSWORD}}"
        #   - host: "172.16.213.202"
        #     port: 9093
        #     sasl_config:
        #       mechanism: "SCRAM-SHA-512"
        #       user: "${{KAFKA_SASL_USER}}"
        #       password: "${{KAFKA_SASL_PASSWORD}}"

        # ── Broker config — không có SSL ────────────────────
        brokers:
          - host: "172.26.24.80"
            port: 31421
            sasl_config:
              mechanism: "SCRAM-SHA-512"          # "PLAIN", "SCRAM-SHA-256", "SCRAM-SHA-512"
              user: "${{KAFKA_SASL_USER}}"
              password: "${{KAFKA_SASL_PASSWORD}}"
          - host: "172.26.24.80"
            port: 30215
            sasl_config:
              mechanism: "SCRAM-SHA-512"
              user: "${{KAFKA_SASL_USER}}"
              password: "${{KAFKA_SASL_PASSWORD}}"
          - host: "172.26.24.80"
            port: 30412
            sasl_config:
              mechanism: "SCRAM-SHA-512"
              user: "${{KAFKA_SASL_USER}}"
              password: "${{KAFKA_SASL_PASSWORD}}"

        kafka_topic: "apisix-gateway-${{DC_PROFILE}}"
        # ── Producer config ───────────────────────────────────────────
        producer_type: async              # async: không block request (khuyến nghị) | sync: đảm bảo delivery nhưng chậm hơn
        batch_num: 10                    # gom đủ 10 message rồi mới thực sự gửi 1 lần (batch flush), không gửi ngay từng request một
        batch_max_size: 1                 # 1 block là 1 json
        timeout: 3                        # giây — timeout gửi Kafka
        # ── Key (optional) ────────────────────────────────────────────
        # key: "$remote_addr"             # partition by client IP, KHÔNG khai "key" — schema yêu cầu type=string, "key: null" sẽ fail validation
        # ── SSL (uncomment nếu Kafka dùng TLS) ───────────────────────
        ssl: true
        ssl_verify: false              # false nếu cert nội bộ/self-signed, xem ghi chú, đổi true khi đã verify CA support
        # ── Log meta (gửi kèm trong message) ─────────────────────────
        meta_format: default              # default: JSON với các field chuẩn | origin: raw nginx log line
        api_version: 2    # patch [5.b] — kích hoạt Message Format v1, có timestamp thật

  # ── src: global_rules/global-prometheus.yaml
# global_rules/global-prometheus.yaml
# =====================================================================
#  global_rules — PROMETHEUS (áp cho mọi route & service)
#
#  Mục đích: thu metric TẤT CẢ route thay vì phải đặt prometheus: {}
#  từng route riêng lẻ.
#
#  Khác với cách hiện tại (per-route):
#    Per-route: chỉ route nào có prometheus: {} mới thu metric
#    → Phù hợp khi muốn kiểm soát cardinality (lab/debug route bỏ qua)
#
#    Global: TẤT CẢ route đều thu metric kể cả lab/debug
#    → Phù hợp khi muốn visibility đầy đủ, chấp nhận cardinality cao hơn
#
#  ⚠ NẾU BẬT FILE NÀY:
#    - Các route đang có prometheus: {} vẫn giữ nguyên, không xung đột
#      (global_rules chạy song song, không đè route plugin)
#    - Nên xóa prometheus: {} ở từng route để tránh trùng lặp metric
#    - Cardinality tăng — label `route` sẽ có thêm các lab/debug route
#
#  KHI CẦN CHỈNH:
#    - Muốn tắt global → xóa file này hoặc thêm status: 0
#    - Muốn quay về per-route → xóa file này, giữ prometheus: {} từng route
# =====================================================================
  - id: global-prometheus
    plugins:
      prometheus: {}


# ═══ consumer_groups (3 files) ════════════════════════════════════════════════
consumer_groups:
  # ── src: consumer_groups/consumer-group-s3bucket-internal.yaml
  # =============================================================================
  # MỤC ĐÍCH — tầng policy áp theo BUCKET S3 cụ thể (KHÁC với control-plane API)
  # =============================================================================
  # 3 group này KHÔNG liên quan gì đến cg-standard/cg-premium/cg-internal-batch
  # cũ (dùng cho control-plane API qua key-auth, đã xóa) — đây là nhánh RIÊNG
  # cho S3 dataplane, resolve theo TÊN BUCKET (không phải AKID/chữ ký SigV4).
  #
  # CƠ CHẾ (chi tiết xem plugins/custom/s3-bucket-name-consumer.lua):
  #   request → s3-normalizer-bucket-name (parse bucket từ URL, set ctx.s3_bucket_name)
  #           → s3-bucket-name-consumer (bucket có trong consumers.yaml không?)
  #           → CÓ  → attach_consumer() → merge plugin của group_id tương ứng
  #                    (Consumer Group nằm TRÊN Route/Plugin Config trong thứ tự
  #                    merge — policy ở đây sẽ ĐÈ policy mặc định của route)
  #           → KHÔNG → bỏ qua, dùng nguyên policy mặc định ở Route/Plugin Config
  #                    (vd plugin-config-qos-sdk: limit-count 4000 req/s theo AKID)
  #
  # TRẠNG THÁI HIỆN TẠI (2026-07-13): CẢ 3 GROUP ĐANG Ở "SOFT MODE" — QUAN SÁT,
  #   KHÔNG ENFORCE. Plugin thật (ip-restriction/limit-count) đang comment out,
  #   chỉ bật response-rewrite để xác nhận resolve đúng qua header response
  #   (X-Debug-Consumer-Resolved), không chặn/giới hạn traffic thật nào.
  #
  # CHUYỂN SANG ENFORCEMENT THẬT: bỏ comment phần plugin tương ứng trong từng
  #   group bên dưới. KHÔNG cần sửa route hay file .lua — chỉ sửa file này,
  #   gitsync tự pull (≤30s), APISIX tự hot-reload, không cần restart container.
  #   Có thể giữ hoặc xóa response-rewrite tùy còn cần debug header hay không.
  #
  # THÊM BUCKET MỚI VÀO 1 GROUP: thêm entry trong `consumers:` bên dưới với
  #   username = "bucket-<tên-bucket-thật>" (prefix "bucket-" BẮT BUỘC — xem
  #   NAMESPACE COLLISION trong s3-bucket-name-consumer.lua) và group_id trỏ
  #   đúng 1 trong 3 id dưới đây.
  # =============================================================================
  # ── src: consumer_groups/consumer-group-s3bucket-internal.yaml
  # ---------------------------------------------------------------------------
  # Ý NGHĨA: bucket nội bộ (team/dự án của chính hạ tầng), độ tin cậy cao nhất
  #   trong 3 group — traffic nội bộ thường ổn định, kiểm soát được nguồn gốc.
  # QUOTA DỰ KIẾN khi bật limit-count: 20000 req/s — RỘNG NHẤT trong 3 group.
  # KHÔNG cần ip-restriction — bucket internal không cần allowlist theo IP.
  # ---------------------------------------------------------------------------
  - id: consumer-group-s3bucket-internal
    plugins:
      # limit-count:
      #   count: 20000
      #   time_window: 1
      #   key_type: var
      #   key: consumer_name

      response-rewrite:
        headers:
          set:
            X-Debug-Consumer-Resolved: "$consumer_name"

  # ── src: consumer_groups/consumer-group-s3bucket-partner.yaml
  # =============================================================================
  # MỤC ĐÍCH — tầng policy áp theo BUCKET S3 cụ thể (KHÁC với control-plane API)
  # =============================================================================
  # 3 group này KHÔNG liên quan gì đến cg-standard/cg-premium/cg-internal-batch
  # cũ (dùng cho control-plane API qua key-auth, đã xóa) — đây là nhánh RIÊNG
  # cho S3 dataplane, resolve theo TÊN BUCKET (không phải AKID/chữ ký SigV4).
  #
  # CƠ CHẾ (chi tiết xem plugins/custom/s3-bucket-name-consumer.lua):
  #   request → s3-normalizer-bucket-name (parse bucket từ URL, set ctx.s3_bucket_name)
  #           → s3-bucket-name-consumer (bucket có trong consumers.yaml không?)
  #           → CÓ  → attach_consumer() → merge plugin của group_id tương ứng
  #                    (Consumer Group nằm TRÊN Route/Plugin Config trong thứ tự
  #                    merge — policy ở đây sẽ ĐÈ policy mặc định của route)
  #           → KHÔNG → bỏ qua, dùng nguyên policy mặc định ở Route/Plugin Config
  #                    (vd plugin-config-qos-sdk: limit-count 4000 req/s theo AKID)
  #
  # TRẠNG THÁI HIỆN TẠI (2026-07-13): CẢ 3 GROUP ĐANG Ở "SOFT MODE" — QUAN SÁT,
  #   KHÔNG ENFORCE. Plugin thật (ip-restriction/limit-count) đang comment out,
  #   chỉ bật response-rewrite để xác nhận resolve đúng qua header response
  #   (X-Debug-Consumer-Resolved), không chặn/giới hạn traffic thật nào.
  #
  # CHUYỂN SANG ENFORCEMENT THẬT: bỏ comment phần plugin tương ứng trong từng
  #   group bên dưới. KHÔNG cần sửa route hay file .lua — chỉ sửa file này,
  #   gitsync tự pull (≤30s), APISIX tự hot-reload, không cần restart container.
  #   Có thể giữ hoặc xóa response-rewrite tùy còn cần debug header hay không.
  #
  # THÊM BUCKET MỚI VÀO 1 GROUP: thêm entry trong `consumers:` bên dưới với
  #   username = "bucket-<tên-bucket-thật>" (prefix "bucket-" BẮT BUỘC — xem
  #   NAMESPACE COLLISION trong s3-bucket-name-consumer.lua) và group_id trỏ
  #   đúng 1 trong 3 id dưới đây.
  # =============================================================================
  # ── src: consumer_groups/consumer-group-s3bucket-partner.yaml
  # ---------------------------------------------------------------------------
  # Ý NGHĨA: bucket của đối tác/khách hàng đã đăng ký chính thức (không phải
  #   anonymous, không phải nội bộ) — cần quota RIÊNG tách khỏi mặc định
  #   AKID-based (plugin-config-qos-sdk: 4000 req/s dùng chung mọi AKID chưa
  #   đăng ký), để đảm bảo SLA cho đối tác không bị ảnh hưởng bởi traffic AKID
  #   khác cùng chung route.
  # QUOTA DỰ KIẾN: limit-count 4000 req/s — bằng đúng mặc định hiện tại, coi
  #   như "đảm bảo SLA riêng theo consumer_name" thay vì "ưu đãi thêm". Nếu
  #   từng đối tác cần quota khác nhau thật sự, cân nhắc tách thêm group con
  #   (vd consumer-group-s3bucket-partner-premium) thay vì sửa số ở đây.
  # ---------------------------------------------------------------------------
  - id: consumer-group-s3bucket-partner
    plugins:
      # limit-count:
      #   count: 4000
      #   time_window: 1
      #   key_type: var
      #   key: consumer_name

      response-rewrite:
        headers:
          set:
            X-Debug-Consumer-Resolved: "$consumer_name"

  # ── src: consumer_groups/consumer-group-s3bucket-restricted.yaml
  # =============================================================================
  # MỤC ĐÍCH — tầng policy áp theo BUCKET S3 cụ thể (KHÁC với control-plane API)
  # =============================================================================
  # 3 group này KHÔNG liên quan gì đến cg-standard/cg-premium/cg-internal-batch
  # cũ (dùng cho control-plane API qua key-auth, đã xóa) — đây là nhánh RIÊNG
  # cho S3 dataplane, resolve theo TÊN BUCKET (không phải AKID/chữ ký SigV4).
  #
  # CƠ CHẾ (chi tiết xem plugins/custom/s3-bucket-name-consumer.lua):
  #   request → s3-normalizer-bucket-name (parse bucket từ URL, set ctx.s3_bucket_name)
  #           → s3-bucket-name-consumer (bucket có trong consumers.yaml không?)
  #           → CÓ  → attach_consumer() → merge plugin của group_id tương ứng
  #                    (Consumer Group nằm TRÊN Route/Plugin Config trong thứ tự
  #                    merge — policy ở đây sẽ ĐÈ policy mặc định của route)
  #           → KHÔNG → bỏ qua, dùng nguyên policy mặc định ở Route/Plugin Config
  #                    (vd plugin-config-qos-sdk: limit-count 4000 req/s theo AKID)
  #
  # TRẠNG THÁI HIỆN TẠI (2026-07-13): CẢ 3 GROUP ĐANG Ở "SOFT MODE" — QUAN SÁT,
  #   KHÔNG ENFORCE. Plugin thật (ip-restriction/limit-count) đang comment out,
  #   chỉ bật response-rewrite để xác nhận resolve đúng qua header response
  #   (X-Debug-Consumer-Resolved), không chặn/giới hạn traffic thật nào.
  #
  # CHUYỂN SANG ENFORCEMENT THẬT: bỏ comment phần plugin tương ứng trong từng
  #   group bên dưới. KHÔNG cần sửa route hay file .lua — chỉ sửa file này,
  #   gitsync tự pull (≤30s), APISIX tự hot-reload, không cần restart container.
  #   Có thể giữ hoặc xóa response-rewrite tùy còn cần debug header hay không.
  #
  # THÊM BUCKET MỚI VÀO 1 GROUP: thêm entry trong `consumers:` bên dưới với
  #   username = "bucket-<tên-bucket-thật>" (prefix "bucket-" BẮT BUỘC — xem
  #   NAMESPACE COLLISION trong s3-bucket-name-consumer.lua) và group_id trỏ
  #   đúng 1 trong 3 id dưới đây.
  # =============================================================================
  # ── src: consumer_groups/consumer-groups-s3bucket-restricted.yaml
  # ---------------------------------------------------------------------------
  # Ý NGHĨA: bucket nhạy cảm (dữ liệu private/tài chính/compliance...) — cần
  #   HẠN CHẾ THEO NGUỒN TRUY CẬP, không chỉ giới hạn tốc độ.
  # ENFORCEMENT DỰ KIẾN: ip-restriction whitelist — CHỈ IP trong danh sách mới
  #   truy cập được, còn lại 403 dù request hợp lệ (bucket có thật, SigV4 đúng).
  # ⚠⚠⚠ "10.0.0.0/8" hiện tại CHỈ LÀ VÍ DỤ LÚC THIẾT KẾ — PHẢI thay bằng dải
  #   IP THẬT (VPN nội bộ / subnet ứng dụng được phép) trước khi bỏ comment,
  #   nếu không sẽ chặn NHẦM toàn bộ client thật (IP mẫu này không khớp IP
  #   client test thực tế đã dùng trong quá trình debug 2026-07-13).
  # KHÔNG có limit-count mặc định — mục tiêu chính là allowlist theo nguồn,
  #   không phải quota. Muốn cả 2 (vừa allowlist vừa giới hạn tốc độ) thì
  #   thêm limit-count riêng bên cạnh ip-restriction trong group này.
  # ---------------------------------------------------------------------------
  - id: consumer-group-s3bucket-restricted
    plugins:
      # ip-restriction:
      #   whitelist: ["10.0.0.0/8"]        # ⚠ THAY bằng dải IP thật trước khi bật

      response-rewrite:
        headers:
          set:
            X-Debug-Consumer-Resolved: "$consumer_name"


# ═══ consumers (1 files) ════════════════════════════════════════════════
consumers:
  # ── src: consumers/consumer-bucket-name.yaml

  - username: bucket-thuyldx-hni                    # prefix "bucket-" BẮT BUỘC
    group_id: consumer-group-s3bucket-restricted    # group MỚI, tách khỏi cg-standard/premium/internal-batch
    plugins:
      custom.s3-bucket-name-consumer: {}            # marker rỗng — chỉ cần tồn tại để consumer_mod.plugin() thấy

  - username: bucket-thuyldx-my-private
    group_id: consumer-group-s3bucket-restricted
    plugins:
      custom.s3-bucket-name-consumer: {}

  - username: bucket-duyvv1-my-bucket-public
    group_id: consumer-group-s3bucket-partner
    plugins:
      custom.s3-bucket-name-consumer: {}


