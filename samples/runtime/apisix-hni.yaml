# ═══ consumers (3 files) ════════════════════════════════════════════════
consumers:
  # ── src: consumers/automation_reporting.yaml
  # Mỗi consumer = 1 account/service. group_id chính là "bảng mapping" quota.
  - username: automation_reporting
    group_id: cg-standard
    plugins:
      key-auth:

  # ── src: consumers/customer-acme.yaml
  # Mỗi consumer = 1 account/service. group_id chính là "bảng mapping" quota.
  - username: customer_acme
    group_id: cg-premium
    plugins:
      key-auth:

  # ── src: consumers/internal_logcleaner.yaml
  # Mỗi consumer = 1 account/service. group_id chính là "bảng mapping" quota.
  - username: internal_logcleaner
    group_id: cg-internal-batch
    plugins:
      key-auth:
        key: "<<thay-API-KEY>>"


