# ═══UPSTREAMS═════════════════════════════════════════════════
# Upstreams — định nghĩa 1 lần, reuse cho cả HTTP + HTTPS routes
# ═════════════════════════════════════════════════════════════
upstreams:
  - id: 100
    name: s3-hcm
    type: roundrobin
    scheme: https
    pass_host: pass
    nodes:
      "172.26.29.231:443": 1
      "172.26.29.232:443": 1
      "172.26.29.233:443": 1
      "172.26.29.234:443": 1
    checks:
      active:
        type: https
        http_path: "/"
        host: "s3-hcm.sds.infiniband.vn"
        timeout: 5
        https_verify_certificate: false
        req_headers:
          - "User-Agent: APISIX-HealthCheck"
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
          tcp_failures: 3

  - id: 101
    name: s3-hni
    type: roundrobin
    scheme: https
    pass_host: pass
    nodes:
      "172.25.171.24:443": 1
      "172.25.171.25:443": 1
      "172.25.171.26:443": 1
    checks:
      active:
        type: https
        http_path: "/"
        host: "s3-hni.sds.infiniband.vn"
        timeout: 5
        https_verify_certificate: false
        req_headers:
          - "User-Agent: APISIX-HealthCheck"
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
          tcp_failures: 3

# DC1: S3 HCM + eKYC service đây là test cho webhook nhé
  - id: ceph-rgw-dc1
    type: roundrobin
    nodes:
      - host: 172.25.216.135
        port: 3950
        weight: 1
        priority: 1
#      - host: 172.25.216.130
#        port: 3950
#        weight: 1
#        priority: 0
    scheme: http
    checks:
      active:
        type: http
        http_path: /
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3

  - id: ekyc-backend-dc1  # test cho trường hợp 2 DC ko giống nhau về các route và dịch vụ
    type: roundrobin
    nodes:
      - host: 172.25.216.241
        port: 8080
        weight: 1
    scheme: http

# ═══ROUTES════════════════════════════════════════════════════
# ═════════════════════════════════════════════════════════════
routes:
  # HCM — s3-hcm.sds.infiniband.vn → upstream id=100
  # HTTP → HTTPS redirect (tắt mặc định)
  - id: 10
    name: hcm-http-redirect
    status: 0
    uri: "/*"
    hosts:
      - "s3-hcm.sds.infiniband.vn"
      - "*.s3-hcm.sds.infiniband.vn"
    vars:
      - ["scheme", "==", "http"]
    priority: 10
    plugins:
      redirect:
        http_to_https: true
        ret_code: 301

  # HTTP proxy (active khi redirect tắt)
  - id: 12
    name: hcm-http-proxy
    status: 1
    uri: "/*"
    hosts:
      - "s3-hcm.sds.infiniband.vn"
      - "*.s3-hcm.sds.infiniband.vn"
    vars:
      - ["scheme", "==", "http"]
    priority: 0
    upstream_id: 100
    plugins:
      proxy-control:
        request_buffering: false
      custom.s3-normalizer-bucket-name:
        path_hosts:
          - "s3-hcm.sds.infiniband.vn"
        vhost_domains:
          - "s3%-hcm%.sds%.infiniband%.vn"
    timeout:
      connect: 60
      send: 600
      read: 600

  # HTTPS proxy
  - id: 11
    name: hcm-https-proxy
    status: 1
    uri: "/*"
    hosts:
      - "s3-hcm.sds.infiniband.vn"
      - "*.s3-hcm.sds.infiniband.vn"
    vars:
      - ["scheme", "==", "https"]
    upstream_id: 100
    plugins:
      proxy-control:
        request_buffering: false
      custom.s3-normalizer-bucket-name:
        path_hosts:
          - "s3-hcm.sds.infiniband.vn"
        vhost_domains:
          - "s3%-hcm%.sds%.infiniband%.vn"
    timeout:
      connect: 60
      send: 600
      read: 600

  # HNI — s3-hni.sds.infiniband.vn → upstream id=101
  # HTTP → HTTPS redirect
  - id: 20
    name: hni-http-redirect
    status: 0
    uri: "/*"
    hosts:
      - "s3-hni.sds.infiniband.vn"
      - "*.s3-hni.sds.infiniband.vn"
    vars:
      - ["scheme", "==", "http"]
    priority: 10
    plugins:
      redirect:
        http_to_https: true
        ret_code: 301

  # HTTP proxy
  - id: 22
    name: hni-http-proxy
    status: 1
    uri: "/*"
    hosts:
      - "s3-hni.sds.infiniband.vn"
      - "*.s3-hni.sds.infiniband.vn"
    vars:
      - ["scheme", "==", "http"]
    priority: 0
    upstream_id: 101
    plugins:
      proxy-control:
        request_buffering: false
      custom.s3-normalizer-bucket-name:
        path_hosts:
          - "s3-hni.sds.infiniband.vn"
        vhost_domains:
          - "s3%-hni%.sds%.infiniband%.vn"
    timeout:
      connect: 60
      send: 600
      read: 600

  # HTTPS proxy
  - id: 21
    name: hni-https-proxy
    status: 1
    uri: "/*"
    hosts:
      - "s3-hni.sds.infiniband.vn"
      - "*.s3-hni.sds.infiniband.vn"
    vars:
      - ["scheme", "==", "https"]
    upstream_id: 101
    plugins:
      proxy-control:
        request_buffering: false
      custom.s3-normalizer-bucket-name:
        path_hosts:
          - "s3-hni.sds.infiniband.vn"
        vhost_domains:
          - "s3%-hni%.sds%.infiniband%.vn"
    timeout:
      connect: 60
      send: 600
      read: 600

  # DEBUG raw — dump upstream request gốc ra từ client python http server, không normalize
  # Dùng để: verify SDK gửi đúng vhost/path-style chưa
  # Trigger: header "X-Debug: 1" — không ảnh hưởng production
  # Tắt: status: 0
  - id: 99
    name: debug-dump
    status: 0       # tắt mặc định, bật khi cần
    uri: "/*"
    hosts:
      - "s3-hcm.sds.infiniband.vn"
      - "*.s3-hcm.sds.infiniband.vn"
      - "s3-hni.sds.infiniband.vn"
      - "*.s3-hni.sds.infiniband.vn"
    vars:
      - ["http_x_debug", "==", "1"]
    priority: 100
    plugins:
      proxy-control:
        request_buffering: false
    timeout:
      connect: 10
      send: 30
      read: 30
    upstream:
      type: roundrobin
      scheme: http
      pass_host: pass
      nodes:
        "127.0.0.1:9999": 1

  # DEBUG normalized — dump request SAU KHI normalize
  # Dùng để: verify plugin s3-normalizer-bucket-name rewrite đúng chưa
  # Trigger: header "X-Debug: 1" — không ảnh hưởng production
  - id: 98
    name: debug-dump-normalized
    status: 0                          # tắt mặc định, bật khi cần
    uri: "/*"
    hosts:
      - "s3-hcm.sds.infiniband.vn"
      - "*.s3-hcm.sds.infiniband.vn"
      - "s3-hni.sds.infiniband.vn"
      - "*.s3-hni.sds.infiniband.vn"
    vars:  
      - ["http_x_debug", "==", "2"]     # X-Debug: 2 để phân biệt với raw
    priority: 100
    plugins:
      proxy-control:
        request_buffering: false
      custom.s3-normalizer-bucket-name:  # ✅ gắn normalizer để verify rewrite
        path_hosts:
          - "s3-hcm.sds.infiniband.vn"
          - "s3-hni.sds.infiniband.vn"
        vhost_domains:
          - "s3%-hcm%.sds%.infiniband%.vn"
          - "s3%-hni%.sds%.infiniband%.vn"
    timeout:
      connect: 10
      send: 30
      read: 30
    upstream:
      type: roundrobin
      scheme: http
      pass_host: pass
      nodes:
        "127.0.0.1:9999": 1

    # ── [LAB] Ceph RGW — path-style ────────────────────────────
    # s3.hcm.lab.thuyldx/<bucket>/key  
  - id: s3-lab-dc1-path
    name: s3-lab-dc1-path
    uri: /*
    host: s3.hcm.lab.thuyldx
    upstream_id: ceph-rgw-dc1
    plugins:
      proxy-control:
        request_buffering: false
      custom.s3-normalizer-bucket-name:
        path_hosts:
          - "s3.hcm.lab.thuyldx"
        vhost_domains:
          - "s3%.hcm%.lab%.thuyldx"
    timeout:
      connect: 60
      send: 600
      read: 600

  # ── [LAB] Ceph RGW — vhost-style ───────────────────────────
  # <bucket>.s3.hcm.lab.thuyldx/key → rewrite → s3.hcm.lab.thuyldx/<bucket>/key
  - id: s3-lab-dc1-vhost
    name: s3-lab-dc1-vhost
    uri: /*
    host: "*.s3.hcm.lab.thuyldx"
    upstream_id: ceph-rgw-dc1
    plugins:
      proxy-control:
        request_buffering: false
      custom.s3-normalizer-bucket-name:
        path_hosts:
          - "s3.hcm.lab.thuyldx"
        vhost_domains:
          - "s3%.hcm%.lab%.thuyldx"
    timeout:
      connect: 60
      send: 600
      read: 600

  # ── [LAB] eKYC service ─────────────────────────────────────
  # Không phải S3 — không gắn normalizer
  - id: ekyc-dc1
    uri: /ekyc/*
    host: api.dc1.lab.thuyldx
    upstream_id: ekyc-backend-dc1

  # ── [LAB] DC1-only test service ────────────────────────────
  # Không phải S3 — không gắn normalizer
  - id: dc1-only-service
    uri: /dc1-test
    host: test.dc1.lab
    upstream:
      type: roundrobin
      nodes:
        - host: 172.25.216.135
          port: 3950
          weight: 1
      scheme: http

# ═══CERTIFICATE════════════════════════════════════════════════════
# Dùng upstreams section riêng với integer ID — routes reference qua upstream_id
# HTTP redirect: bật status: 1 / tắt status: 0 — hot-reload không cần restart
# Cert placeholder — chạy inject-certs.sh trước khi docker compose up
# ══════════════════════════════════════════════════════════════════
ssls:
  - id: 1
    snis:
      - "s3-hcm.sds.infiniband.vn"
      - "*.s3-hcm.sds.infiniband.vn"
    cert: |
      <PASTE_CONTENT_OF_s3-hcm.sds.infiniband.vn.cert_HERE>
    key: |
      <PASTE_CONTENT_OF_s3-hcm.sds.infiniband.vn.key_HERE>
    ssl_protocols:
      - TLSv1.2
      - TLSv1.3

  - id: 2
    snis:
      - "s3-hni.sds.infiniband.vn"
      - "*.s3-hni.sds.infiniband.vn"
    cert: |
      <PASTE_CONTENT_OF_s3-hni.sds.infiniband.vn.cert_HERE>
    key: |
      <PASTE_CONTENT_OF_s3-hni.sds.infiniband.vn.key_HERE>
    ssl_protocols:
      - TLSv1.2
      - TLSv1.3

