# Tuned for S3 large-object proxy (5 GB max body, no buffering)

apisix:
  # node_listen: 9080
  node_listen:
    - port: 80

  enable_ipv6: false

  # enable_http2 từ APISIX 3.9+ phải đặt ở apisix level, KHÔNG trong ssl.listen
  enable_http2: false     # S3 SDK dùng HTTP/1.1; tắt HTTP/2 để tránh vấn đề streaming

  # Bật pattern shared utility library
  # Các file Lua library thuần (utility module) sẽ lưu ở đây.
  # VD: file cloudian-regex.lua -> cho phép require("cloudian-regex") từ bất kỳ plugin nào
  extra_lua_path: "/usr/local/apisix/apisix/plugins/libraries/?.lua"
  extra_lua_cpath: "/usr/local/apisix/apisix/plugins/libraries/?.so"  # cho C module (.so)

  ssl:
    enable: true
    listen:
      - port: 443    # HTTPS standard — S3, CMC, HyperIQ, IAM, S3-Admin, STS, Ceph RGW
      - port: 8443   # Ceph RGW Admin UI (s3-rgwhcm-admin, s3-rgwhni-admin → upstream :8443)
      - port: 16443  # Cloudian IAM + STS (iam.sds, sts.sds → upstream :16443)
      - port: 19443  # Cloudian S3 Admin (s3-admin.sds → upstream :19443)
    # ⚠️  QUAN TRỌNG — Khi thêm service mới với port đặc biệt:
    #   1. Thêm port vào danh sách listen ở đây
    #   2. Restart container: docker compose restart apisix-standalone
    #      (thay đổi config.yaml KHÔNG hot-reload, bắt buộc phải restart)
    #   3. Khác với apisix-hcm.yaml (routes/upstreams) — file đó hot-reload tự động mỗi 60s
    # 
    # Port reference — Cloudian HyperStore ecosystem:
    #   :443   → S3 HTTPS, CMC Portal, HyperIQ, Ceph RGW S3
    #   :8443  → Ceph RGW Admin UI (Ceph dashboard)
    #   :16443 → Cloudian IAM service
    #   :18090 → Cloudian SQS (HTTP, không cần SSL listen)
    #   :19443 → Cloudian S3 Admin console
    ssl_protocols: "TLSv1.2 TLSv1.3"
    ssl_ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384"
    ssl_session_timeout: "86400s"

    # Fallback cert khi client connect bằng IP hoặc không gửi SNI extension
    # Dùng wildcard *.sds.infiniband.vn — cover toàn bộ service .sds (giống nginx cũ)
    ssl_certificate: /usr/local/apisix/certs/sds.infiniband.vn.cert
    ssl_certificate_key: /usr/local/apisix/certs/sds.infiniband.vn.key

# ── VAULT SECRET PROVIDER (uncomment khi có thông tin Vault) ─────────────
# Khi enable, SSL entry trong apisix-hcm.yaml dùng:
#   cert: $secret://vault/ssl/<domain>/cert
#   key:  $secret://vault/ssl/<domain>/key
# Không cần inject cert vào yaml, không cần ./certs/ mount nữa.
# Xem hướng dẫn: scripts/libraries/decrypt-cert-helper.sh
# ─────────────────────────────────────────────────────────────────────────
secrets:
  - id: vault-provider
    provider: vault
    uri: "${{VAULT_ADDR}}"
    kv: "cloud/profile"           # KV mount name
    prefix: "app/apisix/certs"   # KV mount prefix — confirm với team Vault
    token: "${{VAULT_TOKEN}}"        # từ env VAULT_TOKEN trong docker-compose

    # Hoặc dùng AppRole (recommended cho production):
    # auth:
    #   method: approle
    #   role_id: "${{VAULT_ROLE_ID}}"
    #   secret_id: "${{VAULT_SECRET_ID}}"

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

# ─── Nginx directive overrides (thông qua nginx_config) ──────────────────
# Không có trường tùy ý ở tầng apisix; timeout upload/body được inject qua nginx_config.http bên dưới.
nginx_config:
  # Mỗi worker chạy trên 1 CPU core -> xử lý song song
  worker_processes: auto
  # worker_processes: 2
  worker_cpu_affinity: auto
  # Số lượng file descriptor tối đa mà mỗi worker process có thể mở đồng thời
  # Luỹ thừa 2: 2^13=8192, 2^14=16384, 2^15=32768, 2^16=65536
  # rlimit_nofile phải ≥ worker_connections × 2 + overhead (worker_connections × 2 × worker_processes)
  worker_rlimit_nofile: 32768   # explicit — tránh APISIX tự tính connections*2+64 vượt host limit

  event:
    # Mỗi container APISIX handle tối đa 32768 concurrent connection
    # Tổng concurrent connection mỗi APISIX container = 2 × 32768 = 65536 total/container
    worker_connections: 32768

  http:
    # ── Hash tables ───────────────────────────────────────────────────────
    server_names_hash_bucket_size: 128

    # ── Logging ───────────────────────────────────────────────────────────
#    access_log_format: '$remote_addr - $remote_user [$time_local] [DC1] "$request" $status $body_bytes_sent'
    access_log: /usr/local/apisix/logs/access.log
    error_log: /usr/local/apisix/logs/error.log
    error_log_level: warn               # đừng để debug trên prod

    # ── Body / Upload ─────────────────────────────────────────────────────
    # client_max_body_size: "100G"      #CRITICAL for Cloudian S3 SANDBOX
    client_max_body_size: "5120m"       # 5 GB; PHẢI là chuỗi có đơn vị. Lỗi 413 Request Entity Too Large ->  0 = unlimited, Ceph/Cloudian tự giới hạn object size
    client_body_buffer_size: "16k"      # Nhỏ thôi; thực sự stream, không buffer vào memory
    client_body_timeout: 600            # giây — client gửi body tối đa 10 phút
    client_header_timeout: 150

    # Timeouts
    # ── Keepalive client-side ─────────────────────────────────────────────
    keepalive_timeout: 650              # giây
    keepalive_requests: 1000

    # ── Keepalive upstream ───────────────────────────────────────────────────────────────
    # upstream_keepalive_pool_size: 512
    # upstream_keepalive_idle_timeout: 60

    # ── Performance ──────────────────────────────────────────────────────
    # sendfile: on
    # server_tokens: off
    # send_timeout: 300s

    # Proxy
    # APISIX forward proxy sẽ buffer request body vào memory/disk nếu không cẩn thận.
    # proxy_request_buffering off đảm bảo APISIX stream thẳng 100GB object lên Cloudian thay vì buffer, tránh OOM.
    # ── Proxy timeouts (upstream S3 backend) ─────────────────────────────
    proxy_connect_timeout: 60           # giây — establish TCP
    proxy_send_timeout: 600             # giây — gửi request tới backend (upload)
    proxy_read_timeout: 600             # giây — nhận response từ backend (download)

    # ── No buffering ──────────────────────────────────────────────────────
    proxy_buffering: "off"              # stream response thẳng về client
    proxy_request_buffering: "off"      # stream request body thẳng lên backend
    proxy_max_temp_file_size: "0"       # cấm temp file cho response buffer

    # ── Proxy SSL (backend là HTTPS self-signed / private CA) ─────────────
    proxy_ssl_verify: "off"
    proxy_ssl_protocols: "TLSv1.2 TLSv1.3"
    proxy_ssl_session_reuse: "on"
    # Force nginx gửi đúng SNI từ Host header khi TLS handshake tới backend
    # Không set → nginx dùng IP làm SNI → Cloudian không nhận ra domain
    proxy_ssl_server_name: "on"
    proxy_ssl_name: "$host"             # SNI = Host header từ client = domain Cloudian nhận ra

    # ── HTTP version & proxy headers ─────────────────────────────────────
    # Đặt ở nginx_config level để đảm bảo nginx variables được resolve đúng.
    # proxy-rewrite plugin trong standalone YAML KHÔNG resolve nginx variables.
    proxy_http_version: "1.1"

    # ── Gzip (tắt hoàn toàn cho S3 binary/pre-compressed) ─────────────────
    gzip: "off"

    # ── TCP optimization ──────────────────────────────────────────────────
    tcp_nopush: "on"
    tcp_nodelay: "on"

    # ── Lua ───────────────────────────────────────────────────────────────
    # Lua shared dict cho prometheus (APISIX dùng riêng)
    # APISIX tự quản lý, không cần khai báo thêm
    #
    # ── GHI CHÚ POLICY THEO PLUGIN (bản 3.15) ─────────────────────────────
    # Nếu scale ngang mà dùng policy: local ⇒ giới hạn thực = limit × số node. 
    # Muốn trần toàn cục bắt buộc policy: redis cho limit-count. 
    # (Với limit-req/limit-conn, kiểm tra hỗ trợ redis trên đúng bản 3.15 của bạn;
    #      nếu không có thì tính trần per-node = trần_tổng / số_node.)
    #  limit-count : local / redis / redis-cluster  → đếm req/s CROSS-NODE OK.
    #  limit-req   : shared dict NODE-LOCAL.  Multi-node → rate tính mỗi node.
    #  limit-conn  : shared dict NODE-LOCAL.  Multi-node → conn tính mỗi node.
    #  → Chỉ limit-count chia sẻ qua Redis. Concurrency/leaky-bucket per-node;
    #    chạy N node thì đặt ngưỡng limit-conn/limit-req = (tổng / N).
    lua_shared_dicts:
      internal-status: "10m"
      plugin-limit-req: "10m"
      plugin-limit-count: "10m"
      prometheus-metrics: 15m

plugin_attr:
  prometheus:
    export_addr:
      ip: "0.0.0.0"
      port: 9091
    export_uri: /apisix/prometheus/metrics
    metric_prefix: "apisix_"

    # Tương đương lua_shared_dict prometheus_metrics 10M
    metric_prefix: "apisix_"
    # Labels tương đương {host, status} trong nginx
#    default_buckets:
#      - 0.005
#      - 0.01
#      - 0.025
#      - 0.05
#      - 0.1
#      - 0.25
#      - 0.5
#      - 1
#      - 2.5
#      - 5
#      - 10

# Bật plugin của bạn lên
plugins:
#  - ... (giữ nguyên danh sách plugin mặc định của APISIX)
  - real-ip
  - client-control
  - proxy-control
  - request-id
  - zipkin
  - prometheus
  - ip-restriction
  - ua-restriction
  - referer-restriction
  - cors
  - limit-req
  - limit-count
  - limit-conn
  - key-auth
  - jwt-auth
  - basic-auth
  - openid-connect
  - hmac-auth
  - authz-keycloak
  - proxy-rewrite
  - redirect
  - response-rewrite
  - grpc-transcode
  - fault-injection
  - api-breaker
  - traffic-split
  - request-validation
  - custom.s3-normalizer-bucket-name  # S3 API gateway — normalize vhost→path, validate bucket
  - custom.cmc-validator-bucket-name  # CMC Portal — validate bucket name khi tạo bucket qua UI
