  # ═══════════════════════════════════════════════════════════════════
  # Plugin auth KHÔNG nằm trong danh sách default ở config.lua (nghĩa là
  # KHÔNG tự động enable nếu bạn không khai config.yaml — nhưng bản
  # config-hcm.yaml GỐC của bạn đã có sẵn các plugin này, xác nhận đây
  # là bổ sung THỦ CÔNG từ trước, không phải mặc định của APISIX gốc):
