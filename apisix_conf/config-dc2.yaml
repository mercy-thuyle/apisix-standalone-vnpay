apisix:
  node_listen: 9080
  enable_ipv6: false

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

nginx_config:
  # mỗi worker chạy trên 1 CPU core -> xử lý song song
#  worker_processes: auto
  worker_processes: 2
  worker_cpu_affinity: auto
  # số lượng file descriptor tối đa mà mỗi worker process có thể mở đồng thời
  # Luỹ thừa 2: 2^13=8192, 2^14=16384, 2^15=32768, 2^16=65536
  # rlimit_nofile phải ≥ worker_connections × 2 + overhead (worker_connections × 2 × worker_processes)
  worker_rlimit_nofile: 65536

  event:
    # mỗi container APISIX handle tối đa 16384 concurrent connection
    # tổng concurrent connection mỗi APISIX container = 2 × 16384 = 32768 total/container
    worker_connections: 16384

  http:
    access_log_format: '$remote_addr - $remote_user [$time_local] [DC1] "$request" $status $body_bytes_sent'
    access_log: /usr/local/apisix/logs/access.log
    error_log: /usr/local/apisix/logs/error.log
    error_log_level: warn   # đừng để debug trên prod

#    client_max_body_size: 10m
#    client_max_body_size: 100G #CRITICAL for Cloudian S3 SANDBOX
    client_max_body_size: 0  #  413 Request Entity Too Large ->  0 = unlimited, Ceph/Cloudian tự giới hạn object size

    # Timeouts
#    keepalive_timeout: 650s
    keepalive_timeout: 60
    client_header_timeout: 150s
    client_body_timeout: 100s
    send_timeout: 300s

    # Upstream keepalive settings
#    upstream_keepalive_pool_size: 512
#    upstream_keepalive_idle_timeout: 60

    # Performance
#    sendfile: on
#    tcp_nopush: on
#    server_tokens: off
#    gzip: on

    # Lua shared dict cho prometheus (APISIX dùng riêng)
    # APISIX tự quản lý, không cần khai báo thêm
    lua_shared_dict:
      prometheus-metrics: 15m

  # APISIX forward proxy sẽ buffer request body vào memory/disk nếu không cẩn thận.
  # proxy_request_buffering off đảm bảo APISIX stream thẳng 100GB object lên Cloudian thay vì buffer, tránh OOM.
#  http_configuration_snippet: |
#    proxy_request_buffering off;
#    proxy_buffering off;

plugin_attr:
  prometheus:
    export_addr:
      ip: "0.0.0.0"
      port: 9091
    export_uri: /apisix/prometheus/metrics

    # Tương đương lua_shared_dict prometheus_metrics 10M
    metric_prefix: "apisix_"
    # Labels tương đương {host, status} trong nginx
#    default_buckets:
#      - 0.005
#      - 0.01
#      - 0.025
#      - 0.05
#      - 0.1
#      - 0.25
#      - 0.5
#      - 1
#      - 2.5
#      - 5
#      - 10

# Bật plugin của bạn lên
plugins:
#  - ... (giữ nguyên danh sách plugin mặc định của APISIX)
  - real-ip
  - client-control
  - proxy-control
  - request-id
  - zipkin
  - prometheus
  - ip-restriction
  - ua-restriction
  - referer-restriction
  - cors
  - limit-req
  - limit-count
  - limit-conn
  - key-auth
  - jwt-auth
  - basic-auth
  - openid-connect
  - hmac-auth
  - authz-keycloak
  - proxy-rewrite
  - redirect
  - response-rewrite
  - grpc-transcode
  - fault-injection
  - api-breaker
  - traffic-split
  - request-validation
  - ceph-rados-regex  # Thêm tên plugin của bạn vào cuối danh sách
