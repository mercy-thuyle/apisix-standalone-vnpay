# DC2: S3 HNI only — không có eKYC service
upstreams:
  - id: ceph-rgw-dc2
    type: roundrobin
    nodes:
      - host: 172.25.216.135
        port: 3950
        weight: 1
        priority: 1
      - host: 172.25.216.130
        port: 3950
        weight: 1
        priority: 0
    scheme: http
    checks:
      active:
        type: http
        http_path: /
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3

routes:
  - id: s3-dc2-path
    uri: /*
    host: s3.hni.lab.thuyldx
    upstream_id: ceph-rgw-dc2

  - id: s3-dc2-vhost
    uri: /*
    host: "*.s3.hni.lab.thuyldx"
    upstream_id: ceph-rgw-dc2
#END
