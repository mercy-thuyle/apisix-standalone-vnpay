# DC1: S3 HCM + eKYC service
upstreams:
  - id: ceph-rgw-dc1
    type: roundrobin
    nodes:
      - host: 172.25.216.135
        port: 3950
        weight: 1
        priority: 1
#      - host: 172.25.216.130
#        port: 3950
3        weight: 1
#        priority: 0
    scheme: http
    checks:
      active:
        type: http
        http_path: /
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3

  - id: ekyc-backend-dc1
    type: roundrobin
    nodes:
      - host: 172.25.216.241
        port: 8080
        weight: 1
    scheme: http

routes:
  - id: s3-dc1-path
    uri: /*
    host: s3.hcm.lab.thuyldx
    upstream_id: ceph-rgw-dc1

  - id: s3-dc1-vhost
    uri: /*
    host: "*.s3.hcm.lab.thuyldx"
    upstream_id: ceph-rgw-dc1

  - id: ekyc-dc1
    uri: /ekyc/*
    host: api.dc1.lab.thuyldx
    upstream_id: ekyc-backend-dc1

  - id: dc1-only-service
    uri: /dc1-test
    host: test.dc1.lab
    upstream:
      type: roundrobin
      nodes:
        - host: 172.25.216.135
          port: 3950
          weight: 1
      scheme: http
#END