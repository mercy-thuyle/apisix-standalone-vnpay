apisix:
  node_listen: 9080
  enable_ipv6: false

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

nginx_config:
  # mỗi worker chạy trên 1 CPU core -> xử lý song song
  worker_processes: 2
  # số lượng file descriptor tối đa mà mỗi worker process có thể mở đồng thời, 2^14=16384, 2^15=32768, 2^16=65536. 
  # rlimit_nofile phải ≥ worker_connections × 2 + overhead
  worker_rlimit_nofile: 65536
  event:
    # mỗi container APISIX handle tối đa 16384 concurrent connection
    # tổng concurrent connection mỗi APISIX container = 2 × 16384 = 32768
    worker_connections: 16384

plugin_attr:
  prometheus:
    export_addr:
      ip: "0.0.0.0"
      port: 9091
    export_uri: /apisix/prometheus/metrics

# Bật plugin của bạn lên
plugins:
#  - ... (giữ nguyên danh sách plugin mặc định của APISIX)
  - real-ip
  - client-control
  - proxy-control
  - request-id
  - zipkin
  - prometheus
  - ip-restriction
  - ua-restriction
  - referer-restriction
  - cors
  - limit-req
  - limit-count
  - limit-conn
  - key-auth
  - jwt-auth
  - basic-auth
  - openid-connect
  - hmac-auth
  - authz-keycloak
  - proxy-rewrite
  - redirect
  - response-rewrite
  - grpc-transcode
  - fault-injection
  - api-breaker
  - traffic-split
  - request-validation
  - ceph-rados-regex  # Thêm tên plugin của bạn vào cuối danh sách
