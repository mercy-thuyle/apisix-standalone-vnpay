# configuration file /etc/nginx/conf.d/cmc.sds.infiniband.vn.conf:
upstream hyperstore-cloudian-cmc {
        ip_hash;
        server 172.26.29.231:8443 max_fails=2 fail_timeout=10;
        server 172.26.29.232:8443 max_fails=2 fail_timeout=10;
        server 172.26.29.233:8443 max_fails=2 fail_timeout=10;
}

server {
    listen 443 ssl;
    http2 on;
    server_name cmc.sds.infiniband.vn;
    ssl_certificate /etc/nginx/ssl/sds.infiniband.vn.cert;
    ssl_certificate_key /etc/nginx/ssl/sds.infiniband.vn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        include /etc/nginx/include.d/proxy_options_default.conf;
        access_by_lua_file /etc/nginx/libraries/customize/sites-additional-config/cmc-conf.lua;
        proxy_cookie_flags JSESSIONID nohttponly;
        proxy_pass https://hyperstore-cloudian-cmc;

    }
}
