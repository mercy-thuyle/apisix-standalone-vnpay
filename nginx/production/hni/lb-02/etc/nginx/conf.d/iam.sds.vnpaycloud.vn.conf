# configuration file /etc/nginx/conf.d/iam.sds.vnpaycloud.vn.conf:
upstream hyperstore-cloudian-iam {
        ip_hash;
        server  10.2.58.21:16443 max_fails=2 fail_timeout=5s;
        server  10.2.58.22:16443 max_fails=2 fail_timeout=5s;
        server  10.2.58.23:16443 max_fails=2 fail_timeout=5s;
        server  10.2.58.24:16443 max_fails=2 fail_timeout=5s;
        server  10.2.58.25:16443 max_fails=2 fail_timeout=5s;
        server  10.2.58.26:16443 max_fails=2 fail_timeout=5s;
        server  10.2.58.27:16443 max_fails=2 fail_timeout=5s;
        server  10.2.58.28:16443 max_fails=2 fail_timeout=5s;
        server  10.2.58.29:16443 max_fails=2 fail_timeout=5s;
        keepalive 12;
}

server {
    listen 443 ssl;
    listen 16443 ssl;
    http2 on;
    server_name iam.sds.vnpaycloud.vn sts.sds.vnpaycloud.vn ;
    ssl_certificate /etc/nginx/ssl/sds.vnpaycloud.vn.crt;
    ssl_certificate_key /etc/nginx/ssl/sds.vnpaycloud.vn.key;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;

    location / { 
        include /etc/nginx/include.d/proxy_options_default.conf;
        proxy_pass https://hyperstore-cloudian-iam;
 
    }
}
