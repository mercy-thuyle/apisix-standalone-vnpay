    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name cmc.sds.vnpaycloud.vn;
    ssl_certificate /etc/nginx/ssl/sds.vnpaycloud.vn.crt;
    ssl_certificate_key /etc/nginx/ssl/sds.vnpaycloud.vn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / { 
        include /etc/nginx/include.d/proxy_options_s3.conf;
        proxy_pass https://hyperstore-cloudian-cmc;
 
    }
}
# configuration file /etc/nginx/conf.d/cloudian.metrics.conf:
server {
  listen       9114;
  listen  [::]:9114;
  include include.d/limits.monitor.conf;
  location /metrics {
    content_by_lua_block {
      metric_connections:set(ngx.var.connections_active, {"active"})  
      metric_connections:set(ngx.var.connections_reading, {"reading"})
      metric_connections:set(ngx.var.connections_waiting, {"waiting"})
      metric_connections:set(ngx.var.connections_writing, {"writing"})
      prometheus:collect()
    }
  }
}
# configuration file /etc/nginx/conf.d/cloudian.basic.metrics.conf:
server {
  listen       8080;
  listen  [::]:8080;
  include include.d/limits.monitor.conf;
  location = /basic_status {
    stub_status;
  }
}
