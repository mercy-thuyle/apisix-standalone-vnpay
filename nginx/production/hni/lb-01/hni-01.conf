# configuration file /etc/nginx/conf.d/default.conf:
server {
  listen 80 default_server;
  listen 443 ssl default_server;
  server_name _;

  ssl_certificate /etc/nginx/ssl/s3-hcm.sds.vnpaycloud.vn.crt;
  ssl_certificate_key /etc/nginx/ssl/s3-hcm.sds.vnpaycloud.vn.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  
  location / {
    if ($host ~* "^([a-z0-9-]+\.)?s3-(hcm|hni)\.sds\.(vnpaycloud|infiniband)\.vn$") {
         return 301 https://$host$request_uri;
    } 
    return 404;
  }

}
