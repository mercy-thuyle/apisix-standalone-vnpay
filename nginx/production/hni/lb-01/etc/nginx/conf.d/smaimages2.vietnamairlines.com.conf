# configuration file /etc/nginx/conf.d/smaimages2.vietnamairlines.com.conf:
server {
    listen 443 ssl;
    http2 on;
    server_name smaimages2.vietnamairlines.com;
    ssl_certificate /etc/nginx/ssl/smaimages2.vietnamairlines.com.crt;
    ssl_certificate_key /etc/nginx/ssl/smaimages2.vietnamairlines.com.key; 
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;

    location / { 
        include /etc/nginx/include.d/proxy_options_s3_smaimages2.conf;
        access_by_lua_file /etc/nginx/libraries/customize/sites-additional-config/hyperstore-s3-subdomains.lua;
        proxy_pass https://hyperstore-cloudian-s3-hcm;
 
    }
}

 server {
     listen 80;
     server_name smaimages2.vietnamairlines.com;
     if ($host = smaimages2.vietnamairlines.com) {
         return 301 https://$host$request_uri;
     }
     return 404;
 }
 