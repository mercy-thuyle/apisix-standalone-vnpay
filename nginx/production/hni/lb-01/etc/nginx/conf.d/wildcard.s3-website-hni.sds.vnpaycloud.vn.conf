# configuration file /etc/nginx/conf.d/wildcard.s3-website-hni.sds.vnpaycloud.vn.conf:
server {
    listen 80;
    #listen 443 ssl;
    #http2 on;
    server_name    s3-website-hni.sds.vnpaycloud.vn *.s3-website-hni.sds.vnpaycloud.vn;
    #ssl_certificate /etc/nginx/ssl/s3-hni.sds.vnpaycloud.vn.crt;
    #ssl_certificate_key /etc/nginx/ssl/s3-hni.sds.vnpaycloud.vn.key; 
    #ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;

    location / { 
        include /etc/nginx/include.d/proxy_options_s3.conf;
        access_by_lua_file /etc/nginx/libraries/customize/sites-additional-config/hyperstore-s3-subdomains.lua;
        proxy_pass https://hyperstore-cloudian-s3-hni;
 
    }
}
