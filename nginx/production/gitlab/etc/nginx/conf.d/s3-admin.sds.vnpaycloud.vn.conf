# configuration file /etc/nginx/conf.d/s3-admin.sds.vnpaycloud.vn.conf:
upstream hyperstore-cloudian-admin {
        ip_hash;
        server  10.2.58.21:19443 max_fails=2 fail_timeout=5s;
        server  10.2.58.22:19443 max_fails=2 fail_timeout=5s;
        server  10.2.58.23:19443 max_fails=2 fail_timeout=5s;
        server  10.2.58.24:19443 max_fails=2 fail_timeout=5s;
        server  10.2.58.25:19443 max_fails=2 fail_timeout=5s;
        server  10.2.58.26:19443 max_fails=2 fail_timeout=5s;
        server  10.2.58.27:19443 max_fails=2 fail_timeout=5s;
        server  10.2.58.28:19443 max_fails=2 fail_timeout=5s;
        server  10.2.58.29:19443 max_fails=2 fail_timeout=5s;
}

server {
    listen 19443 ssl;
    http2 on;
    server_name s3-admin.sds.vnpaycloud.vn;
    ssl_certificate /etc/nginx/ssl/sds.vnpaycloud.vn.crt;
    ssl_certificate_key /etc/nginx/ssl/sds.vnpaycloud.vn.key;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;

    location / { 
        include /etc/nginx/include.d/proxy_options_default.conf;
        proxy_pass https://hyperstore-cloudian-admin;
 
    }
}
