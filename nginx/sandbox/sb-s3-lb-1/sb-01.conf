# configuration file /etc/nginx/nginx.conf:

user  nginx;
worker_processes  auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 1024768;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections  8192;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format upstreamlog '[$time_local] $remote_addr - $remote_user - $server_name $host to: $upstream_addr: $request $status upstream_response_time $upstream_response_time msec $msec request_time $request_time '
                            '$body_bytes_sent "$http_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for"';

    # log_format log_req_resp '$remote_addr - $remote_user [$time_local] $server_name $host to: $upstream_addr: '
    #     '"$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" '
    #     '$request_time req_header:"$req_header" resp_header:"$resp_header" '
    #     'req_body:"$request_body" resp_body:"$resp_body"';
    log_format logstash_format escape=json '{ '
        	'"fileset": { '
        		'"module": "nginx", '
        		'"name": "access" '
        	'}, '
        	'"nginx": { '
        		'"access": { '
        			'"remote_ip": "$remote_addr", '
        			'"user_name": "$remote_user", '
        			'"time": "$time_local", '
        			'"method": "$request_method", '
        			'"host": "$host", '
        			'"url": "$request_uri", '
        			'"http_protocol": "$server_protocol", '
        			'"response_code": "$status", '
        			'"referrer": "$http_referer", '
        			'"agent": "$http_user_agent" '
        		'}, '
        		'"request": "$request", '
        		'"connection": "$connection", '
        		'"connection_requests": "$connection_requests", '
        		'"time": { '
        			'"iso8601": "$time_iso8601", '
        			'"msec": "$msec", '
        			'"request": "$request_time" '
        		'}, '
        		'"bytes": { '
        			'"request_length": "$request_length", '
        			'"body_sent": "$body_bytes_sent", '
        			'"sent": "$bytes_sent" '
        		'}, '
        		'"http": { '
        			'"x_forwarded_for": "$http_x_forwarded_for", '
        			'"x_forwarded_proto": "$http_x_forwarded_proto", '
        			'"x_real_ip": "$http_x_real_ip", '
        			'"x_scheme": "$http_x_scheme", '
        			'"userid": "$http_userid", '
        			'"host": "$http_host", '
        			'"username": "$http_username" '
        		'}, '
        		'"upstream": { '
        			'"addr": "$upstream_addr", '
        			'"status": "$upstream_status", '
        			'"response_time": "$upstream_response_time", '
        			'"connect_time": "$upstream_connect_time", '
        			'"header_time": "$upstream_header_time" '
        		'} '
        	'} '
        '}';

    access_log  /var/log/nginx/access.log upstreamlog;
    error_log /var/log/nginx/error.log debug;

    ## Remote log về elasticsearch syslog
    access_log syslog:server=172.25.155.181:5000 logstash_format;
    error_log  syslog:server=172.25.155.181:5001 debug;
    client_max_body_size 100G;
    sendfile        on;
    tcp_nopush     on;

    client_header_timeout 150s;
    client_body_timeout 100s;
    keepalive_timeout  650s;

    server_tokens off;

    gzip on;

    # Compilation of the top cipher suites 2023
    ssl_dhparam "/etc/nginx/include.d/dhparam.pem";
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-CCM:DHE-RSA-AES256-CCM8:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-CCM:DHE-RSA-AES128-CCM8:DHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256;
    ssl_session_tickets off;
    ssl_session_cache shared:SSL:200m;
    ssl_session_timeout 4h;
    # Enable OCSP stapling
    #ssl_stapling on;
    #ssl_stapling_verify on;
    #ssl_trusted_certificate "/etc/nginx/include.d/ssl-bundle.crt";
    #resolver 8.8.8.8 8.8.4.4;

    include /etc/nginx/conf.d/*.conf;

    #metrics config
    lua_shared_dict prometheus_metrics 10M;
    lua_package_path "/etc/nginx/libraries/third-party/nginx-lua-prometheus/?.lua;/usr/local/lib/lua/?.lua;;";

    init_worker_by_lua_block {
    prometheus = require("prometheus").init("prometheus_metrics")

    metric_requests = prometheus:counter(
        "nginx_http_requests_total", "Number of HTTP requests", {"host", "status"})
    metric_latency = prometheus:histogram(
        "nginx_http_request_duration_seconds", "HTTP request latency", {"host"})
    metric_connections = prometheus:gauge(
        "nginx_http_connections", "Number of HTTP connections", {"state"})
    }

    log_by_lua_block {
        metric_requests:inc(1, {ngx.var.server_name, ngx.var.status})
        metric_latency:observe(tonumber(ngx.var.request_time), {ngx.var.server_name})
    }
}
