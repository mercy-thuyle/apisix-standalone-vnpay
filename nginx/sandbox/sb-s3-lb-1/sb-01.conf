# configuration file /etc/nginx/conf.d/default.conf:
server {
  listen 80 default_server;
  listen 443 ssl default_server;
  server_name _;

  ssl_certificate /etc/nginx/ssl/sds.infiniband.vn.cert;
  ssl_certificate_key /etc/nginx/ssl/sds.infiniband.vn.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  access_log    off;
  log_not_found off;

  location / {
    if ($host ~* "^([a-z0-9-]+\.)?s3-(hcm|hni)\.sds\.(vnpaycloud|infiniband)\.vn$") {
         return 301 https://$host$request_uri;
    }
    return 403;
  }

}
# configuration file /etc/nginx/conf.d/cmc.sds.infiniband.vn.conf:
upstream hyperstore-cloudian-cmc {
        ip_hash;
        server 172.26.29.231:8443 max_fails=2 fail_timeout=10;
        server 172.26.29.232:8443 max_fails=2 fail_timeout=10;
        server 172.26.29.233:8443 max_fails=2 fail_timeout=10;
}

server {
    listen 443 ssl;
    http2 on;
    server_name cmc.sds.infiniband.vn;
    ssl_certificate /etc/nginx/ssl/sds.infiniband.vn.cert;
    ssl_certificate_key /etc/nginx/ssl/sds.infiniband.vn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        include /etc/nginx/include.d/proxy_options_default.conf;
        access_by_lua_file /etc/nginx/libraries/customize/sites-additional-config/cmc-conf.lua;
        proxy_cookie_flags JSESSIONID nohttponly;
        proxy_pass https://hyperstore-cloudian-cmc;

    }
}
# configuration file /etc/nginx/conf.d/cloudian.metrics.conf:
server {
  listen       9114;
  listen  [::]:9114;
  access_log    off;
  log_not_found off;

  include include.d/limits.monitor.conf;
  location /metrics {
    content_by_lua_block {
      metric_connections:set(ngx.var.connections_active, {"active"})
      metric_connections:set(ngx.var.connections_reading, {"reading"})
      metric_connections:set(ngx.var.connections_waiting, {"waiting"})
      metric_connections:set(ngx.var.connections_writing, {"writing"})
      prometheus:collect()
    }
  }
  # status page for all the peers:
  location = /healthcheck/status {
      access_log off;
      allow 172.0.0.0/8;
      allow 10.0.0.0/8;
      allow 192.168.0.0/16;
      deny all;

      default_type text/plain;
      content_by_lua_block {
          local hc = require "resty.upstream.healthcheck"
          ngx.say("Nginx Worker PID: ", ngx.worker.pid())
          ngx.print(hc.status_page())
      }
  }

	# status page for all the peers (prometheus format):
  location = /healthcheck/metrics {
      access_log off;
      default_type text/plain;
      content_by_lua_block {
          local hc = require "resty.upstream.healthcheck"
          local st , err = hc.prometheus_status_page()
          if not st then
              ngx.say(err)
              return
          end
          ngx.print(st)
      }
  }
}
