# configuration file /etc/nginx/conf.d/s3-rgwhcm.sds.infiniband.vn.conf:
upstream ceph-rgwhcm {
        server 172.25.155.201:80 max_fails=2 fail_timeout=10;
}
server {
    listen 443 ssl;
    http2 on;
    server_name s3-rgwhcm.sds.infiniband.vn;
    ssl_certificate /etc/nginx/ssl/sds.infiniband.vn.cert;
    ssl_certificate_key /etc/nginx/ssl/sds.infiniband.vn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        include /etc/nginx/include.d/proxy_options_s3.conf;
        #access_by_lua_file /etc/nginx/libraries/customize/sites-additional-config/hyperstore-s3-subdomains.lua;
        proxy_pass http://ceph-rgwhcm;

    }
    # Use rgwadmin interface is forbidden
    location /admin {
       deny all;
       return 403;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name *.s3-rgwhcm.sds.infiniband.vn;
    ssl_certificate /etc/nginx/ssl/s3-rgwhcm.sds.infiniband.vn.cert;
    ssl_certificate_key /etc/nginx/ssl/s3-rgwhcm.sds.infiniband.vn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        include /etc/nginx/include.d/proxy_options_s3.conf;
        #access_by_lua_file /etc/nginx/libraries/customize/sites-additional-config/hyperstore-s3-subdomains.lua;
        proxy_pass http://ceph-rgwhcm;

    }
    # Use rgwadmin interface is forbidden
    location /admin {
       deny all;
       return 403;
    }
}