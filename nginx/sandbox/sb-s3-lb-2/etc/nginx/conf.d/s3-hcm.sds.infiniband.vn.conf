# configuration file /etc/nginx/conf.d/s3-hcm.sds.infiniband.vn.conf:
upstream hyperstore-cloudian-s3-hcm {
        server 172.26.29.231:443 max_fails=2 fail_timeout=10;
        server 172.26.29.232:443 max_fails=2 fail_timeout=10;
        server 172.26.29.233:443 max_fails=2 fail_timeout=10;
        ## This options must the last line
        keepalive 60;
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name    s3-hcm.sds.infiniband.vn;
    ssl_certificate /etc/nginx/ssl/sds.infiniband.vn.cert;
    ssl_certificate_key /etc/nginx/ssl/sds.infiniband.vn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        include /etc/nginx/include.d/proxy_options_s3.conf;

        access_by_lua_file /etc/nginx/libraries/customize/sites-additional-config/hyperstore-s3.lua;

        proxy_pass https://hyperstore-cloudian-s3-hcm;

    }
}
