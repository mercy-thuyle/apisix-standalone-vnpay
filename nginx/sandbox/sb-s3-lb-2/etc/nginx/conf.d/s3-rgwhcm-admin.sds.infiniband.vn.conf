# configuration file /etc/nginx/conf.d/s3-rgwhcm-admin.sds.infiniband.vn.conf:
upstream ceph-rgwhcm-admin {
        server 172.25.155.201:8443 max_fails=2 fail_timeout=10;
}
upstream ceph-rgwhcm-grafana {
        server 172.25.155.201:3000 max_fails=2 fail_timeout=10;
}
server {
    listen 443 ssl;
    http2 on;
    server_name s3-rgwhcm-admin.sds.infiniband.vn;
    ssl_certificate /etc/nginx/ssl/sds.infiniband.vn.cert;
    ssl_certificate_key /etc/nginx/ssl/sds.infiniband.vn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        include /etc/nginx/include.d/proxy_options_s3.conf;
        proxy_pass https://ceph-rgwhcm-admin;

    }
    # Điều hướng /d về grafana
    location /d {
        proxy_pass http://ceph-rgwhcm-grafana;
    }
    # Điều hướng /admin về ceph-rgwhcm
    location /admin {
        proxy_pass https://ceph-rgwhcm;
    }
}