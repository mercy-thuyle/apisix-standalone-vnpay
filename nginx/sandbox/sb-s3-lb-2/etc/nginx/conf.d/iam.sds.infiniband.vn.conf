# configuration file /etc/nginx/conf.d/iam.sds.infiniband.vn.conf:
upstream hyperstore-cloudian-iam {
        ip_hash;
        server 172.26.29.231:16443 max_fails=2 fail_timeout=10;
        server 172.26.29.232:16443 max_fails=2 fail_timeout=10;
        server 172.26.29.233:16443 max_fails=2 fail_timeout=10;
        keepalive 12;
}

server {
    listen 443 ssl;
    listen 16443 ssl;
    http2 on;
    server_name iam.sds.infiniband.vn;
    ssl_certificate /etc/nginx/ssl/sds.infiniband.vn.cert;
    ssl_certificate_key /etc/nginx/ssl/sds.infiniband.vn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        include /etc/nginx/include.d/proxy_options_default.conf;
        proxy_pass https://hyperstore-cloudian-iam;

    }
}