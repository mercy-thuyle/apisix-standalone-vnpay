global
    log stdout format raw local0
    # Số lượng concurrent connection tối đa mà HAProxy chấp nhận tại 1 thời điểm
    # Vượt ngưỡng này thì có thể vào queue, nếu vượt timeout_queue → 503
    maxconn 50000

    # Unix socket
    stats socket /var/run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close
    # Connect = TCP handshake, HAProxy chờ APISIX accept connection tối đa 5s. 
    #Nếu APISIX không respond → 503 → ko retry
    timeout connect 5s
    # Client = User, sau 60s silent, ko có traffic → ko retry, HAProxy sẽ đóng connection
    timeout client  60s
    # Server = APISIX, sau 60s silent, ko có traffic → ko retry, HAProxy sẽ đóng connection
    timeout server  60s
    # Connection fail (timeout connect, refused, reset) → retry thử lại tối đa 3 lần
    retries 3

# Stats dashboard — truy cập http://node-ip:8404/stats
frontend stats
    bind *:8404
    # # Số lượng concurrent connection tối đa mà stats này chấp nhận tại 1 thời điểm
#    maxconn 10000
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node

frontend s3_http
    bind *:6080
    # Số lượng concurrent connection tối đa mà s3_http này chấp nhận tại 1 thời điểm
#    maxconn 10000
    default_backend apisix_pool

frontend s3_https
    bind *:6443
    # Số lượng concurrent connection tối đa mà s3_https này chấp nhận tại 1 thời điểm
#    maxconn 10000
    mode tcp
    default_backend apisix_pool_tls

backend apisix_pool
    balance roundrobin
    option httpchk GET /apisix/status
    # APISIX trả 404 khi không có route match — vẫn là healthy
    http-check expect status 404
    # request ngồi queue tối đa 30s, quá thì 503
    timeout queue 30s
    server apisix-1 apisix-dc1-1:9080 check inter 5s fall 2 rise 2 maxconn 10000
    server apisix-2 apisix-dc1-2:9080 check inter 5s fall 2 rise 2 maxconn 10000

backend apisix_pool_tls
    mode tcp
    balance roundrobin
    server apisix-1 apisix-dc1-1:9443 check inter 5s fall 2 rise 2
    server apisix-2 apisix-dc1-2:9443 check inter 5s fall 2 rise 2