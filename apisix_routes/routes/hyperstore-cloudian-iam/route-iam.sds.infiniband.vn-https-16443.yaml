routes:
  # ── IAM — iam.sds.infiniband.vn  ─────────────────────────────────────
  # → upstream-iam.sds.infiniband.vn
  # NGINX: listen 443 + 16443 → APISIX: 2 route tách port dùng vars server_port
  # Route này = cổng 16443 (IAM service port riêng của Cloudian).
  # ⚠ Port 16443 PHẢI có trong apisix_config/config-${DC_PROFILE}.yaml
  #   → apisix.ssl.listen — thiếu port này thì route đúng vars cũng không
  #   handshake TLS được.
  #
  # → plugin_config: pc-qos-auth (limit-count/api-breaker/soft-limit, SHARED với STS + SQS)
  #
  # ⚠ ĐÃ GỘP từ 2 route cũ (route-iam.sds.infiniband.vn-https,
  #   -https-16443) thành 1 route duy nhất. Lý do gộp — xác nhận tại
  #   nginx-full-config.txt dòng 402-416:
  #     server { listen 443 ssl; listen 16443 ssl; ... proxy_pass https://...; }
  #   Nginx gốc dùng CHUNG 1 server block cho cả 2 port, cùng location, cùng
  #   proxy_pass — port 443 và 16443 hành vi giống hệt nhau, chưa từng phân
  #   biệt. 2 route cũ chỉ khác `vars: server_port`, là bản sao dư thừa.
  #
  # ⚠ KHÔNG khai vars server_port — route match theo host, áp dụng cho request
  #   đến trên bất kỳ port nào APISIX đang listen cho host này (port phải có
  #   sẵn trong apisix.ssl.listen ở config.yaml — 443 VÀ 16443 đều phải khai).
  #   Backend port cố định theo upstream.nodes (:16443), không phụ thuộc route.
  #
  # ⚠ PHƠI INTERNET, pre-GA (traffic thấp nhưng không đồng nghĩa rủi ro thấp
  #   — đây là giai đoạn rẻ nhất để siết trước khi traffic tăng).
  #
  # NGUYÊN TẮC PHÂN TÁCH:
  #   plugin_config_id → QoS TẬP TRUNG (limit-count/IP, api-breaker,
  #                       ip-restriction blacklist, soft-limit pre-GA đã hạ ngưỡng)
  #                       Sửa quota/ngưỡng → chỉnh plugin_configs/pc-qos-auth.yaml
  #                       KHÔNG đặt limit-*/api-breaker ở route này.
  #   plugins (route)   → CHỈ đặc thù riêng route này:
  #                         proxy-rewrite : forward IP thật lên backend IAM
  #
  # ⚠ RULE MERGE: Route > Plugin Config > Service — plugin cùng tên ở route
  #   đè hoàn toàn bản ở plugin_config/service. Route này không khai
  #   serverless-post-function nên không đè logic soft-limit của pc-qos-auth.
  - id: "route-iam.sds.infiniband.vn-https-16443"
    name: "hyperstore-cloudian-iam"
    status: 1
    service_id: "service-upstream-iam"
    # plugin_config_id trỏ đến QoS profile — chứa limit-count/api-breaker/blacklist.
    # Đổi QoS profile → chỉ sửa dòng này, không đụng plugin bên dưới.
    # Các profile có sẵn (xem apisix_routes/services/):
    #   sdk               → S3 SDK/machine traffic, phơi internet, volume cao (4000 req/s)
    #   auth              → IAM/STS/SQS, phơi internet (pre-GA), critical, có circuit breaker + blacklist
    #   internal-console  → CMC/HyperIQ/S3-Admin, INTERNAL ONLY, không whitelist/UA/referer,
    #                              chỉ limit-conn (chống nội bộ tự flood) + blacklist (phản ứng nhanh khi
    #                              1 client nội bộ lỗi/spam — nhanh hơn sửa network ACL)
    #   ops               → Script/batch nội bộ + legacy domain, siết chặt (10 req/s)
    #   ops-offpeak       → Ops off-peak ban đêm 2am-6am, nới rộng (200 req/s)
    plugin_config_id: "plugin-config-qos-auth"
    uri: "/*"
    host: "iam.sds.infiniband.vn"
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
    vars:
      - ["server_port", "==", "16443"]
    plugins:
      # ── Forward IP thật lên backend S3 IAM ─────────────────────────────
      proxy-rewrite:
        headers:
          set:
            X-Real-IP: "$remote_addr"
            X-Forwarded-For: "$remote_addr"
            X-Cluster-Client-Ip: "$remote_addr"
            X-Forwarded-Proto: "$scheme"

      # ── DEBUG TẠM — log request/response body ra file riêng, giống route CMC.
      #    Dùng file-logger (không phải serverless-post-function) để tránh mọi
      #    rủi ro duplicate-key như đã gặp ở route CMC. ─────────────────────
      file-logger:
        path: "/usr/local/apisix/logs/services/iam-https-16443-debug-body.log"
        include_req_body: true
        include_resp_body: true
        log_format:
          time: "$time_iso8601"
          method: "$request_method"
          uri: "$request_uri"
          status: "$status"
          upstream_status: "$upstream_status"
          upstream_addr: "$upstream_addr"
          request_id: "$request_id"

    timeout:
      connect: 30
      send: 600
      read: 300
