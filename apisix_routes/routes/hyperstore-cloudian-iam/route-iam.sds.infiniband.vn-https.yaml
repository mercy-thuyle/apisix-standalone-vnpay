routes:
  # ── IAM — iam.sds.infiniband.vn  ─────────────────────────────────────
  # → upstream-iam.sds.infiniband.vn
  # NGINX: listen 443 + 16443 → APISIX: 2 route tách port dùng vars server_port
  # Route này = cổng 443.
  #
  # ⚠ MỚI GẮN service_id: PHƠI INTERNET, pre-GA (traffic thấp nhưng không có
  #   nghĩa rủi ro thấp — đây chính là giai đoạn rẻ nhất để siết trước khi
  #   traffic tăng). Trước khi route này chưa gắn service_id, KHÔNG có
  #   rate-limit/circuit-breaker/blacklist thật nào chạy dù comment ở
  #   svc-s3-auth.yaml đã liệt kê route này từ đầu — đây là gap đã fix.
  #
  # NGUYÊN TẮC PHÂN TÁCH (quan trọng — đọc trước khi sửa):
  #   service_id  → QoS/rate-limit TẬP TRUNG (limit-count/IP, api-breaker,
  #                 ip-restriction blacklist, soft-limit pre-GA đã hạ ngưỡng)
  #                 Sửa quota/ngưỡng → chỉnh ở services/svc-s3-auth.yaml
  #                 KHÔNG đặt limit-* ở route này.
  #   plugins     → Chỉ plugin ĐẶC THÙ của route này:
  #                   proxy-rewrite : forward IP thật lên backend IAM
  #
  # ⚠ RULE MERGE PLUGIN: plugin CÙNG TÊN ở route ĐÈ HOÀN TOÀN bản ở service.
  #   → Route này không khai serverless-post-function nên không đè logic
  #     soft-limit warning của service.
  - id: "route-iam.sds.infiniband.vn-https"
    name: "hyperstore-cloudian-iam"
    status: 1
    upstream_id: "upstream-iam.sds.infiniband.vn"
    # service_id trỏ đến QoS profile — chứa limit-count/api-breaker/blacklist.
    # Đổi QoS profile → chỉ sửa dòng này, không đụng plugin bên dưới.
    # Các profile có sẵn (xem apisix_routes/services/):
    #   sdk               → S3 SDK/machine traffic, phơi internet, volume cao (4000 req/s)
    #   auth              → IAM/STS/SQS, phơi internet (pre-GA), critical, có circuit breaker + blacklist
    #   internal-console  → CMC/HyperIQ/S3-Admin, INTERNAL ONLY, không whitelist/UA/referer,
    #                              chỉ limit-conn (chống nội bộ tự flood) + blacklist (phản ứng nhanh khi
    #                              1 client nội bộ lỗi/spam — nhanh hơn sửa network ACL)
    #   ops               → Script/batch nội bộ + legacy domain, siết chặt (10 req/s)
    #   ops-offpeak       → Ops off-peak ban đêm 2am-6am, nới rộng (200 req/s)
    service_id: "service-s3-hyperstore-cloudian-auth"
    uri: "/*"
    host: "iam.sds.infiniband.vn"
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
    vars:
      - ["server_port", "==", "443"]

    plugins:
      # ── Forward IP thật lên backend S3 IAM ─────────────────────────────
      proxy-rewrite:
        headers:
          set:
            X-Real-IP: "$remote_addr"
            X-Forwarded-For: "$remote_addr"
            X-Cluster-Client-Ip: "$remote_addr"
            X-Forwarded-Proto: "$scheme"

      # ── DEBUG TẠM — log request/response body ra file riêng, giống route CMC.
      #    Dùng file-logger (không phải serverless-post-function) để tránh mọi
      #    rủi ro duplicate-key như đã gặp ở route CMC. ─────────────────────
      file-logger:
        path: "/usr/local/apisix/logs/services/iam-https-debug-body.log"
        include_req_body: true
        include_resp_body: true
        log_format:
          time: "$time_iso8601"
          method: "$request_method"
          uri: "$request_uri"
          status: "$status"
          upstream_status: "$upstream_status"
          upstream_addr: "$upstream_addr"
          request_id: "$request_id"

    timeout:
      connect: 30
      send: 600
      read: 300
