routes:
  # ── s3-hcm.infiniband.vn — legacy domain (cert infiniband.vn) ────────
  # NGINX: proxy_options_s3, hyperstore-s3-subdomains.lua
  # → upstream-s3-hcm.sds.infiniband.vn    
  - id: "route-s3-hcm.infiniband.vn-http"
    name: "hyperstore-cloudian-legacy-hcm"
    status: 1
    upstream_id: "upstream-s3-hcm.sds.infiniband.vn"
    uri: "/*"
    host: "s3-hcm.infiniband.vn"
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
    vars:
      - ["scheme", "==", "http"]
    plugins:
      proxy-control:
        request_buffering: false
      custom.s3-normalizer-bucket-name:
        path_hosts:
          - "s3-hcm.infiniband.vn"
        vhost_domains:
          - "s3%-hcm%.infiniband%.vn"
      custom.s3-accesskey-extractor:
        set_header: "X-S3-Access-Key"   # header gửi lên upstream + visible trong log
        anonymous_use_ip: true           # request không có auth → fallback ip:<IP>
      prometheus: {}
    timeout:
      connect: 60
      send: 600
      read: 600
