routes:
  # ── S3 Admin — s3-admin.sds.infiniband.vn ─────────────────────────────────────
  # → upstream-s3-admin.sds.infiniband.vn
  # NGINX cũ: listen 443 + 19443 chung 1 vhost → APISIX: TÁCH 2 route dùng
  #   vars server_port vì cần khác timeout/priority tuỳ cổng trong tương lai
  #   (hiện tại config giống nhau, nhưng tách sẵn để dễ mở rộng sau này).
  # Route này = cổng 443 (HTTPS chuẩn). Xem route -19443.yaml cho cổng Admin riêng.
  #
  # ⚠ INTERNAL ONLY — domain này KHÔNG public ra internet, chặn ở network
  #   layer (SG/firewall/VPN-only) TRƯỚC khi request chạm APISIX. Xem chi tiết
  #   nguyên tắc INTERNAL vs EXTERNAL ở route CMC (cùng nhóm profile).
  #
  # NGUYÊN TẮC PHÂN TÁCH (quan trọng — đọc trước khi sửa):
  #   service_id  → QoS/rate-limit TẬP TRUNG (limit-conn, ip-restriction blacklist...)
  #                 Sửa quota/ngưỡng → chỉnh ở services/svc-s3-internal-console.yaml
  #                 KHÔNG đặt limit-* ở route này.
  #   plugins     → Chỉ plugin ĐẶC THÙ của route này:
  #                   proxy-rewrite : forward IP thật lên backend S3 Admin
  #
  # ⚠ RULE MERGE PLUGIN: plugin CÙNG TÊN ở route ĐÈ HOÀN TOÀN bản ở service.
  #   → Route này không khai serverless-post-function nên không có rủi ro
  #     đè logic service.
  - id: "route-s3-admin.sds.infiniband.vn-https"
    name: "hyperstore-cloudian-admin"
    status: 1
    upstream_id: "upstream-s3-admin.sds.infiniband.vn"
    # service_id trỏ đến QoS profile — chứa limit-conn/ip-restriction blacklist.
    # Đổi QoS profile → chỉ sửa dòng này, không đụng plugin bên dưới.
    # Các profile có sẵn (xem apisix_routes/services/):
    #   svc-s3-sdk               → S3 SDK/machine traffic, phơi internet, volume cao (4000 req/s)
    #   svc-s3-auth              → IAM/STS/SQS, phơi internet (pre-GA), critical, có circuit breaker + blacklist
    #   svc-s3-internal-console  → CMC/HyperIQ/S3-Admin, INTERNAL ONLY, không whitelist/UA/referer,
    #                              chỉ limit-conn (chống nội bộ tự flood) + blacklist (phản ứng nhanh khi
    #                              1 client nội bộ lỗi/spam — nhanh hơn sửa network ACL)
    #   svc-s3-ops               → Script/batch nội bộ + legacy domain, siết chặt (10 req/s)
    #   svc-s3-ops-offpeak       → Ops off-peak ban đêm 2am-6am, nới rộng (200 req/s)
    service_id: "svc-s3-internal-console"
    uri: "/*"
    host: "s3-admin.sds.infiniband.vn"
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
    vars:
      - ["server_port", "==", "443"]
    plugins:
      # ── Forward IP thật lên backend S3 Admin ─────────────────────────────
      proxy-rewrite:
        headers:
          set:
            X-Real-IP: "$remote_addr"
            X-Forwarded-For: "$remote_addr"
            X-Cluster-Client-Ip: "$remote_addr"
            X-Forwarded-Proto: "$scheme"

      # ── DEBUG TẠM — trace request vào route này, phục vụ loại trừ khả năng
      #    route S3-Admin cũng góp phần vào lỗi "Internal errors" đang điều tra.
      #    Xoá sau khi điều tra xong (2026-07-08). ──────────────────────────
      serverless-pre-function:
        phase: rewrite
        functions:
          - |
            return function(conf, ctx)
              ngx.log(ngx.WARN, "[DEBUG-S3ADMIN-REQ] remote_addr=", ctx.var.remote_addr,
                " method=", ngx.req.get_method(),
                " uri=", ctx.var.uri,
                " ua=", ngx.req.get_headers()["User-Agent"] or "none")
            end

      # ── DEBUG TẠM — log request/response body ra file riêng, giống route CMC.
      #    Dùng file-logger (không phải serverless-post-function) để tránh mọi
      #    rủi ro duplicate-key như đã gặp ở route CMC. ─────────────────────
      file-logger:
        path: "/usr/local/apisix/logs/routes/s3admin-https-debug-body.log"
        include_req_body: true
        include_resp_body: true
        log_format:
          time: "$time_iso8601"
          method: "$request_method"
          uri: "$request_uri"
          status: "$status"
          upstream_status: "$upstream_status"
          upstream_addr: "$upstream_addr"
          request_id: "$request_id"

    timeout:
      connect: 30
      send: 600
      read: 300
