routes:
  # ── HCM — s3-hcm.sds.infiniband.vn  ─────────────────────────────────────
  # → upstream-s3-hcm.sds.infiniband.vn
  # HTTP → HTTPS redirect (tắt mặc định)
  - id: "route-s3-hcm.sds.infiniband.vn-redirect"
    name: "hyperstore-cloudian-hcm"
    status: 0
    priority: 10
    uri: "/*"
    hosts:
      - "s3-hcm.sds.infiniband.vn"
      - "*.s3-hcm.sds.infiniband.vn"
    vars:
      - ["scheme", "==", "http"]
    plugins:
      redirect:
        http_to_https: true
        ret_code: 301