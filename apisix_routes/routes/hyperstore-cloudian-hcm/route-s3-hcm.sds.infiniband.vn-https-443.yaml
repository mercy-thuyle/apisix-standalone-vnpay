routes:
  # ── HCM — s3-hcm.sds.infiniband.vn  ─────────────────────────────────────
  # → upstream-s3-hcm.sds.infiniband.vn (Cloudian HyperStore HCM)
  # HTTPS proxy (:443)
  #
  # → plugin_config: pc-qos-sdk (limit-conn/limit-count/soft-limit, SHARED với s3-hni + legacy)
  #
  # ⚠ ĐÃ GỘP từ 3 route cũ (route-s3-hcm.sds.infiniband.vn-http-443,
  #   -https-proxy, -redirect) thành 1 route duy nhất. Lý do gộp — xác nhận
  #   tại nginx-full-config.txt dòng 524-541:
  #     server { listen 80; listen 443 ssl; ... proxy_pass https://...; }
  #   Nginx gốc dùng CHUNG 1 server block cho cả 2 port, KHÔNG có `return 301`
  #   nào — http và https luôn được xử lý giống hệt nhau, chưa từng redirect.
  #   → 2 route -http-proxy/-https-proxy trước đây là bản sao dư thừa của
  #     nhau (khác mỗi `vars: scheme`), gộp không mất chức năng.
  #   → Route -redirect (status: 0, chưa từng active) đã XOÁ HẲN — không
  #     mirror hành vi thật nào của nginx, giữ lại dễ gây hiểu nhầm là
  #     "restore lại behavior cũ" trong khi thực ra sẽ là behavior MỚI nếu
  #     bật lên. Muốn enforce HTTPS thật trong tương lai → tạo route mới có
  #     ghi rõ đây là thay đổi so với nginx gốc, không "bật lại" route này.
  #
  # ⚠ KHÔNG khai vars scheme/server_port — route match theo host, áp dụng
  #   cho request đến trên bất kỳ port nào APISIX đang listen cho host này
  #   (port phải có sẵn trong apisix.ssl.listen ở config.yaml). Backend port
  #   luôn cố định theo upstream.nodes (:443), không phụ thuộc route.
  #
  # NGUYÊN TẮC PHÂN TÁCH:
  #   plugin_config_id → QoS TẬP TRUNG (limit-conn/limit-count/soft-limit)
  #                       Sửa quota/ngưỡng → chỉnh plugin_configs/pc-qos-sdk.yaml
  #   plugins (route)   → CHỈ đặc thù riêng route này:
  #                         proxy-control    : tắt buffering cho large object S3
  #                         s3-normalizer    : normalize vhost→path, validate bucket
  #                         s3-accesskey-extractor : trích AKID để làm key rate-limit
  #
  # ⚠ RULE MERGE: Route > Plugin Config > Service — plugin cùng tên ở route đè hoàn toàn bản ở plugin_config/service.
  - id: "route-s3-hcm.sds.infiniband.vn-https-443"
    name: "hyperstore-cloudian-hcm"
    status: 1
    service_id: "service-upstream-s3hcm"
    # plugin_config_id trỏ đến QoS profile — chứa limit-count/limit-conn/api-breaker
    # Đổi QoS profile → chỉ sửa dòng này, không đụng plugin bên dưới.
    # Các profile có sẵn (xem apisix_routes/services/):
    #   sdk               → S3 SDK/machine traffic, phơi internet, volume cao (4000 req/s)
    #   auth              → IAM/STS/SQS, phơi internet (pre-GA), critical, có circuit breaker + blacklist
    #   internal-console  → CMC/HyperIQ/S3-Admin, INTERNAL ONLY, không whitelist/UA/referer,
    #                              chỉ limit-conn (chống nội bộ tự flood) + blacklist (phản ứng nhanh khi
    #                              1 client nội bộ lỗi/spam — nhanh hơn sửa network ACL)
    #   ops               → Script/batch nội bộ + legacy domain, siết chặt (10 req/s)
    #   ops-offpeak       → Ops off-peak ban đêm 2am-6am, nới rộng (200 req/s)
    plugin_config_id: "plugin-config-qos-sdk"
    uri: "/*"
    hosts:
      - "s3-hcm.sds.infiniband.vn"
      - "*.s3-hcm.sds.infiniband.vn"
    # vars:
    #   - ["scheme", "==", "http"]
    #   - ["remote_addr", "!=", "172.26.29.231"]   # chặn HTTP từ ngoài, cho phép HTTP từ chính Cloudian
    plugins:
      # ── Streaming proxy — tắt buffering, stream thẳng lên Cloudian ──────
      # BẮT BUỘC cho large object (5GB). Không có → APISIX buffer vào RAM → OOM.
      proxy-control:
        request_buffering: false

      # ── S3 normalizer — vhost→path rewrite, validate bucket name ─────────
      # Chạy ở priority 10005 (trước limit-count ở access phase).
      # path_hosts : hostname exact match cho path-style request
      # vhost_domains : Lua pattern suffix cho vhost-style (phải escape . và -)
      custom.s3-normalizer-bucket-name:
        path_hosts:
          - "s3-hcm.sds.infiniband.vn"
        vhost_domains:
          - "s3%-hcm%.sds%.infiniband%.vn"

      # ── Bucket → Consumer resolver — CHỈ có tác dụng nếu bucket đã đăng ký
      # thủ công trong consumers.yaml (prefix "bucket-"). Bucket lạ → no-op,
      # fallback policy mặc định ở plugin_config-qos-sdk. Chạy priority 9500,
      # SAU normalizer (10005) — cần ctx.s3_bucket_name đã được set.
      custom.s3-bucket-name-consumer: {}   # marker rỗng, không cần config route-level

      # ── AKID extractor — trích Access Key ID để làm key rate-limit ───────
      # Chạy ở rewrite phase (priority 2510) → trước limit-count (access phase).
      # Hỗ trợ: SigV4 header, SigV2 header, presigned URL (X-Amz-Credential).
      # Anonymous (không có auth) → fallback "ip:<remote_addr>".
      # set_header: gửi X-S3-Access-Key lên upstream (visible trong access log
      #   qua $http_x_s3_access_key — dùng để debug, không ảnh hưởng SigV4).
      custom.s3-accesskey-extractor:
        set_header: "X-S3-Access-Key"   # header gửi lên upstream + visible trong log
        anonymous_use_ip: true           # request không có auth → fallback ip:<IP>

      # ── DEBUG TẠM — log request/response body ra file riêng, giống route CMC.
      #    Dùng file-logger (không phải serverless-post-function) để tránh mọi
      #    rủi ro duplicate-key như đã gặp ở route CMC. ─────────────────────
      file-logger:
        path: "/usr/local/apisix/logs/services/s3-hcm-https-debug-body.log"
        include_req_body: true
        include_resp_body: true
        log_format:
          time: "$time_iso8601"
          method: "$request_method"
          uri: "$request_uri"
          status: "$status"
          upstream_status: "$upstream_status"
          upstream_addr: "$upstream_addr"
          request_id: "$request_id"

    timeout:
      connect: 60
      send: 600
      read: 600
