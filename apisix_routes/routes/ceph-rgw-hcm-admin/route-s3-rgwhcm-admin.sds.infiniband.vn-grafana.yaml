routes:
  # ── Ceph RGW HCM ADMIN ─────────────────────────────────────
  # → s3-rgwhcm-admin.sds.infiniband.vn
  # NGINX: multi-location:
  #   /d*      → grafana   (upstream-grafana-s3-rgwhcm-admin...) HTTP:3000
  #   /admin*  → ceph s3   (upstream-s3-rgwhcm.sds...)           HTTP:80   [FIX v3]
  #   /*       → admin-ui  (upstream-s3-rgwhcm-admin.sds...)     HTTPS:8443
  - id: "route-s3-rgwhcm-admin.sds.infiniband.vn-grafana"
    name: "ceph-rgw-hcm-admin"
    status: 1
    priority: 10
    upstream_id: "upstream-grafana-s3-rgwhcm-admin.sds.infiniband.vn"
    uri: "/d*"
    host: "s3-rgwhcm-admin.sds.infiniband.vn"
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
    priority: 10
    plugins:
      proxy-rewrite:
        headers:
          set:
            X-Real-IP: "$remote_addr"
            X-Forwarded-For: "$remote_addr"
            X-Forwarded-Proto: "$scheme"
      prometheus: {}
    timeout:
      connect: 10
      send: 300
      read: 300
