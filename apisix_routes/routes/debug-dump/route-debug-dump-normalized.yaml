routes:
  - id: "route-debug-dump"
    name: "debug-dump"
    status: 0
    priority: 100
    upstream:
      type: roundrobin
      scheme: http
      pass_host: pass
      nodes:
        "127.0.0.1:9999": 1
    uri: "/*"
    hosts:
      - "s3-hcm.sds.infiniband.vn"
      - "*.s3-hcm.sds.infiniband.vn"
      - "s3-hni.sds.infiniband.vn"
      - "*.s3-hni.sds.infiniband.vn"
    vars:
      - ["http_x_debug", "==", "1"]
    plugins:
      proxy-control:
        request_buffering: false
    timeout:
      connect: 10
      send: 30
      read: 30

  - id: "route-debug-dump-normalized"
    name: "debug-dump"
    status: 1
    priority: 100
    upstream:
      type: roundrobin
      scheme: http
      pass_host: pass
      nodes:
        "127.0.0.1:9999": 1
    uri: "/*"
    hosts:
      - "s3-hcm.sds.infiniband.vn"
      - "*.s3-hcm.sds.infiniband.vn"
      - "s3-hni.sds.infiniband.vn"
      - "*.s3-hni.sds.infiniband.vn"
    vars:
      - ["http_x_debug", "==", "2"]
    plugins:
      proxy-control:
        request_buffering: false
      custom.s3-normalizer-bucket-name:
        path_hosts:
          - "s3-hcm.sds.infiniband.vn"
          - "s3-hni.sds.infiniband.vn"
        vhost_domains:
          - "s3%-hcm%.sds%.infiniband%.vn"
          - "s3%-hni%.sds%.infiniband%.vn"
      custom.s3-accesskey-extractor:
        set_header: "X-S3-Access-Key"
        anonymous_use_ip: true
    timeout:
      connect: 10
      send: 30
      read: 30
