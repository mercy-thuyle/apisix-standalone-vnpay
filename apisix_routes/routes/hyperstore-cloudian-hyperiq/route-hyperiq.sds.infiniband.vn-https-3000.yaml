routes:
  # ── HyperIQ — hyperiq.sds.infiniband.vn ─────────────────────────────────────
  # → upstream-hyperiq.sds.infiniband.vn (Cloudian HyperStore Dashboard Grafana)
  # HTTPS proxy (:443)
  #
  # → plugin_config: pc-qos-internal-console (limit-conn/blacklist/request-id,
  #   SHARED với CMC + S3-Admin)
  #
  # ⚠ KHÔNG GỘP với CMC/S3-Admin — HyperIQ dùng upstream RIÊNG (single node
  #   172.26.29.153:3000, HTTP), khác backend vật lý với CMC/S3-Admin. Chỉ
  #   có 1 port (nginx gốc dòng 379-391: `listen 443 ssl;` duy nhất) nên
  #   không có route port-variant nào để gộp.
  #
  # INTERNAL ONLY — domain KHÔNG public ra internet, chặn ở network layer
  #   (SG/firewall/VPN-only) TRƯỚC khi request chạm APISIX.
  #
  # Route đơn giản nhất trong nhóm internal-console — không có form upload,
  #   không có cookie đặc biệt như CMC, không có port-split như S3-Admin.
  #   Chỉ cần forward IP thật, còn lại toàn bộ QoS lấy từ plugin_config.
  #
  # NGUYÊN TẮC PHÂN TÁCH:
  #   plugin_config_id → QoS TẬP TRUNG — sửa ở plugin_configs/pc-qos-internal-console.yaml
  #   plugins (route)   → CHỈ đặc thù riêng route này:
  #                         proxy-rewrite : forward IP thật lên backend HyperIQ
  - id: "route-hyperiq.sds.infiniband.vn-https-3000"
    name: "hyperstore-cloudian-hyperiq"
    status: 1
    service_id: "service-upstream-hyperiq"
    # plugin_config_id trỏ đến QoS profile — chứa limit-conn/ip-restriction blacklist.
    # Đổi QoS profile → chỉ sửa dòng này, không đụng plugin bên dưới.
    # Các profile có sẵn (xem apisix_routes/services/):
    #   sdk               → S3 SDK/machine traffic, phơi internet, volume cao (4000 req/s)
    #   auth              → IAM/STS/SQS, phơi internet (pre-GA), critical, có circuit breaker + blacklist
    #   internal-console  → CMC/HyperIQ/S3-Admin, INTERNAL ONLY, không whitelist/UA/referer,
    #                              chỉ limit-conn (chống nội bộ tự flood) + blacklist (phản ứng nhanh khi
    #                              1 client nội bộ lỗi/spam — nhanh hơn sửa network ACL)
    #   ops               → Script/batch nội bộ + legacy domain, siết chặt (10 req/s)
    #   ops-offpeak       → Ops off-peak ban đêm 2am-6am, nới rộng (200 req/s)
    plugin_config_id: "plugin-config-qos-internal-console"
    uri: "/*"
    host: "hyperiq.sds.infiniband.vn"
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
    plugins:

      # ── Forward IP thật lên backend HyperIQ (Grafana) ────────────────────
      proxy-rewrite:
        headers:
          set:
            # Host: "$http_host"
            X-Real-IP: "$remote_addr"
            X-Forwarded-For: "$remote_addr"
            X-Cluster-Client-Ip: "$remote_addr"
            X-Forwarded-Proto: "$scheme"

      # ── DEBUG TẠM — log request/response body ra file riêng, giống route CMC.
      #    Dùng file-logger (không phải serverless-post-function) để tránh mọi
      #    rủi ro duplicate-key như đã gặp ở route CMC. ─────────────────────
      file-logger:
        path: "/usr/local/apisix/logs/services/hyperiq-https-debug-body.log"
        include_req_body: true
        include_resp_body: true
        log_format:
          time: "$time_iso8601"
          method: "$request_method"
          uri: "$request_uri"
          status: "$status"
          upstream_status: "$upstream_status"
          upstream_addr: "$upstream_addr"
          request_id: "$request_id"

    timeout:
      connect: 30
      send: 600
      read: 300
