routes:
  # ── MinIO — minio.sds.infiniband.vn  ─────────────────────────────────────
  # → upstream-minio.sds.infiniband.vn
  - id: "route-minio.sds.infiniband.vn-https"
    name: "minio"
    status: 1
    upstream_id: "upstream-minio.sds.infiniband.vn"
    uri: "/*"
    host: "minio.sds.infiniband.vn"
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
    plugins:
      proxy-rewrite:
        headers:
          set:
            X-Real-IP: "$remote_addr"
            X-Forwarded-For: "$remote_addr"
            X-Cluster-Client-Ip: "$remote_addr"
            X-Forwarded-Proto: "$scheme"
      prometheus: {}
    timeout:
      connect: 30
      send: 600
      read: 300
