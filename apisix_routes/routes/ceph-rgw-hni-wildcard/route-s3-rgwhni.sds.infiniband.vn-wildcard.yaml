routes:
  # ── Ceph RGW HNI Wildcard — *.s3-rgwhni.sds.infiniband.vn ────────────
  # → upstream-s3-rgwhni.sds.infiniband.vn 
  - id: "route-s3-rgwhni.sds.infiniband.vn-wildcard"
    name: "ceph-rgw-hni-wildcard"
    status: 1
    priority: 0
    upstream_id: "upstream-s3-rgwhni.sds.infiniband.vn"
    uri: "/*"
    hosts:
      - "*.s3-rgwhni.sds.infiniband.vn"
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
    plugins:
      proxy-rewrite:
        headers:
          set:
            X-Real-IP: "$remote_addr"
            X-Forwarded-For: "$remote_addr"
            X-Forwarded-Proto: "$scheme"
      proxy-control:
        request_buffering: false
      prometheus: {}
    timeout:
      connect: 10
      send: 300
      read: 300
