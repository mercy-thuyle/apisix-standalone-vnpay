routes:
  # ── Ceph RGW HNI Admin — s3-rgwhni-admin.sds.infiniband.vn ─────────────
  # → s3-rgwhni-admin.sds.infiniband.vn
  # NGINX multi-location (cùng cấu trúc HCM):
  #   /d*      → grafana   (upstream-grafana-s3-rgwhni-admin...) HTTP:3000
  #   /admin*  → ceph s3   (upstream-s3-rgwhni.sds...)           HTTP:80
  #   /*       → admin-ui  (upstream-s3-rgwhni-admin.sds...)     HTTPS:8443
  # Dùng priority để APISIX match đúng thứ tự
  - id: "route-s3-rgwhni-admin.sds.infiniband.vn"
    name: "ceph-rgw-hni-admin"
    status: 1
    priority: 10
    upstream_id: "upstream-s3-rgwhni.sds.infiniband.vn"
    uri: "/admin*"
    host: "s3-rgwhni-admin.sds.infiniband.vn"
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
    plugins:
      proxy-rewrite:
        headers:
          set:
            X-Real-IP: "$remote_addr"
            X-Forwarded-For: "$remote_addr"
            X-Forwarded-Proto: "$scheme"
      proxy-control:
        request_buffering: false
      prometheus: {}
    timeout:
      connect: 10
      send: 300
      read: 300