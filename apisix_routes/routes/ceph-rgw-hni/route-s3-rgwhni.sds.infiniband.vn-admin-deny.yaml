routes:
  # ── Ceph RGW HNI S3 — s3-rgwhni.sds.infiniband.vn ────────────────────
  # → upstream-s3-rgwhni.sds.infiniband.vn
  # NGINX: location /admin → deny all, return 403
  #        location /      → proxy_pass http://ceph-rgwhni (:80)
  - id: "route-s3-rgwhni.sds.infiniband.vn-admin-deny"
    name: "ceph-rgw-hni"
    status: 1
    priority: 10
    upstream_id: "upstream-s3-rgwhni.sds.infiniband.vn"
    uri: "/admin*"
    host: "s3-rgwhni.sds.infiniband.vn"
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
    plugins:
      fault-injection:
        abort:
          http_status: 403
          body: "Forbidden"
    timeout:
      connect: 1
      send: 1
      read: 1
