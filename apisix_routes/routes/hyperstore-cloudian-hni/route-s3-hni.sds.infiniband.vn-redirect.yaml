routes:
  # ── HNI — s3-hni.sds.infiniband.vn  ─────────────────────────────────────
  # → upstream-s3-hni.sds.infiniband.vn
  # HTTP → HTTPS redirect
  - id: "route-s3-hni.sds.infiniband.vn-redirect"
    name: "hyperstore-cloudian-hni"
    status: 0
    priority: 10
    uri: "/*"
    hosts:
      - "s3-hni.sds.infiniband.vn"
      - "*.s3-hni.sds.infiniband.vn"
    vars:
      - ["scheme", "==", "http"]
    plugins:
      redirect:
        http_to_https: true
        ret_code: 301