routes:
  # ── Ceph RGW HCM ─────────────────────────────────────
  # → upstream-s3-rgwhcm.sds.infiniband.vn
  # NGINX: location /admin → deny all, return 403
  #        location /      → proxy_pass http://ceph-rgwhcm (:80)
  - id: "route-s3-rgwhcm.sds.infiniband.vn-admin-deny"
    name: "ceph-rgw-hcm"
    status: 1
    priority: 10
    upstream_id: "upstream-s3-rgwhcm.sds.infiniband.vn"      # placeholder, fault-injection không forward
    uri: "/admin*"
    host: "s3-rgwhcm.sds.infiniband.vn"
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
    plugins:
      fault-injection:
        abort:
          http_status: 403
          body: "Forbidden"
    timeout:
      connect: 1
      send: 1
      read: 1
