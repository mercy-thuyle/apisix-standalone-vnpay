routes:
  # ── Ceph RGW HCM ─────────────────────────────────────
  # → upstream-s3-rgwhcm.sds.infiniband.vn
  # NGINX: location /admin → deny all, return 403
  #        location /      → proxy_pass http://ceph-rgwhcm (:80)
  - id: "route-s3-rgwhcm.sds.infiniband.vn"
    name: "ceph-rgw-hcm"
    status: 1
    priority: 0
    upstream_id: "upstream-s3-rgwhcm.sds.infiniband.vn"
    uri: "/*"
    host: "s3-rgwhcm.sds.infiniband.vn"
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
    plugins:
      proxy-rewrite:
        headers:
          set:
            X-Real-IP: "$remote_addr"
            X-Forwarded-For: "$remote_addr"
            X-Forwarded-Proto: "$scheme"
      proxy-control:
        request_buffering: false
      prometheus: {}
    timeout:
      connect: 10
      send: 300
      read: 300
