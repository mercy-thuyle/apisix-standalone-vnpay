routes:
  # ── STS — sts.sds.infiniband.vn ─────────────────────────────────────
  # → upstream-iam.sds.infiniband.vn → reuse upstream IAM
  # NGINX: proxy đến hyperstore-cloudian-iam, listen 443 + 16443
  # Route này = cổng 16443.
  #
  # → service-upstream-iam (STS reuse CHUNG backend vật lý với IAM — không
  #   phải upstream riêng, xác nhận tại nginx-full-config.txt dòng 757:
  #   `proxy_pass https://hyperstore-cloudian-iam;` — STS thật ra chỉ là
  #   route khác của cùng backend Cloudian IAM)
  # → plugin_config: pc-qos-auth (limit-count/api-breaker/soft-limit, SHARED với IAM + SQS)
  #
  # ⚠ ĐÃ GỘP từ 2 route cũ (route-sts.sds.infiniband.vn-https,
  #   -https-16443) thành 1 route duy nhất — cùng lý do IAM: nginx gốc dòng
  #   746-760 dùng CHUNG 1 server block cho port 443 + 16443, không phân biệt.
  #
  # ⚠ KHÔNG khai vars server_port — port phải có sẵn trong apisix.ssl.listen
  #   (config.yaml). Backend port cố định theo upstream.nodes (:16443).
  #
  # ⚠ LƯU Ý QUAN TRỌNG — SHARED CIRCUIT STATE: STS và IAM dùng CHUNG
  #   plugin_config_id (pc-qos-auth) → api-breaker/limit-count CHIA SẺ chung
  #   trạng thái Redis. Nếu IAM backend lỗi mạnh gây circuit mở, STS cũng bị
  #   ảnh hưởng theo (đúng hành vi mong muốn vì cả 2 cùng 1 backend vật lý —
  #   lỗi 1 bên nghĩa là bên kia cũng sẽ lỗi tương tự).
  #
  # NGUYÊN TẮC PHÂN TÁCH:
  #   plugin_config_id → QoS TẬP TRUNG — sửa ở plugin_configs/pc-qos-auth.yaml
  #   plugins (route)   → CHỈ đặc thù riêng route này:
  #                         proxy-rewrite : forward IP thật lên backend IAM (STS dùng chung)
  - id: "route-sts.sds.infiniband.vn-https-16443"
    name: "hyperstore-cloudian-sts"
    status: 1
    service_id: "service-upstream-iam"
    # plugin_config_id trỏ đến QoS profile — chứa limit-count/api-breaker/blacklist.
    # Đổi QoS profile → chỉ sửa dòng này, không đụng plugin bên dưới.
    # Các profile có sẵn (xem apisix_routes/services/):
    #   sdk               → S3 SDK/machine traffic, phơi internet, volume cao (4000 req/s)
    #   auth              → IAM/STS/SQS, phơi internet (pre-GA), critical, có circuit breaker + blacklist
    #   internal-console  → CMC/HyperIQ/S3-Admin, INTERNAL ONLY, không whitelist/UA/referer,
    #                              chỉ limit-conn (chống nội bộ tự flood) + blacklist (phản ứng nhanh khi
    #                              1 client nội bộ lỗi/spam — nhanh hơn sửa network ACL)
    #   ops               → Script/batch nội bộ + legacy domain, siết chặt (10 req/s)
    #   ops-offpeak       → Ops off-peak ban đêm 2am-6am, nới rộng (200 req/s)
    plugin_config_id: "plugin-config-qos-auth"
    uri: "/*"
    host: "sts.sds.infiniband.vn"
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
    vars:
      - ["server_port", "==", "16443"]
    plugins:
      # ── Forward IP thật lên backend S3 IAM ─────────────────────────────
      proxy-rewrite:
        headers:
          set:
            X-Real-IP: "$remote_addr"
            X-Forwarded-For: "$remote_addr"
            X-Cluster-Client-Ip: "$remote_addr"
            X-Forwarded-Proto: "$scheme"

      # ── DEBUG TẠM — log request/response body ra file riêng, giống route CMC.
      #    Dùng file-logger (không phải serverless-post-function) để tránh mọi
      #    rủi ro duplicate-key như đã gặp ở route CMC. ─────────────────────
      file-logger:
        path: "/usr/local/apisix/logs/services/sts-https-16443-debug-body.log"
        include_req_body: true
        include_resp_body: true
        log_format:
          time: "$time_iso8601"
          method: "$request_method"
          uri: "$request_uri"
          status: "$status"
          upstream_status: "$upstream_status"
          upstream_addr: "$upstream_addr"
          request_id: "$request_id"

    timeout:
      connect: 30
      send: 600
      read: 300
