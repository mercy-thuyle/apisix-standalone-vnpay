routes:
  # ── CMC — cmc.sds.infiniband.vn ─────────────────────────────────────
  # → upstream-cmc.sds.infiniband.vn (Cloudian HyperStore CMC Portal Console quản trị)
  # NGINX: proxy_options_default, cmc-conf.lua (JSESSIONID nohttponly)
  #
  # ⚠ INTERNAL ONLY — domain này KHÔNG public ra internet, chặn ở network
  #   layer (SG/firewall/VPN-only) TRƯỚC khi request chạm APISIX. Đã xác nhận
  #   với team network. Vì vậy service_id gắn vào là profile "nhẹ" — không có
  #   ip-restriction whitelist/ua-restriction/referer-restriction/cors như route
  #   S3 SDK/auth (những route đó PHẢI tự vệ vì phơi internet, route này thì
  #   network ACL đã lo phần đó rồi — thêm plugin chặn ở APISIX chỉ là
  #   defense-in-depth thừa, tốn CPU mỗi request và tốn công bảo trì whitelist).
  #
  # NGUYÊN TẮC PHÂN TÁCH (quan trọng — đọc trước khi sửa):
  #   service_id  → QoS/rate-limit TẬP TRUNG (limit-conn, ip-restriction blacklist...)
  #                 Sửa quota/ngưỡng → chỉnh ở services/svc-s3-internal-console.yaml
  #                 KHÔNG đặt limit-* ở route này.
  #   plugins     → Chỉ plugin ĐẶC THÙ của route này:
  #                   client-control          : giới hạn body size cho form/upload CMC UI
  #                   proxy-rewrite           : forward IP thật lên backend Cloudian
  #                   serverless-post-function: strip HttpOnly khỏi JSESSIONID cookie
  #                   custom.cmc-validator-bucket-name : validate tên bucket khi tạo qua UI
  #                 Plugin nào dùng chung nhiều route → đưa vào service.
  #
  # ⚠ RULE MERGE PLUGIN: plugin CÙNG TÊN ở route ĐÈ HOÀN TOÀN bản ở service.
  #   → serverless-post-function ở route này KHÔNG trùng tên với bất kỳ
  #     serverless-post-function nào trong service svc-s3-internal-console
  #     (service chỉ dùng serverless-post-function cho log limit-conn reject,
  #     không xung đột về mặt tên plugin) nên vẫn merge song song bình thường —
  #     nhưng nếu sau này service đổi logic serverless-post-function, PHẢI
  #     merge cả 2 logic (CMC JSESSIONID strip + service logic) vào 1 function
  #     tại đây, vì route sẽ ĐÈ hoàn toàn phần của service.
  - id: "route-cmc.sds.infiniband.vn-https"
    name: "hyperstore-cloudian-cmc"
    status: 1
    upstream_id: "upstream-cmc.sds.infiniband.vn"
    # service_id trỏ đến QoS profile — chứa limit-conn/ip-restriction blacklist.
    # Đổi QoS profile → chỉ sửa dòng này, không đụng plugin bên dưới.
    # Các profile có sẵn (xem apisix_routes/services/):
    #   svc-s3-sdk               → S3 SDK/machine traffic, phơi internet, volume cao (4000 req/s)
    #   svc-s3-auth              → IAM/STS/SQS, phơi internet (pre-GA), critical, có circuit breaker + blacklist
    #   svc-s3-internal-console  → CMC/HyperIQ/S3-Admin, INTERNAL ONLY, không whitelist/UA/referer,
    #                              chỉ limit-conn (chống nội bộ tự flood) + blacklist (phản ứng nhanh khi
    #                              1 client nội bộ lỗi/spam — nhanh hơn sửa network ACL)
    #   svc-s3-ops               → Script/batch nội bộ + legacy domain, siết chặt (10 req/s)
    #   svc-s3-ops-offpeak       → Ops off-peak ban đêm 2am-6am, nới rộng (200 req/s)
    service_id: "svc-s3-internal-console"
    uri: "/*"
    host: "cmc.sds.infiniband.vn"
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
    plugins:

      # ── Body size limit — form/upload qua CMC UI (không phải S3 object) ────
      client-control:
        max_body_size: 10485760   # 10MB = 10 * 1024 * 1024
      
      # ── Forward IP thật lên backend Cloudian CMC ────────────────────────
      proxy-rewrite:
        headers:
          set:
            X-Real-IP: "$remote_addr"
            X-Forwarded-For: "$remote_addr"
            X-Cluster-Client-Ip: "$remote_addr"
            X-Forwarded-Proto: "$scheme"

      # Strip HttpOnly từ JSESSIONID Set-Cookie header
      # ── CMC-specific: strip HttpOnly khỏi JSESSIONID Set-Cookie header ──────
      # (tương đương cmc-conf.lua: proxy_cookie_flags JSESSIONID nohttponly bên NGINX cũ)
      # Đặc thù riêng CMC — KHÔNG đưa lên service vì route khác (HyperIQ/Admin)
      # không có JSESSIONID cookie theo cấu trúc này.
      serverless-post-function:
        phase: header_filter
        functions:
          - |
            return function(conf, ctx)
              local header = ngx.header["Set-Cookie"]
              if not header then return end
              local function strip_httponly(cookie)
                return cookie:gsub(";%s*[Hh]ttp[Oo]nly", "")
              end
              if type(header) == "table" then
                for i, v in ipairs(header) do
                  if v:find("JSESSIONID") then
                    header[i] = strip_httponly(v)
                  end
                end
              elseif type(header) == "string" and header:find("JSESSIONID") then
                ngx.header["Set-Cookie"] = strip_httponly(header)
              end
            end

      serverless-pre-function:
        phase: rewrite
        functions:
          - |
            return function(conf, ctx)
              ngx.log(ngx.WARN, "[DEBUG-CMC-SESSION] remote_addr=", ctx.var.remote_addr,
                " jsessionid=", (ngx.req.get_headers()["Cookie"] or ""):match("JSESSIONID=([%w]+)") or "none",
                " upstream_addr=", ctx.var.upstream_addr or "pending",
                " uri=", ctx.var.uri)
            end

      # ── Validate bucket name khi tạo bucket qua CMC UI ──────────────────
      custom.cmc-validator-bucket-name: {}

    timeout:
      connect: 30
      send: 600
      read: 300
