routes:
  # ── Hyperstore Cloudian S3 HCM ──
  - id: "route-s3-hcm.sds.infiniband.vn-https-443"
    name: "hyperstore-cloudian-hcm"
    status: 1
    service_id: "service-upstream-s3hcm"
    plugin_config_id: "plugin-config-traffic-classifier"
    uri: "/*"
    hosts:
      - "s3-hcm.sds.infiniband.vn"
      - "*.s3-hcm.sds.infiniband.vn"
    # vars:
    #   - ["scheme", "==", "http"]
    #   - ["remote_addr", "!=", "172.26.29.231"]

    plugins:
      proxy-control:
        request_buffering: false

      custom.s3-normalizer-bucket-name:
        path_hosts:
          - "s3-hcm.sds.infiniband.vn"
        vhost_domains:
          - "s3%-hcm%.sds%.infiniband%.vn"

      custom.s3-accesskey-extractor:
        set_header: "X-S3-Access-Key"
        anonymous_use_ip: true

      custom.s3-qos-consumer: {}

      custom.s3-traffic-classifier: {}

      file-logger:
        path: "/usr/local/apisix/logs/services/s3-hcm-https-443.log"
        include_req_body: true
        include_resp_body: true
        log_format:
          time: "$time_iso8601"
          method: "$request_method"
          uri: "$request_uri"
          http_host: "$http_host"
          server_port: "$server_port"
          status: "$status"
          upstream_status: "$upstream_status"
          upstream_addr: "$upstream_addr"
          request_id: "$request_id"
          resp_body: "$resp_body"
          req_body: "$req_body"

    timeout:
      connect: 60
      send: 600
      read: 600
