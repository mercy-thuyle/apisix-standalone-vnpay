routes:
  # ── Hyperstore Cloudian S3 HCM (LEGACY) ──
  - id: "route-s3-hcm.infiniband.vn-https-443"
    name: "hyperstore-cloudian-legacy-hcm"
    status: 1
    service_id: "service-upstream-s3hcm"
    plugin_config_id: "plugin-config-traffic-classifier"
    uri: "/*"
    host: "s3-hcm.infiniband.vn"
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
    # vars:
    #   - ["scheme", "==", "https"]

    plugins:
      proxy-control:
        request_buffering: false

      custom.s3-normalizer-bucket-name:
        path_hosts:
          - "s3-hcm.infiniband.vn"
        vhost_domains:
          - "s3%-hcm%.infiniband%.vn"

      custom.s3-accesskey-extractor:
        set_header: "X-S3-Access-Key"
        anonymous_use_ip: true

      custom.s3-qos-consumer: {}

      custom.s3-traffic-classifier: {}

    timeout:
      connect: 60
      send: 600
      read: 600
