routes:
  # ── Hyperstore Cloudian S3 HNI ──
  - id: "route-s3-hni.sds.infiniband.vn-https-443"
    name: "hyperstore-cloudian-hni"
    status: 1
    service_id: "service-upstream-s3hni"
    plugin_config_id: "plugin-config-traffic-classifier"
    uri: "/*"
    hosts:
      - "s3-hni.sds.infiniband.vn"
      - "*.s3-hni.sds.infiniband.vn"
    # vars:
    #   - ["scheme", "==", "https"]

    plugins:
      proxy-control:
        request_buffering: false

      custom.s3-normalizer-bucket-name:
        path_hosts:
          - "s3-hni.sds.infiniband.vn"
        vhost_domains:
          - "s3%-hni%.sds%.infiniband%.vn"

      custom.s3-accesskey-extractor:
        set_header: "X-S3-Access-Key"
        anonymous_use_ip: true

      custom.s3-bucket-name-consumer: {}

      custom.s3-traffic-classifier: {}

      file-logger:
        path: "/usr/local/apisix/logs/services/s3-hni-https-443.log"
        include_req_body: true
        include_resp_body: true
        log_format:
          time: "$time_iso8601"
          method: "$request_method"
          uri: "$request_uri"
          http_host: "$http_host"
          server_port: "$server_port"
          status: "$status"
          upstream_status: "$upstream_status"
          upstream_addr: "$upstream_addr"
          request_id: "$request_id"
          resp_body: "$resp_body"
          req_body: "$req_body"

    timeout:
      connect: 60
      send: 600
      read: 600
