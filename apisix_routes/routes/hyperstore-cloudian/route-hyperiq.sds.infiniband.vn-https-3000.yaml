routes:
  # ── Hyperstore Cloudian HyperIQ (Grafana/Dashboard) ──
  - id: "route-hyperiq.sds.infiniband.vn-https-3000"
    name: "hyperstore-cloudian-hyperiq"
    status: 1
    service_id: "service-upstream-hyperiq"
    plugin_config_id: "plugin-config-qos-internal-console"
    uri: "/*"
    host: "hyperiq.sds.infiniband.vn"
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]

    plugins:
      proxy-rewrite:
        headers:
          set:
            X-Real-IP: "$remote_addr"
            X-Forwarded-For: "$proxy_add_x_forwarded_for"
            X-Cluster-Client-Ip: "$remote_addr"
            X-Forwarded-Proto: "$scheme"

      file-logger:
        path: "/usr/local/apisix/logs/services/hyperiq-https-3000.log"
        include_req_body: true
        include_resp_body: true
        log_format:
          time: "$time_iso8601"
          method: "$request_method"
          uri: "$request_uri"
          http_host: "$http_host"
          server_port: "$server_port"
          status: "$status"
          upstream_status: "$upstream_status"
          upstream_addr: "$upstream_addr"
          request_id: "$request_id"
          resp_body: "$resp_body"
          req_body: "$req_body"

    timeout:
      connect: 30
      send: 600
      read: 300
