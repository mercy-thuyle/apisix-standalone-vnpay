routes:
  # ── Ceph RGW HCM Wildcard — *.s3-rgwhcm.sds.infiniband.vn ────────────
  # → upstream-s3-rgwhcm.sds.infiniband.vn
  - id: "route-s3-rgwhcm.sds.infiniband.vn-wildcard-admin-deny"
    name: "ceph-rgw-hcm-wildcard"
    status: 1
    priority: 10
    upstream_id: "upstream-s3-rgwhcm.sds.infiniband.vn"
    uri: "/admin*"
    hosts:
      - "*.s3-rgwhcm.sds.infiniband.vn"
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
    plugins:
      fault-injection:
        abort:
          http_status: 403
          body: "Forbidden"
    timeout:
      connect: 1
      send: 1
      read: 1
