consumers:
  # prefix "bucket-" BẮT BUỘC

  - username: bucket-thuyldx-qos-restricted
    plugins:
      custom.s3-qos-consumer: {}

      limit-count:
        rules:
          - key: "${consumer_name}"
            count: 100
            time_window: 60
            header_prefix: "Custom-bucket-thuyldx-qos-restricted"
        rejected_code: 429
        rejected_msg: "[APISIX-QOS:bucket-thuyldx-qos-restricted]: Rate limit exceeded — individual override (100 req/60s)."
        allow_degradation: true
        show_limit_quota_header: true
        policy: local

      response-rewrite:
        headers:
          set:
            X-Debug-Consumer-Resolved: "$consumer_name"
