consumers:
  # prefix "bucket-" BẮT BUỘC

  - username: bucket-thuyldx-qos-group-limit-count-2
    group_id: consumer-group-s3-lockdown
    plugins:
      custom.s3-qos-consumer: {}

      limit-count:
        count: 30
        time_window: 60
        key_type: var
        key: consumer_name
        # group: "consumer-group-lockdown-limit-count"
        rejected_code: 429
        rejected_msg: "[APISIX-QOS:bucket-thuyldx-cloud]: Rate limit exceeded — individual override (30 req/60s)."
        allow_degradation: true
        show_limit_quota_header: true

      response-rewrite:
        headers:
          set:
            X-Debug-Consumer-Resolved: "$consumer_name"
