consumers:
  # prefix "bucket-" BẮT BUỘC

  - username: bucket-thuyldx-qos-redis
    plugins:
      custom.s3-qos-consumer: {}

      response-rewrite:
        headers:
          set:
            X-Debug-Consumer-Resolved: "$consumer_name"

      limit-count:
        rules:
          - key: "${consumer_name}"
            count: 3
            time_window: 60
            header_prefix: "Custom-redis"
        # group: "consumer-group-lockdown-limit-count"
        rejected_code: 429
        rejected_msg: "[APISIX-QOS:redis-test]: Redis policy test — quota 3 req/60s. Key này dùng để xác nhận counter đi qua Redis DB2, không phải node-local."
        allow_degradation: true
        show_limit_quota_header: true
        policy: redis
        redis_host: 127.0.0.1
        redis_port: 6379
        redis_password: "$ENV://REDIS_PASSWORD"
        redis_database: 2
        redis_timeout: 1000
