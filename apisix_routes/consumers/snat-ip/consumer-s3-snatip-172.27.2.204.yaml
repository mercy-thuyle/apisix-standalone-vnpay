consumers:
  # prefix "snatip-" BẮT BUỘC

  - username: snatip-172-27-2-204
    plugins:
      custom.s3-qos-consumer: {}

      response-rewrite:
        headers:
          set:
            X-Debug-Consumer-Resolved: "$consumer_name"

      limit-count:
        rules:
          - key: "${consumer_name}"
            count: 100
            time_window: 60
            header_prefix: "Custom-snatip-172.27.2.204"
        rejected_code: 429
        rejected_msg: "[APISIX-QOS:snatip-172.27.2.204]: Rate limit exceeded — individual override (100 req/60s)."
        allow_degradation: true
        show_limit_quota_header: true
        policy: local