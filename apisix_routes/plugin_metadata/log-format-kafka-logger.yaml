plugin_metadata:
# ── src: plugin_metadata/kafka-logger.yaml
# =====================================================================
#  plugin_metadata — KAFKA-LOGGER log_format (GLOBAL theo plugin, không
#  phải per-route/global_rules — sửa 1 chỗ áp dụng mọi nơi kafka-logger
#  chạy, hiện đang chạy qua global_rules "global-kafka-logger").
#
#  ⚠ FLAT JSON — không dựng được cấu trúc lồng kiểu Filebeat ECS
#  (nginx.access.*, http.*). Field đặt tên tương đương nội dung; nếu
#  Observability cần đúng schema ECS cho dashboard cũ → reshape ở
#  consumer (Vector/Logstash), không phải ở đây.
#
#  meta_format ở global-kafka-logger PHẢI = "default" (đang đúng) để
#  block log_format này có tác dụng — "origin" sẽ bỏ qua toàn bộ.
# =====================================================================
  - id: kafka-logger
    log_format:
      time: "$time_iso8601"
      remote_addr: "$remote_addr"
      remote_user: "$remote_user"
      route_id: "$http_x_route_id"
      service_id: "$http_x_service_id"
      consumer: "$http_x_consumer"
      request_method: "$request_method"
      request_uri: "$request_uri"
      host: "$http_host"
      http_protocol: "$server_protocol"
      status: "$status"
      akid: "$http_x_s3_access_key"
      referrer: "$http_referer"
      ua: "$http_user_agent"
      x_forwarded_for: "$http_x_forwarded_for"
      x_forwarded_proto: "$http_x_forwarded_proto"
      x_real_ip: "$http_x_real_ip"
      upstream_addr: "$upstream_addr"
      upstream_status: "$upstream_status"
      upstream_response_time: "$upstream_response_time"
      upstream_connect_time: "$upstream_connect_time"
      upstream_header_time: "$upstream_header_time"
      rt_limit: "$sent_http_x_ratelimit_limit"
      rt_remaining: "$sent_http_x_ratelimit_remaining"
      rt_warning: "$sent_http_x_ratelimit_warning"
      connection: "$connection"
      connection_requests: "$connection_requests"
      request_length: "$request_length"
      body_bytes_sent: "$body_bytes_sent"
      bytes_sent: "$bytes_sent"
      request_time: "$request_time"
