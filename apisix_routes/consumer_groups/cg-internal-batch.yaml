consumer_groups:
  # -------------------------------------------------------------------
  # Vòng 2.5 — Prioriy 3 |Gói  INTERNAL / BATCH — NỘI BỘ, log, task xóa dữ liệu ("bóp từ đáy")
  #  ⚠ CHỈ cho API control-plane CÓ key-auth. KHÔNG dùng cho S3 data-plane.
  #  Gán consumer vào gói: đặt 'group_id: cg-internal-batch' trong consumers/.
  # -------------------------------------------------------------------
  - id: cg-internal-batch
    plugins:
      # ── limit-req (leaky bucket) — KHÔNG có 4 block REDIS ──────────────────
      #  GHI CHÚ QUAN TRỌNG: limit-req là NODE-LOCAL (shared dict), KHÔNG hỗ trợ
      #  policy redis/redis-cluster như limit-count. Vì vậy gói này KHÔNG có 4
      #  block redis. Chạy N node → rate tính MỖI NODE → đặt rate = (tổng / N).
      #  Muốn quota batch chia sẻ cross-node thì phải đổi sang limit-count (redis).
      limit-req:
        rate: 50
        burst: 20
        key_type: var
        key: consumer_name
        rejected_code: 429
        rejected_msg: "Internal/batch quota exceeded"
        allow_degradation: true     # Redis lỗi → cho qua, KHÔNG 500 cả farm
