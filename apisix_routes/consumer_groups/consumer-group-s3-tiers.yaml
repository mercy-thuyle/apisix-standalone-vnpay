consumer_groups:
  - id: consumer-group-s3-tier4-mission-critical
    plugins:
      limit-count:
        rules:
          - key: "${consumer_name}"
            count: 50
            time_window: 60
            header_prefix: "Tier4"
        rejected_code: 429
        rejected_msg: "[APISIX-QOS:tier4-mission-critical]: Rate limit exceeded (50 req/60s). Check X-Debug-Consumer-Resolved header for the matched identity."
        allow_degradation: true
        show_limit_quota_header: true
        policy: local

      # ip-restriction:
      #   # whitelist: ["10.3.14.41"]
      #   blacklist: ["10.3.14.41"]
      #   message: "[APISIX-QOS:consumer-group-restricted]: Your IP address is not allowed. Đủ rồi, dừng lại đi"

      response-rewrite:
        headers:
          set:
            X-Debug-Consumer-Resolved: "$consumer_name"

