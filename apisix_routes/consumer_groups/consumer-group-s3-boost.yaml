consumer_groups:
  - id: consumer-group-s3-boost
    plugins:
      # limit-conn:
      #   conn: 2
      #   burst: 0
      #   default_conn_delay: 0.1
      #   rejected_code: 429      # APISIX chặn, chưa tới backend
      #   key_type: var
      #   key: consumer_name
      #   rejected_msg: "[APISIX-QOS:consumer-group-restricted]: Rate limit exceeded for this bucket — too many parallel connections to your bucket. Not a Cloudian error — reduce concurrent uploads/downloads."

      limit-count:
        count: 2000
        time_window: 60
        key_type: var
        key: consumer_name
        rejected_code: 429
        rejected_msg: "[APISIX-QOS:boost]: Rate limit exceeded even with boosted quota (2000 req/60s). Contact platform team if this is unexpected."
        allow_degradation: true
        show_limit_quota_header: true

      response-rewrite:
        headers:
          set:
            X-Debug-Consumer-Resolved: "$consumer_name"
