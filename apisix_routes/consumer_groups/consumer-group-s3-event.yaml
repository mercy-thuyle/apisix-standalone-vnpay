consumer_groups:
  - id: consumer-group-s3-event
    plugins:
      # limit-conn:
      #   rules:
      #     - key: "${consumer_name}"
      #       conn: 2
      #       burst: 1
      #   rejected_code: 429
      #   rejected_msg: "[APISIX-QOS:consumer-group-internal]: Rate limit exceeded for this bucket — too many parallel connections to your bucket. Not a Cloudian error — reduce concurrent uploads/downloads."
      #   default_conn_delay: 0.1
      #   only_use_default_delay: true
      #   allow_degradation: true
      #   policy: local

      limit-count:
        rules:
          - key: "${consumer_name}"
            count: 800
            time_window: 60
            header_prefix: "Event"
        rejected_code: 429
        rejected_msg: "[APISIX-QOS:event]: Rate limit exceeded for this scheduled event window."
        allow_degradation: true
        show_limit_quota_header: true
        policy: local

      response-rewrite:
        headers:
          set:
            X-Debug-Consumer-Resolved: "$consumer_name"
