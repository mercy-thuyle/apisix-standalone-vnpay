consumer_groups:
  - id: consumer-group-s3-incident
    plugins:
      # limit-conn:
      #   rules:
      #     - key: "${consumer_name}"
      #       conn: 3
      #       burst: 1
      #   rejected_code: 429
      #   rejected_msg: "[APISIX-QOS:consumer-group-partner]: Rate limit exceeded for this bucket — too many parallel connections to your bucket. Not a Cloudian error — reduce concurrent uploads/downloads."
      #   default_conn_delay: 0.1
      #   only_use_default_delay: true
      #   allow_degradation: true
      #   policy: local

      limit-count:
        rules:
          - key: "${consumer_name}"
            count: 100
            time_window: 1
            header_prefix: "Incident"
        rejected_code: 429
        rejected_msg: "[APISIX-QOS:incident]: Restricted pending incident investigation. Check X-Debug-Consumer-Resolved header for the matched identity."
        allow_degradation: true
        show_limit_quota_header: true
        policy: local

      response-rewrite:
        headers:
          set:
            X-Debug-Consumer-Resolved: "$consumer_name"
