global_rules:
  - id: global-kafka-logger
    plugins:
      kafka-logger:
        brokers:
          - host: "10.72.65.82"
            port: 9094
            sasl_config:
              mechanism: "SCRAM-SHA-512"
              user: "${{KAFKA_SASL_USER}}"
              password: "${{KAFKA_SASL_PASSWORD}}"
          - host: "10.72.65.83"
            port: 9094
            sasl_config:
              mechanism: "SCRAM-SHA-512"
              user: "${{KAFKA_SASL_USER}}"
              password: "${{KAFKA_SASL_PASSWORD}}"
          - host: "10.72.65.84"
            port: 9094
            sasl_config:
              mechanism: "SCRAM-SHA-512"
              user: "${{KAFKA_SASL_USER}}"
              password: "${{KAFKA_SASL_PASSWORD}}"

        kafka_topic: "apisix-gw-logs-${{DC_SITE}}"
        producer_type: async 
        batch_max_size: 1
        include_resp_body: false
        # include_resp_body_expr: []
        timeout: 3
        # key: "$remote_addr"
        ssl: true
        ssl_verify: false
        meta_format: default
        api_version: 3
