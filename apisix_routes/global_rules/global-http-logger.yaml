# =====================================================================
#  global_rules — HTTP LOGGER (áp cho mọi route & service)
#
#  Mục đích: đẩy access log lên bất kỳ HTTP endpoint nào nhận JSON.
#  Generic hơn loki-logger và kafka-logger — dùng khi endpoint đích
#  không phải Loki native hoặc Kafka, mà là:
#    - Elasticsearch (_bulk API)
#    - Custom log receiver / webhook
#    - Logstash HTTP input
#    - Vector HTTP source
#    - Splunk HEC (HTTP Event Collector)
#    - Bất kỳ service nào nhận POST JSON
#
#  Khác với loki-logger:
#    - loki-logger: format payload tự động theo Loki push API spec
#    - http-logger: gửi raw JSON, endpoint tự parse → linh hoạt hơn
#      nhưng phải đảm bảo endpoint hiểu format JSON của APISIX
#
#  ⚠ FILE NÀY ĐANG TẮT — chỉ dùng làm template dự phòng.
#  Hiện tại dùng loki-logger (global-loki-logger.yaml) trực tiếp.
#  Bật file này khi cần đổi sang endpoint khác không phải Loki native.
#
#  Ví dụ use case:
#    - Team Observability dùng Logstash HTTP input thay vì Loki
#    - Cần đẩy log song song sang Elasticsearch để search
#    - Debug: đẩy log về webhook.site để xem raw payload
#
#  KHI CẦN CHỈNH:
#    - Đổi uri thành endpoint thật
#    - Thêm/bớt headers theo yêu cầu endpoint
#    - Đổi auth (Basic/Bearer) theo endpoint
#    - Tắt global-loki-logger.yaml nếu không muốn đẩy 2 nơi cùng lúc
# =====================================================================
# global_rules:
#   - id: global-http-logger
#     # status: 0                               # ← bỏ comment dòng này để TẮT
#     plugins:
#       http-logger:
#         # ── Endpoint ──────────────────────────────────────────────────
#         uri: "https://maas-service-logs.infiniband.vn/loki/api/v1/push"
#         # Ví dụ các endpoint khác:
#         # uri: "http://logstash.infiniband.vn:8080"        # Logstash HTTP input
#         # uri: "https://splunk.infiniband.vn:8088/services/collector" # Splunk HEC
#         # uri: "https://webhook.site/xxx"                  # debug
#         # ── Headers ───────────────────────────────────────────────────
#         headers:
#           Content-Type: "application/json"
#           X-Scope-OrgID: "vnpaycloud"
#         # Auth (uncomment theo endpoint):
#         # headers:
#         #   Authorization: "Bearer <token>"
#         #   X-Splunk-Token: "<hec-token>"     # Splunk HEC
#         #   X-API-Key: "<key>"                # custom receiver
#         # ── Batch ─────────────────────────────────────────────────────
#         batch_max_size: 1000
#         batch_max_age: 5                      # giây
#         # ── Retry ─────────────────────────────────────────────────────
#         max_retry_count: 3
#         retry_delay: 1
#         # ── Connection ────────────────────────────────────────────────
#         timeout: 3000                         # ms
#         ssl_verify: false
#         # ── Concat (gom nhiều log thành 1 request) ────────────────────
#         concat_method: "new_line"             # new_line: nối bằng \n
#                                               # json: wrap thành JSON array
