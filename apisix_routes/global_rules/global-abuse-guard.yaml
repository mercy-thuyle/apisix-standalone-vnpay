global_rules:
  - id: global-abuse-guard
    plugins:
      # limit-conn:
      #   conn: 10000                  # /IP — tune theo benchmark
      #   burst: 5000                  # cho vọt thêm 50 trước khi từ chối
      #   default_conn_delay: 0.1     # giây — delay mỗi conn vượt ngưỡng
      #   key_type: var
      #   key: remote_addr
      #   rejected_code: 429        # KHÔNG để mặc định 503 → 429 cho user/dev rõ
      #   rejected_msg: "[APISIX-QOS:global-guard]: Too many concurrent connections from your IP. Concurrent connection limit exceeded (10000/IP). Not a Cloudian error — this is gateway-level IP throttling."

      serverless-pre-function:
        phase: rewrite
        functions:
          - |
            return function(conf, ctx)
              ngx.req.set_header("X-Route-Id", ctx.matched_route and ctx.matched_route.value.id or "-")
              ngx.req.set_header("X-Service-Id", ctx.matched_route and ctx.matched_route.value.service_id or "-")
              -- consumer_name: giống route_id, KHÔNG phải nginx variable có sẵn ($consumer_name
              -- sẽ làm nginx crash compile y hệt $route_id). Lấy qua ctx.consumer (Lua), set
              -- header để access_log_format đọc qua $http_x_consumer thay vì gọi thẳng biến.
              -- Chỉ có giá trị khi route dùng key-auth/jwt-auth (consumer_groups); S3 SDK ký
              -- SigV4 thì ctx.consumer là nil → fallback "-".
              ngx.req.set_header("X-Consumer", ctx.consumer and ctx.consumer.username or "-")
            end
