ssls:
  # ── Wildcard *.s3-hcm.sds.infiniband.vn ─────────────────────────────
  # Dùng cho: bucket-style virtual hosting HCM
  # Bỏ apex "s3-hcm.sds.infiniband.vn" — apex đã được cover bởi ssl-sds-infiniband-vn (*.sds.infiniband.vn).
  # Cert riêng này chỉ phục vụ bucket-style virtual hosting: *.s3-hcm.sds.infiniband.vn
  - id: "ssl-wildcard.s3.hcm.sds.infiniband.vn"
    status: 1
    snis:
      - "*.s3-hcm.sds.infiniband.vn"
    cert: |
      <PASTE_CONTENT_OF_s3-hcm.sds.infiniband.vn.cert_HERE>
    key: |
      <PASTE_CONTENT_OF_s3-hcm.sds.infiniband.vn.key_HERE>
    ssl_protocols:
      - TLSv1.2
      - TLSv1.3
