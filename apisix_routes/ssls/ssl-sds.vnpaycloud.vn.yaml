ssls:
  - id: "ssl-sds.vnpaycloud.vn"
    status: 1
    snis:
      - "*.sds.vnpaycloud.vn"
      - "sds.vnpaycloud.vn"
    ssl_protocols:
      - TLSv1.2
      - TLSv1.3

    cert: "$secret://vault/vault-provider/app/apisix/certs/sds.vnpaycloud.vn/cert"
    key:  "$secret://vault/vault-provider/app/apisix/certs/sds.vnpaycloud.vn/key"
