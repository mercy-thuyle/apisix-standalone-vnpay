services:
  # ═══════════════════════════════════════════════════════════════════════════
  # svc-s3-internal-console — QoS profile cho console nội bộ (CMC/HyperIQ/S3-Admin)
  # ═══════════════════════════════════════════════════════════════════════════
  #
  #  RỦI RO: THẤP — 3 domain này KHÔNG public ra internet (chặn ở network
  #  layer: SG/firewall/VPN-only). Đã xác nhận với team network trước khi
  #  đơn giản hoá plugin stack so với svc-s3-console cũ.
  #
  #  ÁP CHO ROUTE: cmc.sds.infiniband.vn, hyperiq.sds.infiniband.vn,
  #                s3-admin.sds.infiniband.vn (+ port 19443)
  #
  #  KHÔNG CÒN: ip-restriction whitelist, ua-restriction, referer-restriction,
  #  limit-req, cors — network ACL đã lo phần chặn truy cập trái phép.
  #  Giữ plugin ở APISIX cho việc này là defense-in-depth thừa: tốn CPU mỗi
  #  request, tốn công bảo trì whitelist, và whitelist sai IP tự khoá chính
  #  team vận hành khỏi console quản trị.
  #
  #  GIỮ LẠI:
  #    - limit-conn: KHÔNG chống attacker (không có), mà chống chính hệ thống
  #      NỘI BỘ tự bắn nhầm (script lỗi, job loop, dashboard cache-miss storm).
  #      Vẫn có giá trị thực dù traffic 100% internal.
  #    - blacklist: phản ứng nhanh khi có 1 client nội bộ (host/service lỗi)
  #      spam vào console — thêm 1 IP vào blacklist nhanh hơn nhiều so với
  #      phải sửa lại network ACL / xin duyệt security group.
  #    - prometheus: observability không tốn gì đáng kể, luôn nên có.
  #
  #  ⚠ QUYẾT ĐỊNH: KHÔNG giữ svc-s3-console làm dự phòng cho khả năng public
  #  hoá sau này. Nếu tương lai cần public, phải tạo lại service riêng và có
  #  phê duyệt từ lãnh đạo trước — không tự động bật lại từ file cũ.
  #
  #  KHI CẦN CHỈNH:
  #    - Phát hiện IP nội bộ lỗi spam → thêm vào ip-restriction.blacklist
  #    - Cần nới/siết concurrency → sửa limit-conn.conn
  # ═══════════════════════════════════════════════════════════════════════════
  - id: svc-s3-internal-console
    plugins:
      # ── HARD-LIMIT ONLY — KHÔNG có tầng soft-limit ──────────────────────────
      # Khác với svc-s3-sdk/svc-s3-auth (2 lớp soft→hard), service này CHỦ ĐÍCH
      # không có soft-limit warning. Lý do: soft-limit tồn tại để giao tiếp với
      # client BÊN NGOÀI không kiểm soát được ("bạn sắp chạm limit, tự giảm tốc").
      # Ở đây traffic 100% internal — khi limit-conn kích hoạt, nguyên nhân luôn
      # là job/script nội bộ lỗi cần người can thiệp trực tiếp, không phải actor
      # có thể "tự điều chỉnh" qua warning header. Nên phản ứng đúng là LOG + CHẶN
      # NGAY, không phải cảnh báo dần rồi mới chặn.
      #
      # Nếu sau này thấy limit-conn trigger thường xuyên với traffic hợp lệ
      # (false positive) → đó là tín hiệu cần NÂNG conn/burst, không phải thêm
      # soft-limit — vì bản chất vấn đề là ngưỡng sai, không phải thiếu cảnh báo.
      # ── Concurrency guard — chống chính nội bộ tự flood, KHÔNG phải chống attacker ──
      # NODE-LOCAL, không cần Redis vì mục đích chỉ là chặn runaway job/script nội bộ.
      limit-conn:
        conn: 100
        burst: 50
        default_conn_delay: 0.1
        key_type: var
        key: remote_addr
        rejected_code: 429
        rejected_msg: "Too many concurrent connections to internal console — check for stuck job/script."

      # ── Log tường minh khi limit-conn reject — thay thế vai trò soft-limit ──
      # Không cảnh báo TRƯỚC khi chạm limit (như soft-limit), mà log NGAY THỜI
      # ĐIỂM bị reject — đủ để vận hành trace nhanh IP/job nào đang gây flood
      # nội bộ, không cần chờ pattern lặp lại nhiều lần mới phát hiện.
      serverless-post-function:
        phase: header_filter
        functions:
          - |
            return function(conf, ctx)
              if ngx.status == 429 then
                ngx.log(ngx.WARN,
                  string.format("[internal-console-reject] IP=%s uri=%s status=429 "
                    .. "reason=limit-conn — kiểm tra job/script nội bộ đang chạy trên IP này",
                    ngx.var.remote_addr or "unknown",
                    ngx.var.request_uri or "-"))
              end
            end

      # ── Blacklist — phản ứng nhanh khi phát hiện client nội bộ lỗi/spam ──────
      # Không dùng whitelist (đã có network ACL lo việc đó). Đây là công cụ
      # "cắt nhanh" khi vận hành phát hiện qua log/alert 1 IP nội bộ đang gây
      # vấn đề, không cần chờ sửa network ACL/security group.
      # Thêm IP vào đây → commit → gitsync hot-reload (~60s), không cần restart.
      # QUY TẮC: CHỈ thêm block ip-restriction khi đã có >=1 IP thật cần chặn.
      # Khi cần blacklist 1 IP, uncomment và điền

      # ip-restriction:
      #   blacklist: []   # điền IP nội bộ khi phát hiện qua log [internal-console-reject]
      #   message: "Your IP has been temporarily blocked from internal console — contact platform team"
