upstreams:
  # ── Hyperstore Cloudian S3 HNI ──
  - id: "upstream-s3-hni.sds.vnpaycloud.vn"
    name: "hyperstore-cloudian-hni"
    type: least_conn
    scheme: https
    pass_host: pass
    nodes:
     - host: "10.16.58.21"
       port: 443
       weight: 1
       priority: 10
     - host: "10.16.58.22"
       port: 443
       weight: 1
       priority: 0
     - host: "10.16.58.23"
       port: 443
       weight: 1
       priority: 0
     - host: "10.16.58.24"
       port: 443
       weight: 1
       priority: 0
     - host: "10.16.58.25"
       port: 443
       weight: 1
       priority: 0
     - host: "10.16.58.26"
       port: 443
       weight: 1
       priority: 0
     - host: "10.16.58.27"
       port: 443
       weight: 1
       priority: 0
     - host: "10.16.58.28"
       port: 443
       weight: 1
       priority: 0
     - host: "10.16.58.29"
       port: 443
       weight: 1
       priority: 0
     - host: "10.16.58.30"
       port: 443
       weight: 1
       priority: 0
     - host: "10.16.58.31"
       port: 443
       weight: 1
       priority: 0
     - host: "10.16.58.32"
       port: 443
       weight: 1
       priority: 0
    retries: 11
    # retries: 0
    checks:
      active:
        type: https
        host: "s3-hni.sds.vnpaycloud.vn"
        http_path: "/.healthCheck"
        https_verify_certificate: false
        req_headers:
          - "User-Agent: APISIX-HealthCheck"
        concurrency: 10
        timeout: 2
        healthy:
          http_statuses:
            - 200
            - 302
          interval: 5
          successes: 2
        unhealthy:
          http_statuses:
            - 404
            - 429
            - 500
            - 501
            - 502
            - 503
            - 504
            - 505
          interval: 2
          timeouts: 2
          tcp_failures: 2
          http_failures: 3

      passive:
        type: http
        healthy:
          http_statuses:
          - 200
          - 201
          - 202
          - 203
          - 204
          - 205
          - 206
          - 207
          - 208
          - 226
          - 300
          - 301
          - 302
          - 303
          - 304
          - 305
          - 306
          - 307
          - 308
          successes: 3
        unhealthy:
          http_statuses:
            - 429
            - 500
            - 503
          timeouts: 7
          tcp_failures: 2
          http_failures: 3
          # timeouts: 0
          # tcp_failures: 0
          # http_failures: 0

    timeout:
      connect: 30
      send: 600
      read: 300
