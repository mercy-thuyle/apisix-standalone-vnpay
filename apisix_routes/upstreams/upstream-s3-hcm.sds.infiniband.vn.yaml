upstreams:
  # ── Hyperstore Cloudian S3 HCM ──
  - id: "upstream-s3-hcm.sds.infiniband.vn"
    name: "hyperstore-cloudian-hcm"
    type: roundrobin
    scheme: https
    pass_host: pass
    nodes:
      "172.26.29.231:443": 1
      "172.26.29.232:443": 1
      "172.26.29.233:443": 1
      "172.26.29.234:443": 1
    # retries: 0
    checks:
      active:
        type: https
        http_path: "/.healthCheck"
        host: "s3-hcm.sds.infiniband.vn"
        timeout: 5
        https_verify_certificate: false
        req_headers:
          - "User-Agent: APISIX-HealthCheck"
        healthy:
          interval: 10
          successes: 2
          # http_statuses:
          #   - 403
        unhealthy:
          interval: 5
          http_failures: 3
          tcp_failures: 3
          http_statuses:
            - 404
            - 429
            - 500
            - 501
            - 502
            - 503
            - 504
            - 505
      # passive:
      #   type: http
      #   healthy:
      #     successes: 0
      #   unhealthy:
      #     http_failures: 0
      #     tcp_failures: 0
      #     timeouts: 0

    timeout:
      connect: 30
      send: 600
      read: 300
