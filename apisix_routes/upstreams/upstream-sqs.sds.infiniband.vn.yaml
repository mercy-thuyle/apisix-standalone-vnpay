upstreams:
  # ── Hyperstore Cloudian SQS ──
  - id: "upstream-sqs.sds.infiniband.vn"
    name: "hyperstore-cloudian-sqs"
    type: chash
    hash_on: vars
    key: remote_addr
    scheme: http
    pass_host: pass
    keepalive_pool:
      size: 12
      idle_timeout: 60
      requests: 1000
    nodes:
      - host: "172.26.29.231"
        port: 18090
        weight: 1
        priority: 0
      - host: "172.26.29.232"
        port: 18090
        weight: 1
        priority: 0
      - host: "172.26.29.233"
        port: 18090
        weight: 1
        priority: 0
    retries: 2
    checks:
      active:
        type: http
        host: "sqs.sds.infiniband.vn"
        http_path: "/.healthCheck"
        https_verify_certificate: false
        req_headers:
          - "User-Agent: APISIX-HealthCheck"
        concurrency: 10
        timeout: 2
        healthy:
          http_statuses:
            - 200
            - 302
          interval: 5
          successes: 2
        unhealthy:
          http_statuses:
            - 404
            - 429
            - 500
            - 501
            - 502
            - 503
            - 504
            - 505
          interval: 2
          timeouts: 2
          tcp_failures: 2
          http_failures: 3

      passive:
        type: http
        healthy:
          http_statuses:
          - 200
          - 201
          - 202
          - 203
          - 204
          - 205
          - 206
          - 207
          - 208
          - 226
          - 300
          - 301
          - 302
          - 303
          - 304
          - 305
          - 306
          - 307
          - 308
          successes: 3
        unhealthy:
          http_statuses:
            - 429
            - 500
            - 503
          # timeouts: 7
          # tcp_failures: 2
          # http_failures: 3
          timeouts: 0
          tcp_failures: 0
          http_failures: 0

    timeout:
      connect: 30
      send: 600
      read: 300
