upstreams:
  # ── Hyperstore Cloudian HyperIQ (Grafana/Dashboard) ──
  - id: "upstream-hyperiq.sds.infiniband.vn"
    name: "hyperstore-cloudian-hyperiq"
    type: "roundrobin"
    scheme: "http"
    pass_host: "pass"
    nodes:
      - host: "172.26.29.231"
        port: 3000
        weight: 1
        priority: 0
    # retries: 0
    checks:
      active:
        type: "http"
        host: "hyperiq.sds.infiniband.vn"
        http_path: "/"
        https_verify_certificate: false
        req_headers:
          - "User-Agent: APISIX-HealthCheck"
        concurrency: 10
        timeout: 5
        healthy:
          http_statuses:
            - 200
            - 302
          interval: 10
          successes: 2
        unhealthy:
          http_statuses:
            - 404
            - 429
            - 500
            - 501
            - 502
            - 503
            - 504
            - 505
          interval: 5
          timeouts: 3
          tcp_failures: 2
          http_failures: 5

      # passive:
      #   type: http
      #   healthy:
      #     http_statuses:
      #     - 200
      #     - 201
      #     - 202
      #     - 203
      #     - 204
      #     - 205
      #     - 206
      #     - 207
      #     - 208
      #     - 226
      #     - 300
      #     - 301
      #     - 302
      #     - 303
      #     - 304
      #     - 305
      #     - 306
      #     - 307
      #     - 308
      #     successes: 5
      #   unhealthy:
      #     http_statuses:
      #       - 429
      #       - 500
      #       - 503
      #     timeouts: 7
      #     tcp_failures: 2
      #     http_failures: 5
      #     # timeouts: 0
      #     # tcp_failures: 0
      #     # http_failures: 0

    timeout:
      connect: 30
      send: 600
      read: 300
