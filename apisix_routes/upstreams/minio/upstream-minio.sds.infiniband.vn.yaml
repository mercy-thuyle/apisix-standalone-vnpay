upstreams:
  # ── MinIO ──────────────────────────────────────────────────────────────
  # Backend: HTTP :9000, 4 nodes
  - id: "upstream-minio.sds.infiniband.vn"
    name: "minio"
    type: "roundrobin"
    scheme: "http"
    pass_host: "pass"
    nodes:
      "172.26.29.185:9000": 1
      "172.26.29.158:9000": 1
      "172.26.29.170:9000": 1
      "172.26.29.175:9000": 1
    checks:
      active:
        type: "http"
        http_path: "/minio/health/live"
        host: "minio.sds.infiniband.vn"
        timeout: 5
        req_headers:
          - "User-Agent: APISIX-HealthCheck"
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
          tcp_failures: 3
    timeout:
      connect: 30
      send: 600
      read: 300
