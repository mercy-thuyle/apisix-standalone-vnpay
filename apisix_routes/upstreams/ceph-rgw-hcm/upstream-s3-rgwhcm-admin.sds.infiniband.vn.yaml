upstreams:
  # ── Ceph RGW HCM — Admin UI ─────────────────────────────────────
  # NGINX: s3-rgwhcm-admin.sds / (default) → https://ceph-rgwhcm-admin (:8443)
  - id: "upstream-s3-rgwhcm-admin.sds.infiniband.vn"
    name: "ceph-rgw-hcm"
    type: roundrobin
    scheme: https
    pass_host: pass
    nodes:
      "172.25.155.201:8443": 1
    checks:
      active:
        type: https
        http_path: "/"
        host: "s3-rgwhcm-admin.sds.infiniband.vn"
        timeout: 5
        https_verify_certificate: false
        req_headers:
          - "User-Agent: APISIX-HealthCheck"
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
          tcp_failures: 3
    timeout:
      connect: 30
      send: 600
      read: 300
