# =============================================================================
# .gitlab-ci.yml — CI Pipeline cho apisix-config repo
# Branches: master (base), release/apisix, release/config
# =============================================================================

stages:
  - validate
  - compile
  - dry-run
  - notify

variables:
  APISIX_VERSION: "3.9.0-debian"
  PYTHON_IMAGE: "python:3.11-alpine"
  DC_LIST: "dc1 dc2"   # Mở rộng nếu có thêm DC

# -----------------------------------------------------------------------------
# Templates
# -----------------------------------------------------------------------------

# --- CHỈ chạy khi MR target vào release/routes ---
.only-apisix-branch: &only-apisix
  rules:
    - if: '$CI_COMMIT_BRANCH == "release/apisix"'
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release/apisix"'

# --- CHỈ chạy khi MR target vào release/system ---
.only-config-branch: &only-config
  rules:
    - if: '$CI_COMMIT_BRANCH == "release/config"'
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release/config"'

# --- CHỈ chạy khi MR target vào main ---
.only-master: &only-master
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# -----------------------------------------------------------------------------
# Stage 1: Validate — YAML Syntax Check
# -----------------------------------------------------------------------------
validate:yaml-syntax:
  stage: validate
  image: pipelinecomponents/yamllint:latest
  <<: *only-apisix
  script:
    - echo "=== YAML Syntax Check ==="
    - yamllint -c .yamllint.yml fragments/
  allow_failure: false

validate:yaml-syntax-config:
  stage: validate
  image: pipelinecomponents/yamllint:latest
  <<: *only-config
  script:
    - echo "=== YAML Syntax Check (config branch) ==="
    - yamllint -c .yamllint.yml .
  allow_failure: false

# -----------------------------------------------------------------------------
# Stage 2: Compile — Gộp fragments thành file hoàn chỉnh
# -----------------------------------------------------------------------------
compile:apisix-routes:
  stage: compile
  image: $PYTHON_IMAGE
  <<: *only-apisix
  before_script:
    - pip install pyyaml --quiet
  script:
    - echo "=== Compile fragments ==="
    - |
      for DC in $DC_LIST; do
        echo "--- Compiling for $DC ---"
        python scripts/compile.py \
          --manifest manifest-${DC}.yaml \
          --output dist/apisix-${DC}.yaml \
          --validate
      done
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

compile:config:
  stage: compile
  image: $PYTHON_IMAGE
  <<: *only-config
  before_script:
    - pip install pyyaml --quiet
  script:
    - echo "=== Compile system config ==="
    - |
      for DC in $DC_LIST; do
        echo "--- Compiling config for $DC ---"
        python scripts/compile-config.py \
          --input config-fragments/ \
          --dc ${DC} \
          --output dist/config-${DC}.yaml
      done
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

# -----------------------------------------------------------------------------
# Stage 3: Dry-run — Dùng APISIX container để validate schema Lua
# -----------------------------------------------------------------------------
dry-run:apisix-schema:
  stage: dry-run
  image: apache/apisix:$APISIX_VERSION
  <<: *only-apisix
  needs: ["compile:apisix-routes"]
  script:
    - echo "=== APISIX Lua Schema Dry-run ==="
    - |
      for DC in $DC_LIST; do
        echo "--- Dry-run for $DC ---"

        # Copy compiled apisix.yaml vào vị trí APISIX đọc
        cp dist/apisix-${DC}.yaml /usr/local/apisix/conf/apisix.yaml

        # Cần 1 config.yaml tối thiểu để apisix test chạy được
        cat > /usr/local/apisix/conf/config.yaml << 'EOF'
apisix:
  node_listen: 9080
  enable_admin: false
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml
EOF

        # Chạy apisix test — exit code 1 nếu Lua schema invalid
        apisix test -c /usr/local/apisix/conf/config.yaml \
          && echo "  ✓ $DC schema valid" \
          || { echo "  ✗ $DC schema INVALID"; exit 1; }
      done
  allow_failure: false

dry-run:config-schema:
  stage: dry-run
  image: apache/apisix:$APISIX_VERSION
  <<: *only-config
  needs: ["compile:config"]
  script:
    - echo "=== APISIX Config Dry-run ==="
    - |
      for DC in $DC_LIST; do
        cp dist/config-${DC}.yaml /usr/local/apisix/conf/config.yaml
        apisix test -c /usr/local/apisix/conf/config.yaml \
          && echo "  ✓ config-$DC valid" \
          || { echo "  ✗ config-$DC INVALID"; exit 1; }
      done

# -----------------------------------------------------------------------------
# Stage 4: Notify — Thông báo kết quả lên MR comment
# (Cần GITLAB_TOKEN với quyền api trong CI/CD Variables)
# -----------------------------------------------------------------------------
notify:mr-success:
  stage: notify
  image: curlimages/curl:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
  script:
    - |
      BRANCH="$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      if [ "$BRANCH" = "release/apisix" ]; then
        RELOAD_TYPE="🔄 **Hot-reload** (zero-downtime, ~1s)"
      else
        RELOAD_TYPE="🔁 **Hard-restart** (docker restart apisix-dc1)"
      fi

      curl -s --request POST \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        --header "Content-Type: application/json" \
        --data "{
          \"body\": \"## ✅ CI Pipeline Passed\\n\\n**Branch**: \`$BRANCH\`\\n**Reload type**: $RELOAD_TYPE\\n**Commit**: \`$CI_COMMIT_SHORT_SHA\`\\n\\nSafe to merge.\"
        }" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes"
  allow_failure: true   # Không fail pipeline nếu notify lỗi