services:
  apisix-dc1:
    image: apache/apisix:3.15.0-debian
    container_name: apisix-profile-dc1
    restart: unless-stopped
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - APISIX_PROFILE=dc1
    ports:
      - "6080:9080"
      - "6443:9443"
      - "6091:9091"
    volumes:
#      - ./apisix_conf/dc1:/usr/local/apisix/conf
      - ./apisix_conf/config-dc1.yaml:/usr/local/apisix/conf/config-dc1.yaml:ro
      - ./plugins/ceph-rados-regex.lua:/usr/local/apisix/apisix/plugins/ceph-rados-regex.lua:ro
      - ./apisix_conf/apisix-dc1.yaml:/usr/local/apisix/conf/apisix-dc1.yaml
      - ./logs/apisix:/usr/local/apisix/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "apisix status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  apisix-dc2:
    image: apache/apisix:3.15.0-debian
    container_name: apisix-profile-dc2
    restart: unless-stopped
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - APISIX_PROFILE=dc2
    ports:
      - "7080:9080"
      - "7443:9443"
      - "7091:9091"
    volumes:
#      - ./apisix_conf/dc2:/usr/local/apisix/conf
      - ./apisix_conf/config-dc2.yaml:/usr/local/apisix/conf/config-dc2.yaml:ro
      - ./plugins/ceph-rados-regex.lua:/usr/local/apisix/apisix/plugins/ceph-rados-regex.lua:ro
      - ./apisix_conf/apisix-dc2.yaml:/usr/local/apisix/conf/apisix-dc2.yaml
      - ./logs/apisix:/usr/local/apisix/logs
    ulimits:
      nofile:
        soft: 32768
        hard: 32768
    healthcheck:
      test: ["CMD-SHELL", "apisix status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s