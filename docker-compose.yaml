version: "3.8"
services:

  gitsync:
    image: registry.k8s.io/git-sync/git-sync:v4.2.1
    container_name: gitsync
    restart: unless-stopped
    # user: "0:0"
    user: "65533:65533"
    volumes:
      - type: bind
        source: ./gitsync
        target: /tmp/sync
      - type: bind
        source: ./logs/gitsync
        target: /tmp/logs
      - type: bind
        source: ./secrets/.netrc
        target: /tmp/.netrc
        read_only: true
      # - type: bind
      #   source: ./docker-compose.yaml
      #   target: /tmp/docker-compose.yaml
      - type: bind
        source: ./scripts
        target: /tmp/scripts
      - type: bind
        source: ./plugins
        target: /tmp/plugins
      - type: bind
        source: ./apisix_routes
        target: /tmp/apisix_routes
      - type: bind
        source: ./certs
        target: /tmp/certs
        read_only: true
    environment:
      # GITSYNC_GIT_CONFIG: "credential.helper=store"
      # GITSYNC_SECRET_FILE: "/etc/git-secret/.netrc"
      GITSYNC_V: "6"
      GITSYNC_REPO: "https://git-lab.infiniband.vn/apisix/apisix-standalone.git"
      GITSYNC_REF: "main"
      GITSYNC_ROOT: "/tmp/sync"
      GITSYNC_LINK: "current"
      GITSYNC_PERIOD: "30s"
      GITSYNC_EXECHOOK_TIMEOUT: "10s"
      GITSYNC_EXECHOOK_BACKOFF: "5s"
      GITSYNC_DEPTH: "1"
      GITSYNC_ADD_USER: "true"
      GITSYNC_MAX_FAILURES: "3"
      GITSYNC_EXECHOOK_COMMAND: "/tmp/scripts/runtime/gitsync.sh"
      # GITSYNC_SCOPE_TARGET: "master"
    env_file: .env
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/apisix_routes/apisix-${DC_PROFILE}.yaml"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    network_mode: host
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./logs/redis:/data/logs
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    env_file: .env
    mem_limit: 320m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6379 ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    network_mode: host
    environment:
      REDIS_ADDR: "${REDIS_ADDR}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    network_mode: host
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed 's/$${DC_PROFILE}/${DC_PROFILE}/g' /etc/prometheus/prometheus.yaml \
          > /tmp/prometheus.yaml && \
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yaml \
          --storage.tsdb.retention.time=2h \
          --web.listen-address=127.0.0.1:9099
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  apisix-standalone:
    image: apache/apisix:3.17.0-debian
    container_name: apisix-standalone
    restart: unless-stopped
    depends_on:
      gitsync:
        condition: service_healthy
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - APISIX_PROFILE=${DC_PROFILE}
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN=${VAULT_TOKEN}
    volumes:
      - ./apisix_routes/apisix-${DC_PROFILE}.yaml:/usr/local/apisix/conf/apisix-${DC_PROFILE}.yaml
      - ./apisix_config/config-${DC_PROFILE}.yaml:/usr/local/apisix/conf/config-${DC_PROFILE}.yaml:ro
      - ./certs:/usr/local/apisix/certs:ro
      - ./ngx_tpl.lua:/usr/local/apisix/apisix/cli/ngx_tpl.lua:ro
      - ./init.lua:/usr/local/apisix/apisix/init.lua:ro
      - ./vault.lua:/usr/local/apisix/apisix/secret/vault.lua:ro
      - ./config_yaml.lua:/usr/local/apisix/apisix/core/config_yaml.lua:ro
      - ./kafka-logger.lua:/usr/local/apisix/apisix/plugins/kafka-logger.lua:ro
      - ./plugins/custom:/usr/local/apisix/apisix/plugins/custom:ro
      - ./plugins/libraries:/usr/local/apisix/apisix/plugins/libraries:ro
      - ./logs/apisix:/usr/local/apisix/logs
      - ./certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt
    network_mode: host
    user: "0:0"
    env_file: .env
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "apisix status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  dashboard:
    build: ./dashboard
    image: apisix-standalone/dashboard:3.17.0-debian
    container_name: dashboard
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - DC_PROFILE=${DC_PROFILE}
      - DASHBOARD_PORT=18080
      # - DASHBOARD_RELOAD=true
      - REPO_URL=https://git-lab.infiniband.vn/apisix/apisix-standalone.git
      - REPO_BRANCH=main
      - AUTH_MODE=none
    volumes:
      - ./dashboard/dashboard-workspace:/app/workspace
      # - ./dashboard/backend:/app/backend
      - ./logs/dashboard/backend:/app/logs/backend
      - ./logs/dashboard/frontend:/app/logs/frontend
      - ./secrets/.netrc-dashboard:/app/.netrc:ro
      # - ./secrets/dashboard-users.htpasswd:/app/users.htpasswd:ro
      - ./logs/gitsync:/host-logs/gitsync:ro
      - ./logs/apisix:/host-logs/apisix:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
