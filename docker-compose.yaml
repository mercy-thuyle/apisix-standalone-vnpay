version: "3.8"
services:

  gitsync:
    image: registry-hcm.vnpaycloud.vn/apisix/registry.k8s.io-git-sync:v4.2.1
    container_name: gitsync
    restart: unless-stopped
    depends_on:
      vnpay-adc:
        condition: service_healthy
    # user: "0:0"
    user: "65533:65533"
    volumes:
      - type: bind
        source: ./gitsync
        target: /tmp/sync
      - type: bind
        source: ./logs/gitsync
        target: /tmp/logs
      - type: bind
        source: ./secrets/.netrc
        target: /tmp/.netrc
        read_only: true
      # - type: bind
      #   source: ./docker-compose.yaml
      #   target: /tmp/docker-compose.yaml
      - type: bind
        source: ./scripts
        target: /tmp/scripts
      - type: bind
        source: ./plugins
        target: /tmp/plugins
      - type: bind
        source: ./apisix_routes
        target: /tmp/apisix_routes
      - type: bind
        source: ./certs
        target: /tmp/certs
        read_only: true
      - type: bind
        source: ./adc
        target: /tmp/adc
    environment:
      APISIX_PROFILE: ${PROJECT}-${DC_SITE}
      # GITSYNC_GIT_CONFIG: "credential.helper=store"
      # GITSYNC_SECRET_FILE: "/etc/git-secret/.netrc"
      GITSYNC_V: "6"
      GITSYNC_REPO: "https://gitlab.vnpaycloud.vn/cloudteam/internal-gw-apisix/apisix-standalone.git"
      GITSYNC_REF: "main"
      GITSYNC_ROOT: "/tmp/sync"
      GITSYNC_LINK: "current"
      GITSYNC_PERIOD: "30s"
      # ADC có thể boot APISIX dry-run; hook phải dài hơn ADC_TIMEOUT (90s). GITSYNC_EXECHOOK_TIMEOUT cũ = 10s
      GITSYNC_EXECHOOK_TIMEOUT: "120s"
      GITSYNC_EXECHOOK_BACKOFF: "5s"
      GITSYNC_DEPTH: "1"
      GITSYNC_ADD_USER: "true"
      GITSYNC_MAX_FAILURES: "3"
      GITSYNC_EXECHOOK_COMMAND: "/tmp/scripts/runtime/gitsync.sh"
      # GITSYNC_SCOPE_TARGET: "master"
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/apisix_routes/apisix-$${APISIX_PROFILE}.yaml"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  vnpay-adc:
    image: registry-hcm.vnpaycloud.vn/apisix/apache-apisix:3.17.0-debian
    container_name: vnpay-adc
    restart: unless-stopped
    network_mode: none
    user: "0:0"
    environment:
      - PROJECT=${PROJECT}
      - DC_SITE=${DC_SITE}
      - APISIX_PROFILE=${PROJECT}-${DC_SITE}
      - VAULT_ADDR=http://127.0.0.1:8200
      # Chỉ để APISIX render biến môi trường khi dry-run; không phải secret thật.
      - VAULT_TOKEN=adc-dry-run-not-a-secret
      - KAFKA_SASL_USER=adc-dry-run
      - KAFKA_SASL_PASSWORD=adc-dry-run-not-a-secret
    volumes:
      - ./gitsync:/tmp/sync:ro
      - ./adc:/tmp/adc
      - ./logs/adc:/tmp/logs/adc
      - ./vault.lua:/tmp/adc-patches/vault.lua:ro
      - ./config_yaml.lua:/tmp/adc-patches/config_yaml.lua:ro
      - ./kafka-logger.lua:/tmp/adc-patches/kafka-logger.lua:ro
      - ./scripts/runtime/adc.sh:/usr/local/bin/vnpay-adc:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/vnpay-adc"]
    healthcheck:
      # Không chỉ kiểm tra mount tồn tại; controller phải cập nhật heartbeat.
      test: ["CMD-SHELL", "test -f /tmp/adc/heartbeat-$${DC_SITE} && test $$(( $$(date +%s) - $$(cat /tmp/adc/heartbeat-$${DC_SITE}) )) -le 120"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: registry-hcm.vnpaycloud.vn/apisix/redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    network_mode: host
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./logs/redis:/data/logs
    environment:
      - APISIX_PROFILE=${PROJECT}-${DC_SITE}
      - TZ=Asia/Ho_Chi_Minh
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    env_file: .env
    mem_limit: 320m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6379 ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  redis-exporter:
    image: registry-hcm.vnpaycloud.vn/apisix/oliver006-redis_exporter:v1.86.0
    container_name: redis-exporter
    network_mode: host
    environment:
      REDIS_ADDR: "${REDIS_ADDR}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    env_file: .env
    restart: unless-stopped

  prometheus:
    image: registry-hcm.vnpaycloud.vn/apisix/prom-prometheus:v3.13.0
    container_name: prometheus
    network_mode: host
    restart: unless-stopped
    environment:
      APISIX_PROFILE: ${PROJECT}-${DC_SITE}
    env_file: .env
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed 's/$${DC_SITE}/${DC_SITE}/g' /etc/prometheus/prometheus.yaml \
          > /tmp/prometheus.yaml && \
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yaml \
          --storage.tsdb.retention.time=2h \
          --web.listen-address=127.0.0.1:9099
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  apisix-standalone:
    image: registry-hcm.vnpaycloud.vn/apisix/apache-apisix:3.17.0-debian
    container_name: apisix-standalone
    restart: unless-stopped
    depends_on:
      gitsync:
        condition: service_healthy
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - NODE_ID=apisix-standalone-${PROJECT}-${DC_SITE}-${ORDER_NUM}
      - APISIX_PROFILE=${APISIX_PROFILE}
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN=${VAULT_TOKEN}
    volumes:
      - ./apisix_routes/apisix-${PROJECT}-${DC_SITE}.yaml:/usr/local/apisix/conf/apisix-${PROJECT}-${DC_SITE}.yaml
      - ./apisix_config/config-internal.yaml:/usr/local/apisix/conf/config-${PROJECT}-${DC_SITE}.yaml:ro
      - ./certs:/usr/local/apisix/certs:ro
      - ./ngx_tpl.lua:/usr/local/apisix/apisix/cli/ngx_tpl.lua:ro
      - ./init.lua:/usr/local/apisix/apisix/init.lua:ro
      - ./vault.lua:/usr/local/apisix/apisix/secret/vault.lua:ro
      - ./config_yaml.lua:/usr/local/apisix/apisix/core/config_yaml.lua:ro
      - ./kafka-logger.lua:/usr/local/apisix/apisix/plugins/kafka-logger.lua:ro
      - ./plugins/custom:/usr/local/apisix/apisix/plugins/custom:ro
      - ./plugins/libraries:/usr/local/apisix/apisix/plugins/libraries:ro
      - ./logs/apisix:/usr/local/apisix/logs
      - ./certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt
    network_mode: host
    user: "0:0"
    env_file: .env
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "apisix status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
