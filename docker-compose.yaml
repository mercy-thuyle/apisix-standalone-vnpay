# /opt/apisix/standalone/sandbox/docker-compose.yaml
version: "3.8"
services:

  gitsync:
    image: registry.k8s.io/git-sync/git-sync:v4.2.1
    container_name: gitsync
    restart: unless-stopped
    user: "65533:65533"
    volumes:
      - type: bind
        source: ./conf_routes
        target: /tmp/sync
      - type: bind
        source: ./secrets/.netrc
        target: /tmp/.netrc
        read_only: true
      - type: bind
        source: ./scripts/gitsync.sh
        target: /tmp/gitsync.sh
      # - type: bind
      #   source: ./docker-compose.yaml
      #   target: /tmp/docker-compose.yaml
      - type: bind
        source: ./scripts
        target: /tmp/scripts
    environment:
#      GITSYNC_GIT_CONFIG: "credential.helper=store"
#      GITSYNC_SECRET_FILE: "/etc/git-secret/.netrc"
      GITSYNC_REPO: "https://git-lab.infiniband.vn/apisix/apisix-standalone.git"
      GITSYNC_REF: "main"
      GITSYNC_ROOT: "/tmp/sync"
      GITSYNC_LINK: "current"
      GITSYNC_PERIOD: "30s"
      GITSYNC_DEPTH: "1"
      GITSYNC_ADD_USER: "true"
      GITSYNC_MAX_FAILURES: "3"
      GITSYNC_EXECHOOK_COMMAND: "/tmp/gitsync.sh"
      GITSYNC_EXECHOOK_TIMEOUT: "10s"
      GITSYNC_EXECHOOK_BACKOFF: "5s"
#      GITSYNC_SCOPE_TARGET: "master"
    env_file: .env
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/sync/apisix_routes/apisix-${DC_PROFILE}.yaml"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  apisix-standalone:
#  apisix-1:
    image: apache/apisix:3.15.0-debian
#    container_name: apisix-${DC_PROFILE}-1
    container_name: apisix-standalone
    restart: unless-stopped
    depends_on:
      gitsync:
        condition: service_healthy
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - APISIX_PROFILE=${DC_PROFILE}
    volumes:
      - ./conf_routes/apisix_routes/apisix-${DC_PROFILE}.yaml:/usr/local/apisix/conf/apisix-${DC_PROFILE}.yaml
      - ./apisix_config/config-${DC_PROFILE}.yaml:/usr/local/apisix/conf/config-${DC_PROFILE}.yaml:ro
#      - ./plugins/ceph-rados-regex.lua:/usr/local/apisix/apisix/plugins/ceph-rados-regex.lua:ro
      - ./plugins:/usr/local/apisix/apisix/plugins/custom:ro     # Custom plugins — mount thẳng vào plugins/custom dir, các plugin sau này sẽ có prefix custom.<plugin-name>
#      - ./logs/apisix-${DC_PROFILE}-1:/usr/local/apisix/logs
      - ./logs/apisix-${DC_PROFILE}:/usr/local/apisix/logs
# Comment port và uncomment expose để sử dụng NGINX hoặc HAProxy để dứng ở L4 round-robin đến các container apisix
    ports:
     - "9080:9080"
     - "9443:9443"
     - "9091:9091" # metric export
#     expose:
#       - "9080"
#       - "9443"
#       - "9091"
    env_file: .env
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "apisix status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

