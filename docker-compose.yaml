# /opt/apisix/standalone/sandbox/docker-compose.yaml
version: "3.8"
services:

  gitsync:
    image: registry.k8s.io/git-sync/git-sync:v4.2.1
    container_name: gitsync
    restart: unless-stopped
    # user: "0:0"    # root trong container
    user: "65533:65533"
    volumes:
      - type: bind
        source: ./gitsync
        target: /tmp/sync
      - type: bind
        source: ./secrets/.netrc
        target: /tmp/.netrc
        read_only: true
      # - type: bind
      #   source: ./docker-compose.yaml
      #   target: /tmp/docker-compose.yaml
      - type: bind
        source: ./scripts
        target: /tmp/scripts
      - type: bind
        source: ./plugins
        target: /tmp/plugins
      - type: bind
        source: ./apisix_routes
        target: /tmp/apisix_routes
      # Bỏ mount này khi chuyển sang Vault
      # - type: bind
      #   source: ./certs
      #   target: /tmp/certs
      #   read_only: true
    environment:
#      GITSYNC_GIT_CONFIG: "credential.helper=store"
#      GITSYNC_SECRET_FILE: "/etc/git-secret/.netrc"
      GITSYNC_V: "6"             # ← verbose level, show exechook stdout
      GITSYNC_REPO: "https://git-lab.infiniband.vn/apisix/apisix-standalone.git"
      GITSYNC_REF: "main"
      GITSYNC_ROOT: "/tmp/sync"
      GITSYNC_LINK: "current"
      GITSYNC_PERIOD: "30s"
      GITSYNC_DEPTH: "1"
      GITSYNC_ADD_USER: "true"
      GITSYNC_MAX_FAILURES: "3"
      GITSYNC_EXECHOOK_COMMAND: "/tmp/scripts/runtime/gitsync.sh"
      GITSYNC_EXECHOOK_TIMEOUT: "10s"
      GITSYNC_EXECHOOK_BACKOFF: "5s"
#      GITSYNC_SCOPE_TARGET: "master"
    env_file: .env
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/apisix_routes/apisix-${DC_PROFILE}.yaml"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    # apisix-standalone chạy network_mode host → kết nối được 127.0.0.1:6379.
    # Redis cũng host-net + bind 127.0.0.1 (trong redis.conf) → chỉ nghe loopback.
    network_mode: host
    # Password KHÔNG nằm trong redis.conf (file commit). Inject qua CLI arg từ .env.
    # CLI arg ghi đè giá trị trong conf → secret chỉ tồn tại ở .env (gitignored).
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    environment:
      - TZ=Asia/Ho_Chi_Minh
      # REDISCLI_AUTH để healthcheck/redis-cli tự auth, không cần truyền -a (tránh warning)
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    env_file: .env
    mem_limit: 320m           # trần RAM container = maxmemory (256m) + overhead
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6379 ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  apisix-standalone:
#  apisix-1:
    # lấy tên image này để chạy script patch-template-lua.sh mỗi lần muốn cặp nhật cert, run only 1 time
    image: apache/apisix:3.15.0-debian
    container_name: apisix-standalone
    restart: unless-stopped
    depends_on:
      gitsync:
        condition: service_healthy
#      redis:                          # redis: KHÔNG depends — allow_degradation:true xử lý rồi, thêm vào chỉ tạo single point of failure không cần thiết
#        condition: service_started    # CHỈ đợi redis start, KHÔNG đợi healthy 
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - APISIX_PROFILE=${DC_PROFILE}
      # - APISIX_STAND_ALONE=true
      # ── VAULT INTEGRATION (uncomment khi có thông tin Vault) ────────
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN=${VAULT_TOKEN}
      # ────────────────────────────────────────────────────────────────
    volumes:
      - ./apisix_routes/apisix-${DC_PROFILE}.yaml:/usr/local/apisix/conf/apisix-${DC_PROFILE}.yaml
      - ./apisix_config/config-${DC_PROFILE}.yaml:/usr/local/apisix/conf/config-${DC_PROFILE}.yaml:ro
      - ./certs:/usr/local/apisix/certs:ro                                  # Dùng cho fallback khi vault lỗi
      - ./ngx_tpl.lua:/usr/local/apisix/apisix/cli/ngx_tpl.lua:ro
      - ./init.lua:/usr/local/apisix/apisix/init.lua:ro
#      - ./plugins/ceph-rados-regex.lua:/usr/local/apisix/apisix/plugins/ceph-rados-regex.lua:ro
      - ./plugins/custom:/usr/local/apisix/apisix/plugins/custom:ro           # Custom APISIX Lua plugins — mount thẳng vào plugins/custom dir, các plugin sau này sẽ có prefix custom.<plugin-name>
      - ./plugins/libraries:/usr/local/apisix/apisix/plugins/libraries:ro     # Pure Lua (utility module) shared plugins library — mount thẳng vào plugins/libraries dir, sủ dụng trong các APISIX Lua plugins
#      - ./logs/apisix-${DC_PROFILE}-1:/usr/local/apisix/logs
      - ./logs/apisix-${DC_PROFILE}:/usr/local/apisix/logs
# Comment port và uncomment expose để sử dụng NGINX hoặc HAProxy để dứng ở L4 round-robin đến các container apisix
# Cần config tay thêm nếu trong file apisix.yaml có cấu hình thêm port nào khác như 16443 hoặc 19443.
# Dùng thẳng `network_mode: host` — không cần khai báo port, mọi port APISIX listen đều tự động accessible
    network_mode: host
    user: "0:0"    # ← chạy as root trong container để bind port 80/443
#    ports:
#      - "80:80"         # HTTP
#      - "443:443"       # HTTPS
#      - "16443:16443"   # Port IAM + STS
#      - "19443:19443"   # Port Admin
#      - "9091:9091"     # APISIX metric export

#     expose:
#       - "9080"
#       - "9443"
#       - "9091"
    env_file: .env
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "apisix status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
