# ~/opt/apisix/standalone/sandbox/docker-compose.yml
version: "3.8"
services:

  git-sync-routes:
    image: registry.k8s.io/git-sync/git-sync:v4.2.1
    container_name: git-sync-routes
    restart: unless-stopped
    user: "65533:65533"
    volumes:
      - type: bind
        source: ./conf_routes
        target: /tmp/sync
      - type: bind
        source: ./secrets/.netrc
#        target: /etc/git-secret/.netrc
        target: /tmp/.netrc
        read_only: true
      - type: bind
        source: ./scripts/copy-hook.sh
        target: /tmp/copy-hook.sh
        read_only: true
    environment:
      GITSYNC_REPO: "https://git-lab.infiniband.vn/apisix/apisix-standalone.git"
      GITSYNC_REF: "release/routes"
      GITSYNC_ROOT: "/tmp/sync"
      GITSYNC_LINK: "current"
      GITSYNC_PERIOD: "30s"
      GITSYNC_DEPTH: "1"
      GITSYNC_ADD_USER: "true"
#      GITSYNC_GIT_CONFIG: "credential.helper=store"
#      GITSYNC_SECRET_FILE: "/etc/git-secret/.netrc"
      GITSYNC_MAX_FAILURES: "3"
      HOOK_TYPE: "routes"
      GITSYNC_EXECHOOK_COMMAND: "/tmp/copy-hook.sh"
#      GITSYNC_EXECHOOK_COMMAND: "/bin/cp /tmp/sync/current/apisix-${DC_PROFILE}.yaml /tmp/sync/apisix_routes/apisix-${DC_PROFILE}.yaml"
#      GITSYNC_EXECHOOK_COMMAND: >
#        /bin/sh -c
#        'cp /tmp/sync/current/apisix-${DC_PROFILE}.yaml /tmp/sync/apisix_routes/apisix-${DC_PROFILE}.yaml &&
#         echo "[$(date -Iseconds)] routes synced" >> /tmp/sync/sync.log'
      GITSYNC_EXECHOOK_TIMEOUT: "10s"
      GITSYNC_EXECHOOK_BACKOFF: "5s"
    env_file: .env
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/sync/apisix_routes/apisix-${DC_PROFILE}.yaml"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  git-sync-system:
    image: registry.k8s.io/git-sync/git-sync:v4.2.1
    container_name: git-sync-system
    restart: unless-stopped
    user: "65533:65533"
    volumes:
      - type: bind
        source: ./conf_system
        target: /tmp/sync
      - type: bind
        source: ./secrets/.netrc
#        target: /etc/git-secret/.netrc
        target: /tmp/.netrc
        read_only: true
      - type: bind
        source: ./scripts/copy-hook.sh
        target: /tmp/copy-hook.sh
        read_only: true
    environment:
      GITSYNC_REPO: "https://git-lab.infiniband.vn/apisix/apisix-standalone.git"
      GITSYNC_REF: "release/system"
      GITSYNC_ROOT: "/tmp/sync"
      GITSYNC_LINK: "current"
      GITSYNC_PERIOD: "30s"
      GITSYNC_DEPTH: "1"
      GITSYNC_ADD_USER: "true"
#      GITSYNC_GIT_CONFIG: "credential.helper=store"
#      GITSYNC_SECRET_FILE: "/etc/git-secret/.netrc"
      GITSYNC_MAX_FAILURES: "3"
      HOOK_TYPE: "system"
      GITSYNC_EXECHOOK_COMMAND: "/tmp/copy-hook.sh"
#      GITSYNC_EXECHOOK_COMMAND: "/bin/cp /tmp/sync/current/config-${DC_PROFILE}.yaml /tmp/sync/apisix_config/config-${DC_PROFILE}.yaml"
#      GITSYNC_EXECHOOK_COMMAND: >
#        /bin/sh -c
#        'cp /tmp/sync/current/config-${DC_PROFILE}.yaml /tmp/sync/apisix_config/config-${DC_PROFILE}.yaml &&
#         echo "[$(date -Iseconds)] system synced" >> /tmp/sync/sync.log'
      GITSYNC_EXECHOOK_TIMEOUT: "10s"
#      GITSYNC_EXECHOOK_BACKOFF: "5s"
    env_file: .env
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  apisix-standalone
#  apisix-1:
    image: apache/apisix:3.15.0-debian
#    container_name: apisix-${DC_PROFILE}-1
    container_name: apisix-${DC_PROFILE}
    restart: unless-stopped
    depends_on:
      git-sync-routes:
        condition: service_healthy
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - APISIX_PROFILE=${DC_PROFILE}
    volumes:
      - ./conf_routes/apisix_routes/apisix-${DC_PROFILE}.yaml:/usr/local/apisix/conf/apisix-${DC_PROFILE}.yaml
      - ./conf_system/apisix_config/config-${DC_PROFILE}.yaml:/usr/local/apisix/conf/config-${DC_PROFILE}.yaml:ro
      - ./plugins/ceph-rados-regex.lua:/usr/local/apisix/apisix/plugins/ceph-rados-regex.lua:ro
#      - ./logs/apisix-${DC_PROFILE}-1:/usr/local/apisix/logs
      - ./logs/apisix-${DC_PROFILE}:/usr/local/apisix/logs
# Comment port và uncomment expose để sử dụng NGINX hoặc HAProxy để dứng ở L4 round-robin đến các container apisix
   ports:
     - "9080:9080"
     - "9443:9443"
     - "9091:9091" # metric export
#     expose:
#       - "9080"
#       - "9443"
#       - "9091"
    env_file: .env
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "apisix status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

